name: Traceability Check

on:
  pull_request:
    branches:
      - main
      - production
      - 'release/**'
  push:
    branches:
      - main
      - production
      - 'release/**'
      - 'test/**'
      - 'feature/**'
  workflow_dispatch:

jobs:
  traceability-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate manifest and traceability metadata
        shell: bash
        run: |
          set -euo pipefail

          HEMS_ROOT="HEMS"
          fail=0

          echo "Running traceability check..."

          check_manifest_field() {
            local file="$1"
            local field="$2"

            if ! grep -q "^$field:" "$file"; then
              echo "::error file=$file::Missing required field: $field"
              fail=1
            fi
          }

          check_trace_file() {
            local dir="$1"

            if [[ ! -f "$dir/traceability/trace_links.csv" ]]; then
              echo "::error::$dir must contain traceability/trace_links.csv"
              fail=1
              return
            fi

            if ! grep -q "source,target" "$dir/traceability/trace_links.csv"; then
              echo "::error file=$dir/traceability/trace_links.csv::Trace file must contain source,target header."
              fail=1
            fi
          }

          # Check code manifests
          while IFS= read -r manifest; do
            echo "Checking manifest: $manifest"
            check_manifest_field "$manifest" "module"
            check_manifest_field "$manifest" "type"
            check_manifest_field "$manifest" "version"
            check_manifest_field "$manifest" "delivery_cycle"
          done < <(find "$HEMS_ROOT" -type f \( -name "code-manifest.yaml" -o -name "module-manifest.yaml" -o -name "spec-manifest.yaml" \))

          # Check traceability files per package folder
          for area in CODE_HEMS MOD_HEMS SPEC_HEMS; do
            if [[ -d "$HEMS_ROOT/$area" ]]; then
              while IFS= read -r module_dir; do
                echo "Checking traceability for: $module_dir"
                check_trace_file "$module_dir"
              done < <(find "$HEMS_ROOT/$area" -mindepth 3 -maxdepth 3 -type d)
            fi
          done

          if [[ "$fail" -ne 0 ]]; then
            echo "Traceability check failed."
            exit 1
          fi

          echo "Traceability check passed."