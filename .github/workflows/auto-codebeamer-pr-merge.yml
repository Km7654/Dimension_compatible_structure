name: Auto Codebeamer PR and Merge

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-codebeamer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-codebeamer-pr:
    name: Create and merge PR from tracker commit
    runs-on: ubuntu-latest

    steps:
      - name: Verify required runner tools
        shell: bash
        run: |
          set -euo pipefail

          for tool in git python3 gh base64; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::Required runner tool is missing: $tool"
              exit 1
            fi
          done

      - name: Checkout pushed branch and main using Git
        shell: bash
        env:
          ACCESS_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          REPOSITORY_URL="${SERVER_URL}/${REPOSITORY}.git"

          AUTH_VALUE="$(
            printf 'x-access-token:%s' "$ACCESS_TOKEN" \
              | base64 \
              | tr -d '\n'
          )"

          git init -b "$BRANCH_NAME" .
          git remote add origin "$REPOSITORY_URL"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git config \
            http."${SERVER_URL}/".extraheader \
            "AUTHORIZATION: basic ${AUTH_VALUE}"

          cleanup_auth() {
            git config --unset-all \
              http."${SERVER_URL}/".extraheader \
              2>/dev/null || true
          }

          trap cleanup_auth EXIT

          git fetch --no-tags --prune origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${BRANCH_NAME}:refs/remotes/origin/${BRANCH_NAME}"

          if ! git cat-file -e "${PUSH_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$PUSH_SHA"
          fi

          git checkout --force -B "$BRANCH_NAME" "$PUSH_SHA"
          git clean -ffdx

          cleanup_auth
          trap - EXIT

      - name: Detect tracker, changed code file, and next specification version
        id: detect
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          python3 <<'PYTHON_SCRIPT'
          import os
          import re
          import subprocess

          from pathlib import Path


          branch_name = os.environ["BRANCH_NAME"].strip()
          github_output = Path(os.environ["GITHUB_OUTPUT"])


          def git(*args, check=True):
              result = subprocess.run(
                  ["git", *args],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )

              if check and result.returncode != 0:
                  print(result.stdout)
                  print(result.stderr)

                  raise RuntimeError(
                      "Git command failed: git "
                      + " ".join(args)
                  )

              return result.stdout.strip()


          def output(name, value):
              with github_output.open(
                  "a",
                  encoding="utf-8",
              ) as handle:
                  handle.write(f"{name}={value}\n")


          latest_message = git(
              "log",
              "-1",
              "--format=%B",
          )

          print(f"Branch: {branch_name}")
          print("Latest commit message:")
          print(latest_message)


          tracker_match = re.search(
              r"(?<![A-Za-z0-9])#([0-9]{3,10})(?![0-9])",
              latest_message,
          )

          if not tracker_match:
              print("No Codebeamer tracker ID was found.")
              print(
                  "Expected commit-message format example: #12345"
              )

              output("should_merge", "false")
              output(
                  "skip_reason",
                  "Latest commit does not contain a valid #TrackerID.",
              )

              raise SystemExit(0)


          tracker_id = tracker_match.group(1)

          changed_text = git(
              "diff",
              "--name-only",
              "--diff-filter=ACMR",
              "refs/remotes/origin/main...HEAD",
          )

          changed_files = sorted({
              line.strip()
              for line in changed_text.splitlines()
              if line.strip()
          })


          print("")
          print("Changed files against main:")

          if not changed_files:
              print("- No changed files detected.")

          for changed_file in changed_files:
              print(f"- {changed_file}")


          code_files = []

          for file_name in changed_files:
              parts = file_name.split("/")

              if (
                  len(parts) >= 7
                  and parts[0] == "HEMS"
                  and parts[1] == "CODE_HEMS"
                  and parts[-1].lower().endswith(".c")
                  and Path(file_name).is_file()
              ):
                  code_files.append(file_name)


          code_files = sorted(set(code_files))

          if not code_files:
              raise RuntimeError(
                  "A Tracker ID was found, but no changed "
                  "CODE_HEMS .c file was found. Expected path: "
                  "HEMS/CODE_HEMS/<Function>/<Sub-function>/"
                  "<Module>/<Package>/<File.c>"
              )


          if len(code_files) != 1:
              print("")
              print("Changed CODE_HEMS .c files:")

              for code_file in code_files:
                  print(f"- {code_file}")

              raise RuntimeError(
                  "Exactly one CODE_HEMS .c file is required "
                  "per automatic Codebeamer merge."
              )


          code_file_path = code_files[0]
          parts = code_file_path.split("/")

          function_name = parts[2]
          sub_function = parts[3]
          module = parts[4]
          package = parts[5]
          package_folder = "/".join(parts[:6])
          code_file_name = parts[-1]

          specification_manifest = (
              f"{package_folder}/specification-manifest.yaml"
          )


          manifest_text = ""

          manifest_check = subprocess.run(
              [
                  "git",
                  "cat-file",
                  "-e",
                  (
                      "refs/remotes/origin/main:"
                      f"{specification_manifest}"
                  ),
              ],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          )

          if manifest_check.returncode == 0:
              manifest_text = git(
                  "show",
                  (
                      "refs/remotes/origin/main:"
                      f"{specification_manifest}"
                  ),
              )


          version_match = re.search(
              r"^version:\s*['\"]?([0-9]+)['\"]?\s*$",
              manifest_text,
              re.MULTILINE,
          )

          if not version_match:
              version_match = re.search(
                  (
                      r"^item_version:\s*$"
                      r".*?"
                      r"^\s+version:\s*"
                      r"['\"]?([0-9]+)['\"]?\s*$"
                  ),
                  manifest_text,
                  re.MULTILINE | re.DOTALL,
              )


          current_version = (
              int(version_match.group(1))
              if version_match
              else 0
          )

          next_version = current_version + 1


          # This workflow only calculates the expected next version
          # for the generated PR title and merge message.
          #
          # The separate HEMS Module Baseline workflow performs the
          # actual manifest update after the PR has been merged.
          merge_subject = (
              f"#{tracker_id} "
              f"{code_file_name} "
              f"{next_version}"
          )


          output("should_merge", "true")
          output("tracker_id", tracker_id)
          output("code_file_path", code_file_path)
          output("code_file_name", code_file_name)
          output("function", function_name)
          output("sub_function", sub_function)
          output("module", module)
          output("package", package)
          output("package_folder", package_folder)
          output(
              "specification_manifest",
              specification_manifest,
          )
          output(
              "current_version",
              str(current_version),
          )
          output(
              "next_version",
              str(next_version),
          )
          output("merge_subject", merge_subject)


          print("")
          print("============================================================")
          print("Automatic Codebeamer merge information")
          print("============================================================")
          print(f"Tracker ID: #{tracker_id}")
          print(f"Code file: {code_file_name}")
          print(f"Code file path: {code_file_path}")
          print(f"Function: {function_name}")
          print(f"Sub-function: {sub_function}")
          print(f"Module: {module}")
          print(f"Package: {package}")
          print(
              "Specification manifest on main: "
              f"{specification_manifest}"
          )
          print(
              "Current specification version: "
              f"{current_version}"
          )
          print(
              "Expected version after merge: "
              f"{next_version}"
          )
          print(
              "PR title and merge subject: "
              f"{merge_subject}"
          )
          PYTHON_SCRIPT

      - name: Skip workflow when no Tracker ID is present
        if: steps.detect.outputs.should_merge != 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Automatic PR creation was skipped."
          echo "Reason: ${{ steps.detect.outputs.skip_reason }}"
          echo ""
          echo "The branch remains unchanged."
          echo "A normal Pull Request can still be created and merged manually."

      - name: Create or update Pull Request
        if: steps.detect.outputs.should_merge == 'true'
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST_URL: ${{ github.server_url }}
          GH_REPO: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          MERGE_SUBJECT: ${{ steps.detect.outputs.merge_subject }}
          TRACKER_ID: ${{ steps.detect.outputs.tracker_id }}
          CODE_FILE_PATH: ${{ steps.detect.outputs.code_file_path }}
          CODE_FILE_NAME: ${{ steps.detect.outputs.code_file_name }}
          FUNCTION_NAME: ${{ steps.detect.outputs.function }}
          SUB_FUNCTION: ${{ steps.detect.outputs.sub_function }}
          MODULE: ${{ steps.detect.outputs.module }}
          PACKAGE: ${{ steps.detect.outputs.package }}
          SPECIFICATION_MANIFEST: ${{ steps.detect.outputs.specification_manifest }}
          CURRENT_VERSION: ${{ steps.detect.outputs.current_version }}
          NEXT_VERSION: ${{ steps.detect.outputs.next_version }}
        run: |
          set -euo pipefail

          GH_HOST="${GH_HOST_URL#https://}"
          GH_HOST="${GH_HOST#http://}"

          export GH_HOST GH_REPO

          PR_BODY_FILE="auto-codebeamer-pr-body.md"

          {
            echo "Automatic Pull Request created from a branch commit containing a Codebeamer Tracker ID."
            echo ""
            echo "## Traceability"
            echo ""
            echo "- Tracker: #${TRACKER_ID}"
            echo "- Code file: ${CODE_FILE_NAME}"
            echo "- Code file path: ${CODE_FILE_PATH}"
            echo "- Function: ${FUNCTION_NAME}"
            echo "- Sub-function: ${SUB_FUNCTION}"
            echo "- Module: ${MODULE}"
            echo "- Package: ${PACKAGE}"
            echo ""
            echo "## Version information"
            echo ""
            echo "- Main-only specification manifest: ${SPECIFICATION_MANIFEST}"
            echo "- Current specification version on main: ${CURRENT_VERSION}"
            echo "- Expected specification version after merge: ${NEXT_VERSION}"
            echo ""
            echo "## Generated merge subject"
            echo ""
            echo "${MERGE_SUBJECT}"
            echo ""
            echo "The feature branch does not modify automation-managed manifest files."
            echo "The separate post-merge baseline workflow updates the applicable manifests after this Pull Request is merged."
          } > "$PR_BODY_FILE"


          EXISTING_PR_NUMBER="$(
            gh pr list \
              --base main \
              --head "$BRANCH_NAME" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"


          if [[ -n "$EXISTING_PR_NUMBER" ]]; then
            PR_NUMBER="$EXISTING_PR_NUMBER"

            echo "Updating existing Pull Request #${PR_NUMBER}."

            gh pr edit "$PR_NUMBER" \
              --title "$MERGE_SUBJECT" \
              --body-file "$PR_BODY_FILE"
          else
            echo "Creating Pull Request from ${BRANCH_NAME} to main."

            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "$MERGE_SUBJECT" \
              --body-file "$PR_BODY_FILE"

            PR_NUMBER="$(
              gh pr list \
                --base main \
                --head "$BRANCH_NAME" \
                --state open \
                --json number \
                --jq '.[0].number // empty'
            )"
          fi


          if [[ -z "$PR_NUMBER" ]]; then
            echo "::error::Unable to determine the Pull Request number."
            exit 1
          fi


          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Using Pull Request #${PR_NUMBER}."

      - name: Merge Pull Request with generated message
        if: steps.detect.outputs.should_merge == 'true'
        id: merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST_URL: ${{ github.server_url }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          BRANCH_SHA: ${{ github.sha }}
          MERGE_SUBJECT: ${{ steps.detect.outputs.merge_subject }}
          TRACKER_ID: ${{ steps.detect.outputs.tracker_id }}
          CODE_FILE_PATH: ${{ steps.detect.outputs.code_file_path }}
          CODE_FILE_NAME: ${{ steps.detect.outputs.code_file_name }}
          FUNCTION_NAME: ${{ steps.detect.outputs.function }}
          SUB_FUNCTION: ${{ steps.detect.outputs.sub_function }}
          MODULE: ${{ steps.detect.outputs.module }}
          PACKAGE: ${{ steps.detect.outputs.package }}
          SPECIFICATION_MANIFEST: ${{ steps.detect.outputs.specification_manifest }}
          CURRENT_VERSION: ${{ steps.detect.outputs.current_version }}
          NEXT_VERSION: ${{ steps.detect.outputs.next_version }}
        run: |
          set -euo pipefail

          GH_HOST="${GH_HOST_URL#https://}"
          GH_HOST="${GH_HOST#http://}"

          export GH_HOST GH_REPO

          MERGE_BODY_FILE="auto-codebeamer-merge-body.md"

          {
            echo "Codebeamer tracker: #${TRACKER_ID}"
            echo ""
            echo "Code file: ${CODE_FILE_NAME}"
            echo "Code file path: ${CODE_FILE_PATH}"
            echo "Function: ${FUNCTION_NAME}"
            echo "Sub-function: ${SUB_FUNCTION}"
            echo "Module: ${MODULE}"
            echo "Package: ${PACKAGE}"
            echo "Specification manifest: ${SPECIFICATION_MANIFEST}"
            echo "Previous specification version: ${CURRENT_VERSION}"
            echo "Expected specification version after merge: ${NEXT_VERSION}"
            echo ""
            echo "Automatic merge initiated because the latest branch commit contains #${TRACKER_ID}."
            echo ""
            echo "The specification manifest is updated separately by the HEMS Module Baseline workflow after the merge is confirmed."
          } > "$MERGE_BODY_FILE"


          echo "Merging Pull Request #${PR_NUMBER}."
          echo "Merge subject: ${MERGE_SUBJECT}"


          gh pr merge "$PR_NUMBER" \
            --merge \
            --subject "$MERGE_SUBJECT" \
            --body-file "$MERGE_BODY_FILE" \
            --match-head-commit "$BRANCH_SHA"


          echo "The merge command was submitted successfully."
          echo "Repository rules may delay completion until all required checks pass."

      - name: Confirm merge and trigger post-merge baseline workflow
        if: steps.detect.outputs.should_merge == 'true'
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST_URL: ${{ github.server_url }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail

          GH_HOST="${GH_HOST_URL#https://}"
          GH_HOST="${GH_HOST#http://}"

          export GH_HOST GH_REPO

          echo "Waiting for Pull Request #${PR_NUMBER} to reach merged state."

          MERGED="false"
          MERGE_COMMIT_SHA=""
          MAX_ATTEMPTS=60
          WAIT_SECONDS=5

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            PR_DATA="$(
              gh pr view "$PR_NUMBER" \
                --json state,mergedAt,mergeCommit
            )"

            PR_STATE="$(
              printf '%s' "$PR_DATA" \
                | python3 -c \
                  'import json, sys; print(json.load(sys.stdin).get("state", ""))'
            )"

            MERGED_AT="$(
              printf '%s' "$PR_DATA" \
                | python3 -c \
                  'import json, sys; print(json.load(sys.stdin).get("mergedAt") or "")'
            )"

            MERGE_COMMIT_SHA="$(
              printf '%s' "$PR_DATA" \
                | python3 -c \
                  'import json, sys; data=json.load(sys.stdin); print((data.get("mergeCommit") or {}).get("oid", ""))'
            )"

            echo "Attempt ${attempt}/${MAX_ATTEMPTS}: state=${PR_STATE}"

            if [[ "$PR_STATE" == "MERGED" ]] \
              && [[ -n "$MERGED_AT" ]] \
              && [[ -n "$MERGE_COMMIT_SHA" ]]
            then
              MERGED="true"
              break
            fi

            if [[ "$PR_STATE" == "CLOSED" ]] \
              && [[ -z "$MERGED_AT" ]]
            then
              echo "::error::Pull Request #${PR_NUMBER} was closed without merging."
              exit 1
            fi

            if [[ "$attempt" -eq "$MAX_ATTEMPTS" ]]; then
              break
            fi

            sleep "$WAIT_SECONDS"
          done


          if [[ "$MERGED" != "true" ]]; then
            echo "::error::Pull Request #${PR_NUMBER} was not confirmed as merged."
            echo "::error::The post-merge manifest workflow was not triggered."
            echo "::error::Check required reviews, status checks, and repository merge rules."
            exit 1
          fi


          echo ""
          echo "Pull Request #${PR_NUMBER} is confirmed as merged."
          echo "Merge commit: ${MERGE_COMMIT_SHA}"
          echo ""
          echo "Triggering the HEMS Module Baseline workflow."


          gh api \
            --method POST \
            "repos/${GH_REPO}/dispatches" \
            -f event_type="hems-post-merge" \
            -F "client_payload[pr_number]=${PR_NUMBER}" \
            -F "client_payload[merge_sha]=${MERGE_COMMIT_SHA}"


          echo "Repository dispatch event sent successfully."

          echo "merge_commit_sha=${MERGE_COMMIT_SHA}" \
            >> "$GITHUB_OUTPUT"

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Auto Codebeamer PR and Merge summary"
          echo "============================================================"

          if [[ "${{ steps.detect.outputs.should_merge }}" != "true" ]]; then
            echo "Automatic Pull Request processing was skipped."
            echo "Reason: No supported #TrackerID change was detected."
            exit 0
          fi

          echo "Tracker ID:"
          echo "#${{ steps.detect.outputs.tracker_id }}"
          echo ""

          echo "Code file:"
          echo "${{ steps.detect.outputs.code_file_path }}"
          echo ""

          echo "Specification manifest:"
          echo "${{ steps.detect.outputs.specification_manifest }}"
          echo ""

          echo "Specification version:"
          echo "${{ steps.detect.outputs.current_version }} -> ${{ steps.detect.outputs.next_version }}"
          echo ""

          echo "Pull Request:"
          echo "#${{ steps.pr.outputs.pr_number }}"
          echo ""

          if [[ -n "${{ steps.dispatch.outputs.merge_commit_sha }}" ]]; then
            echo "Merge commit:"
            echo "${{ steps.dispatch.outputs.merge_commit_sha }}"
            echo ""

            echo "Post-merge baseline workflow:"
            echo "Triggered using repository_dispatch event type hems-post-merge."
          else
            echo "The Pull Request merge or post-merge dispatch was not completed."
            echo "Review the previous workflow steps for the failure reason."
          fi
