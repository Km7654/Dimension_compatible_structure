name: Delivery Check

on:
  pull_request:
    branches:
      - main
      - production
      - 'release/**'

  push:
    branches:
      - main
      - production
      - 'release/**'
      - 'test/**'
      - 'feature/**'

  workflow_dispatch:

jobs:
  delivery-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required delivery files
        shell: bash
        run: |
          set -euo pipefail

          HEMS_ROOT="HEMS"
          fail=0

          echo "Running delivery completeness check..."
          echo "Expected structure:"
          echo "HEMS/<AREA>/<Function>/<Sub-function>/<Module>/<Items as direct files>"
          echo ""

          check_file() {
            local file="$1"
            local message="$2"

            if [[ ! -f "$file" ]]; then
              echo "::error::$message Missing file: $file"
              fail=1
            fi
          }

          require_any_file() {
            local dir="$1"
            local message="$2"
            shift 2
            local patterns=("$@")
            local found=0

            for pattern in "${patterns[@]}"; do
              if find "$dir" -maxdepth 1 -type f -iname "$pattern" | grep -q .; then
                found=1
                break
              fi
            done

            if [[ "$found" -ne 1 ]]; then
              echo "::error::$message Path: $dir"
              echo "Expected one of these patterns:"
              for pattern in "${patterns[@]}"; do
                echo "  - $pattern"
              done
              fail=1
            fi
          }

          reject_nested_folders() {
            local dir="$1"
            local message="$2"

            if find "$dir" -mindepth 1 -maxdepth 1 -type d | grep -q .; then
              echo "::error::$message Nested folders are not allowed under: $dir"
              echo "Only direct item files are allowed inside the module folder."
              echo "Nested folders found:"
              find "$dir" -mindepth 1 -maxdepth 1 -type d | sort
              fail=1
            fi
          }

          check_trace_links() {
            local trace_file="$1"
            local message="$2"

            if [[ ! -f "$trace_file" ]]; then
              echo "::error::$message Missing traceability file: $trace_file"
              fail=1
              return
            fi

            if ! head -n 1 "$trace_file" | grep -q "source,target"; then
              echo "::error file=$trace_file::Traceability file must contain source,target header."
              fail=1
            fi
          }

          check_manifest_exists() {
            local manifest_file="$1"
            local message="$2"

            if [[ ! -f "$manifest_file" ]]; then
              echo "::error::$message Missing manifest: $manifest_file"
              fail=1
            fi
          }

          echo "Checking CODE_HEMS packages..."

          if [[ -d "$HEMS_ROOT/CODE_HEMS" ]]; then
            while IFS= read -r code_dir; do
              echo ""
              echo "Checking code package: $code_dir"

              reject_nested_folders "$code_dir" "Invalid code package structure."

              check_manifest_exists "$code_dir/code-manifest.yaml" "Code manifest is required."
              check_trace_links "$code_dir/trace_links.csv" "Code traceability file is required."

              require_any_file "$code_dir" "At least one generated .c source file is required." "*.c"
              require_any_file "$code_dir" "At least one generated .h header file is required." "*.h"

              require_any_file "$code_dir" "Compiler log is required." "*compiler*log*" "*.log"
              require_any_file "$code_dir" "Static analysis report is required." "*static*analysis*" "*lint*" "*mxam*"
              require_any_file "$code_dir" "SIL or unit test output is required." "*sil*" "*unit*test*" "*unit*"
              require_any_file "$code_dir" "Certification evidence is required." "*certification*" "*certificate*" "*cert*"

            done < <(find "$HEMS_ROOT/CODE_HEMS" -mindepth 3 -maxdepth 3 -type d | sort)
          else
            echo "::error::HEMS/CODE_HEMS folder is missing."
            fail=1
          fi

          echo ""
          echo "Checking MOD_HEMS packages..."

          if [[ -d "$HEMS_ROOT/MOD_HEMS" ]]; then
            while IFS= read -r mod_dir; do
              echo ""
              echo "Checking module package: $mod_dir"

              reject_nested_folders "$mod_dir" "Invalid module package structure."

              check_manifest_exists "$mod_dir/module-manifest.yaml" "Module manifest is required."
              check_trace_links "$mod_dir/trace_links.csv" "Module traceability file is required."

              require_any_file "$mod_dir" "Simulink model file is required." "*.slx"
              require_any_file "$mod_dir" "Dictionary file is required." "*.sldd"
              require_any_file "$mod_dir" "Interface file is required." "*interface*.xlsx" "*interface*.xml" "*interface*.txt"
              require_any_file "$mod_dir" "Variant file is required." "*variant*.xlsx" "*variant*.txt" "*variant*.slx"
              require_any_file "$mod_dir" "Stimuli or test input file is required." "*.mat" "*stimuli*" "*test*input*" "*.csv" "*.xlsx"
              require_any_file "$mod_dir" "Calibration file or calibration evidence is required." "*calibration*" "*.a2l" "*.html"
              require_any_file "$mod_dir" "Analysis evidence is required." "*analysis*"
              require_any_file "$mod_dir" "EAST or module report evidence is required." "*east*" "*report*" "*.pdf"
              require_any_file "$mod_dir" "Delivery package or delivery evidence is required." "*delivery*" "*.zip"
              require_any_file "$mod_dir" "SOF reference is required." "*sof*"
              require_any_file "$mod_dir" "MDT reference is required." "*mdt*"

            done < <(find "$HEMS_ROOT/MOD_HEMS" -mindepth 3 -maxdepth 3 -type d | sort)
          else
            echo "::error::HEMS/MOD_HEMS folder is missing."
            fail=1
          fi

          echo ""
          echo "Checking SPEC_HEMS packages..."

          if [[ -d "$HEMS_ROOT/SPEC_HEMS" ]]; then
            while IFS= read -r spec_dir; do
              echo ""
              echo "Checking specification package: $spec_dir"

              reject_nested_folders "$spec_dir" "Invalid specification package structure."

              check_manifest_exists "$spec_dir/spec-manifest.yaml" "Specification manifest is required."
              check_trace_links "$spec_dir/trace_links.csv" "Specification traceability file is required."

              require_any_file "$spec_dir" "Specification source file is required." "*source*" "*.xml" "*.xlsx" "*.txt"
              require_any_file "$spec_dir" "Specification PDF file is required." "*.pdf"
              require_any_file "$spec_dir" "Comparison report is required." "*comparison*"
              require_any_file "$spec_dir" "History file is required." "*history*"
              require_any_file "$spec_dir" "CRS or interface specification file is required." "*crs*" "*interface*"
              require_any_file "$spec_dir" "SDT reference is required." "*sdt*"
              require_any_file "$spec_dir" "Technical Fact reference is required." "*technical*fact*" "*tf*"

            done < <(find "$HEMS_ROOT/SPEC_HEMS" -mindepth 3 -maxdepth 3 -type d | sort)
          else
            echo "::error::HEMS/SPEC_HEMS folder is missing."
            fail=1
          fi

          echo ""
          echo "Delivery check summary:"
          if [[ "$fail" -ne 0 ]]; then
            echo "Delivery check failed."
            exit 1
          fi

          echo "Delivery check passed."