name: Structure Check

on:
  pull_request:
    branches:
      - main
      - production
      - 'release/**'

  push:
    branches:
      - main
      - production
      - 'release/**'
      - 'test/**'
      - 'feature/**'

  workflow_dispatch:

jobs:
  structure-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          else
            BASE_SHA="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
            HEAD_SHA="$(git rev-parse HEAD)"
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            git ls-files > changed_files.txt
          else
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" > changed_files.txt || true
          fi

          echo "Changed files:"
          cat changed_files.txt || true

      - name: Validate folder structure under HEMS
        shell: bash
        run: |
          set -euo pipefail

          HEMS_ROOT="HEMS"
          fail=0
          checked_hems_files=0

          echo "Running HEMS structure check..."
          echo "Expected controlled structure:"
          echo "HEMS/<AREA>/<Function>/<Sub-function>/<Module>/<Item>"
          echo ""

          is_supported_spec_item() {
            local item="$1"

            case "$item" in
              spec-manifest.yaml) return 0 ;;
              trace_links.csv) return 0 ;;
              *.xml) return 0 ;;
              *.pdf) return 0 ;;
              *.txt) return 0 ;;
              *.csv) return 0 ;;
              *.xlsx) return 0 ;;
              *.html) return 0 ;;
              *.md) return 0 ;;
              *.json) return 0 ;;
              *.yaml) return 0 ;;
              *.yml) return 0 ;;
              *.docx) return 0 ;;
              *) return 1 ;;
            esac
          }

          is_supported_mod_item() {
            local item="$1"

            case "$item" in
              module-manifest.yaml) return 0 ;;
              trace_links.csv) return 0 ;;
              *.slx) return 0 ;;
              *.mdl) return 0 ;;
              *.sldd) return 0 ;;
              *.mat) return 0 ;;
              *.m) return 0 ;;
              *.mldatx) return 0 ;;
              *.xlsx) return 0 ;;
              *.csv) return 0 ;;
              *.html) return 0 ;;
              *.pdf) return 0 ;;
              *.txt) return 0 ;;
              *.xml) return 0 ;;
              *.zip) return 0 ;;
              *.a2l) return 0 ;;
              *.json) return 0 ;;
              *.yaml) return 0 ;;
              *.yml) return 0 ;;
              *) return 1 ;;
            esac
          }

          is_supported_code_item() {
            local item="$1"

            case "$item" in
              code-manifest.yaml) return 0 ;;
              trace_links.csv) return 0 ;;
              *.c) return 0 ;;
              *.h) return 0 ;;
              *.cpp) return 0 ;;
              *.hpp) return 0 ;;
              *.txt) return 0 ;;
              *.csv) return 0 ;;
              *.html) return 0 ;;
              *.pdf) return 0 ;;
              *.log) return 0 ;;
              *.xml) return 0 ;;
              *.json) return 0 ;;
              *.yaml) return 0 ;;
              *.yml) return 0 ;;
              *) return 1 ;;
            esac
          }

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            if [[ "$file" != "$HEMS_ROOT/"* ]]; then
              echo "Skipping non-HEMS file: $file"
              continue
            fi

            # Allowed support areas under HEMS.
            # These are not validated as controlled engineering package content.
            if [[ "$file" == "$HEMS_ROOT/BASELINES/"* ]] || \
               [[ "$file" == "$HEMS_ROOT/DELIVERY_REQUESTS/"* ]] || \
               [[ "$file" == "$HEMS_ROOT/INCOMING/"* ]] || \
               [[ "$file" == "$HEMS_ROOT/README.md" ]] || \
               [[ "$file" == "$HEMS_ROOT/CODEOWNERS" ]] || \
               [[ "$file" == "$HEMS_ROOT/.gitignore" ]] || \
               [[ "$file" == "$HEMS_ROOT/.gitattributes" ]]; then
              echo "Skipping allowed support path: $file"
              continue
            fi

            if [[ "$(basename "$file")" == ".keep" ]]; then
              echo "Skipping placeholder file: $file"
              continue
            fi

            echo "Checking HEMS file: $file"
            checked_hems_files=$((checked_hems_files + 1))

            IFS='/' read -r -a parts <<< "$file"

            # Required final structure:
            # HEMS / AREA / Function / Sub-function / Module / Item
            if (( ${#parts[@]} != 6 )); then
              echo "::error file=$file::Invalid structure. Path must be exactly HEMS/AREA/Function/Sub-function/Module/Item. Nested item folders are not allowed."
              fail=1
              continue
            fi

            root="${parts[0]}"
            area="${parts[1]}"
            function_name="${parts[2]}"
            sub_function="${parts[3]}"
            module="${parts[4]}"
            item="${parts[5]}"

            if [[ "$root" != "$HEMS_ROOT" ]]; then
              echo "::error file=$file::Path must start with HEMS."
              fail=1
              continue
            fi

            if [[ "$area" != "SPEC_HEMS" && "$area" != "MOD_HEMS" && "$area" != "CODE_HEMS" ]]; then
              echo "::error file=$file::Area must be SPEC_HEMS, MOD_HEMS, or CODE_HEMS."
              fail=1
              continue
            fi

            if [[ -z "$function_name" || -z "$sub_function" || -z "$module" || -z "$item" ]]; then
              echo "::error file=$file::Function, Sub-function, Module, and Item must not be empty."
              fail=1
              continue
            fi

            case "$area" in
              SPEC_HEMS)
                if ! is_supported_spec_item "$item"; then
                  echo "::error file=$file::Unsupported SPEC_HEMS item type: $item"
                  fail=1
                  continue
                fi
                ;;

              MOD_HEMS)
                if ! is_supported_mod_item "$item"; then
                  echo "::error file=$file::Unsupported MOD_HEMS item type: $item"
                  fail=1
                  continue
                fi
                ;;

              CODE_HEMS)
                if ! is_supported_code_item "$item"; then
                  echo "::error file=$file::Unsupported CODE_HEMS item type: $item"
                  fail=1
                  continue
                fi
                ;;
            esac

          done < changed_files.txt

          echo ""
          echo "Total HEMS files checked: $checked_hems_files"

          if [[ "$fail" -ne 0 ]]; then
            echo "Structure check failed."
            exit 1
          fi

          echo "Structure check passed."