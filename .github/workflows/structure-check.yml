name: Structure Check

on:
  pull_request:
    branches:
      - main
      - production
      - "release/**"

  push:
    branches:
      - main
      - production
      - "release/**"
      - "test/**"
      - "feature/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure-check:
    name: Validate changed HEMS paths
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          BASE_SHA=""
          HEAD_SHA=""

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"

            echo "Pull request event detected."
            echo "Base SHA: $BASE_SHA"
            echo "Head SHA: $HEAD_SHA"

          elif [[ "$EVENT_NAME" == "push" ]]; then
            BASE_SHA="$PUSH_BEFORE_SHA"
            HEAD_SHA="$CURRENT_SHA"

            echo "Push event detected."
            echo "Before SHA: $BASE_SHA"
            echo "Current SHA: $HEAD_SHA"

          else
            BASE_SHA="$(git rev-parse HEAD~1 2>/dev/null || true)"
            HEAD_SHA="$(git rev-parse HEAD)"

            echo "Manual workflow event detected."
            echo "Base SHA: ${BASE_SHA:-not available}"
            echo "Head SHA: $HEAD_SHA"
          fi

          if [[ -z "$BASE_SHA" ]] || \
             [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]] || \
             ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then

            echo ""
            echo "A valid base commit is not available."
            echo "All currently tracked files will be checked."

            git ls-files > changed_files.txt
          else
            git diff \
              --name-only \
              --diff-filter=ACMR \
              "$BASE_SHA" \
              "$HEAD_SHA" \
              > changed_files.txt || true
          fi

          echo ""
          echo "Changed files:"
          cat changed_files.txt || true

      - name: Validate folder structure under HEMS
        shell: bash
        run: |
          set -euo pipefail

          HEMS_ROOT="HEMS"
          RELEASE_SUFFIX="RI_16_0(1.0)"

          ALLOWED_AREAS=(
            "CODE_HEMS"
            "MOD_HEMS"
            "SPEC_HEMS"
          )

          ALLOWED_VARIANTS=(
            "adacxxx2xg"
            "adacxxx4xg"
            "obmxxxx1xg"
          )

          fail=0
          checked_hems_files=0
          checked_item_level_files=0
          checked_package_level_files=0

          echo "============================================================"
          echo "Changed HEMS path structure check"
          echo "============================================================"
          echo ""
          echo "Allowed item-level file path:"
          echo "HEMS/<AREA>/<Function>/<Sub-function>/<Item>/<File>"
          echo ""
          echo "Allowed package-level file path:"
          echo "HEMS/<AREA>/<Function>/<Sub-function>/<Item>/<PackageFolder>/<File>"
          echo ""
          echo "Naming relationships:"
          echo "1. Sub-function must start with <Function>_"
          echo "2. Item must start with <Sub-function>_"
          echo "3. Package folder must contain the complete item name"
          echo ""

          report_error() {
            local file_path="$1"
            local message="$2"

            echo "::error file=$file_path::$message"
            fail=1
          }

          is_allowed_area() {
            local area_name="$1"
            local allowed_area

            for allowed_area in "${ALLOWED_AREAS[@]}"; do
              if [[ "$area_name" == "$allowed_area" ]]; then
                return 0
              fi
            done

            return 1
          }

          validate_simple_folder_name() {
            local file_path="$1"
            local folder_name="$2"
            local folder_type="$3"

            if [[ -z "$folder_name" ]]; then
              report_error \
                "$file_path" \
                "$folder_type folder name must not be empty."

              return
            fi

            if [[ "$folder_name" =~ [[:space:]] ]]; then
              report_error \
                "$file_path" \
                "$folder_type folder name must not contain spaces. Found '$folder_name'."
            fi

            if [[ ! "$folder_name" =~ ^[A-Za-z0-9_]+$ ]]; then
              report_error \
                "$file_path" \
                "$folder_type folder name may contain only letters, numbers, and underscores. Found '$folder_name'."
            fi

            if [[ "$folder_name" == *_ ]]; then
              report_error \
                "$file_path" \
                "$folder_type folder name must not end with an underscore. Found '$folder_name'."
            fi
          }

          validate_function_name() {
            local file_path="$1"
            local function_name="$2"

            validate_simple_folder_name \
              "$file_path" \
              "$function_name" \
              "Function"
          }

          validate_subfunction_name() {
            local file_path="$1"
            local function_name="$2"
            local subfunction_name="$3"

            validate_simple_folder_name \
              "$file_path" \
              "$subfunction_name" \
              "Sub-function"

            local required_prefix="${function_name}_"

            if [[ "$subfunction_name" != "${required_prefix}"* ]]; then
              report_error \
                "$file_path" \
                "Sub-function '$subfunction_name' must start with '${required_prefix}'."
              return
            fi

            if [[ "$subfunction_name" == "$required_prefix" ]]; then
              report_error \
                "$file_path" \
                "Sub-function '$subfunction_name' must contain a name after '${required_prefix}'."
            fi
          }

          validate_item_name() {
            local file_path="$1"
            local subfunction_name="$2"
            local item_name="$3"

            validate_simple_folder_name \
              "$file_path" \
              "$item_name" \
              "Item"

            local required_prefix="${subfunction_name}_"

            if [[ "$item_name" != "${required_prefix}"* ]]; then
              report_error \
                "$file_path" \
                "Item '$item_name' must start with '${required_prefix}'."
              return
            fi

            if [[ "$item_name" == "$required_prefix" ]]; then
              report_error \
                "$file_path" \
                "Item '$item_name' must contain a name after '${required_prefix}'."
            fi
          }

          validate_package_name() {
            local file_path="$1"
            local area_name="$2"
            local item_name="$3"
            local package_name="$4"

            local matched=0
            local variant
            local expected_package_name

            for variant in "${ALLOWED_VARIANTS[@]}"; do
              if [[ "$area_name" == "SPEC_HEMS" ]]; then
                expected_package_name="s_${item_name}_${variant}_SPEC_${RELEASE_SUFFIX}"
              else
                expected_package_name="a_${item_name}_${variant}_A_${RELEASE_SUFFIX}"
              fi

              if [[ "$package_name" == "$expected_package_name" ]]; then
                matched=1
                break
              fi
            done

            if [[ "$matched" -eq 1 ]]; then
              return
            fi

            echo "::error file=$file_path::Invalid package folder name '$package_name'."
            echo "Area: $area_name"
            echo "Parent item: $item_name"
            echo ""
            echo "Expected one of these package-folder names:"

            for variant in "${ALLOWED_VARIANTS[@]}"; do
              if [[ "$area_name" == "SPEC_HEMS" ]]; then
                expected_package_name="s_${item_name}_${variant}_SPEC_${RELEASE_SUFFIX}"
              else
                expected_package_name="a_${item_name}_${variant}_A_${RELEASE_SUFFIX}"
              fi

              echo "  - $expected_package_name"
            done

            fail=1
          }

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            if [[ "$file" != "$HEMS_ROOT/"* ]]; then
              echo "Skipping non-HEMS file: $file"
              continue
            fi

            # Support areas are accepted but are not treated as controlled
            # CODE_HEMS, MOD_HEMS, or SPEC_HEMS engineering content.
            if [[ "$file" == "$HEMS_ROOT/BASELINES/"* ]] || \
               [[ "$file" == "$HEMS_ROOT/DELIVERY_REQUESTS/"* ]] || \
               [[ "$file" == "$HEMS_ROOT/INCOMING/"* ]] || \
               [[ "$file" == "$HEMS_ROOT/README.md" ]] || \
               [[ "$file" == "$HEMS_ROOT/CODEOWNERS" ]] || \
               [[ "$file" == "$HEMS_ROOT/.gitignore" ]] || \
               [[ "$file" == "$HEMS_ROOT/.gitattributes" ]]; then

              echo "Skipping allowed HEMS support path: $file"
              continue
            fi

            if [[ "$(basename "$file")" == ".keep" ]]; then
              echo "Skipping placeholder file: $file"
              continue
            fi

            echo ""
            echo "Checking HEMS path: $file"

            checked_hems_files=$((checked_hems_files + 1))

            IFS="/" read -r -a parts <<< "$file"

            part_count="${#parts[@]}"

            # Valid item-level file:
            #
            # HEMS / AREA / Function / Sub-function / Item / File
            #
            # Valid package-level file:
            #
            # HEMS / AREA / Function / Sub-function / Item /
            # PackageFolder / File
            if (( part_count != 6 && part_count != 7 )); then
              report_error \
                "$file" \
                "Invalid path depth. Expected either HEMS/AREA/Function/Sub-function/Item/File or HEMS/AREA/Function/Sub-function/Item/PackageFolder/File."

              continue
            fi

            root="${parts[0]}"
            area="${parts[1]}"
            function_name="${parts[2]}"
            subfunction_name="${parts[3]}"
            item_name="${parts[4]}"

            if [[ "$root" != "$HEMS_ROOT" ]]; then
              report_error \
                "$file" \
                "Path must start with '${HEMS_ROOT}'."

              continue
            fi

            if ! is_allowed_area "$area"; then
              report_error \
                "$file" \
                "Area '$area' is invalid. Area must be CODE_HEMS, MOD_HEMS, or SPEC_HEMS."

              continue
            fi

            validate_function_name \
              "$file" \
              "$function_name"

            validate_subfunction_name \
              "$file" \
              "$function_name" \
              "$subfunction_name"

            validate_item_name \
              "$file" \
              "$subfunction_name" \
              "$item_name"

            if (( part_count == 6 )); then
              item_level_file="${parts[5]}"

              checked_item_level_files=$((checked_item_level_files + 1))

              echo "  Area:           $area"
              echo "  Function:       $function_name"
              echo "  Sub-function:   $subfunction_name"
              echo "  Item:           $item_name"
              echo "  Item-level file: $item_level_file"

              # No validation is applied to item-level file names.
              # Examples that are permitted:
              #
              # code-manifest.yaml
              # module-manifest.yaml
              # spec-manifest.yaml
              # trace_links.csv
              # any-other-file

            elif (( part_count == 7 )); then
              package_name="${parts[5]}"
              package_file="${parts[6]}"

              checked_package_level_files=$((checked_package_level_files + 1))

              echo "  Area:           $area"
              echo "  Function:       $function_name"
              echo "  Sub-function:   $subfunction_name"
              echo "  Item:           $item_name"
              echo "  Package folder: $package_name"
              echo "  Package file:   $package_file"

              validate_package_name \
                "$file" \
                "$area" \
                "$item_name" \
                "$package_name"

              # No validation is applied to files inside the package folder.
            fi

          done < changed_files.txt

          echo ""
          echo "============================================================"
          echo "Structure check summary"
          echo "============================================================"
          echo "Changed HEMS files checked:  $checked_hems_files"
          echo "Item-level files checked:    $checked_item_level_files"
          echo "Package-level files checked: $checked_package_level_files"
          echo ""

          if [[ "$checked_hems_files" -eq 0 ]]; then
            echo "No controlled HEMS files were changed."
          fi

          if [[ "$fail" -ne 0 ]]; then
            echo "Structure check failed."
            exit 1
          fi

          echo "Structure check passed."