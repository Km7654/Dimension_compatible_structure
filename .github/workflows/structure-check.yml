name: Structure Check

on:
  pull_request:
    branches:
      - main
      - production
      - "release/**"
  push:
    branches:
      - main
      - production
      - "release/**"
      - "test/**"
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure-check:
    name: Validate changed HEMS paths
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE_SHA=""
          HEAD_SHA=""

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"; HEAD_SHA="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            BASE_SHA="$PUSH_BEFORE_SHA"; HEAD_SHA="$CURRENT_SHA"
          else
            BASE_SHA="$(git rev-parse HEAD~1 2>/dev/null || true)"
            HEAD_SHA="$(git rev-parse HEAD)"
          fi

          if [[ -z "$BASE_SHA" ]] || [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git ls-files > changed_files.txt
          else
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" > changed_files.txt || true
          fi

          echo "Changed files:"
          cat changed_files.txt || true

      - name: Validate folder structure under HEMS
        shell: bash
        run: |
          set -euo pipefail

          HEMS_ROOT="HEMS"
          RELEASE_SUFFIX="RI_16_0(1.0)"
          ALLOWED_AREAS=("CODE_HEMS" "MOD_HEMS" "SPEC_HEMS")
          ALLOWED_VARIANTS=("adacxxx2xg" "adacxxx4xg" "obmxxxx1xg" "obmxxxx2xg")

          fail=0
          checked_hems_files=0
          checked_module_level_files=0
          checked_package_level_files=0

          report_error() {
            local file_path="$1" message="$2"
            echo "::error file=$file_path::$message"
            fail=1
          }

          array_contains() {
            local sought="$1"; shift
            local value
            for value in "$@"; do [[ "$value" == "$sought" ]] && return 0; done
            return 1
          }

          validate_simple_name() {
            local path="$1" name="$2" type="$3"
            [[ -n "$name" ]] || { report_error "$path" "$type name must not be empty."; return; }
            [[ ! "$name" =~ [[:space:]] ]] || report_error "$path" "$type name must not contain spaces: '$name'."
            [[ "$name" =~ ^[A-Za-z0-9_]+$ ]] || report_error "$path" "$type name may contain only letters, numbers, and underscores: '$name'."
            [[ "$name" != *_ ]] || report_error "$path" "$type name must not end with an underscore: '$name'."
          }

          validate_hierarchy() {
            local path="$1" function_name="$2" subfunction_name="$3" module_name="$4"
            validate_simple_name "$path" "$function_name" "Function"
            validate_simple_name "$path" "$subfunction_name" "Sub-function"
            validate_simple_name "$path" "$module_name" "Module"
            [[ "$subfunction_name" == "${function_name}_"* && "$subfunction_name" != "${function_name}_" ]] || report_error "$path" "Sub-function '$subfunction_name' must start with '${function_name}_' and include a name."
            [[ "$module_name" == "${subfunction_name}_"* && "$module_name" != "${subfunction_name}_" ]] || report_error "$path" "Module '$module_name' must start with '${subfunction_name}_' and include a name."
          }

          validate_package_name() {
            local path="$1" area="$2" module_name="$3" package="$4"
            local expected variant
            case "$area" in
              MOD_HEMS)
                expected="a_${module_name}_T_A"
                [[ "$package" == "$expected" ]] || report_error "$path" "Invalid MOD_HEMS package '$package'. Expected '$expected'."
                ;;
              SPEC_HEMS)
                for variant in "${ALLOWED_VARIANTS[@]}"; do [[ "$package" == "a_${module_name}_${variant}_A" ]] && return 0; done
                report_error "$path" "Invalid SPEC_HEMS package '$package'."
                ;;
              CODE_HEMS)
                for variant in "${ALLOWED_VARIANTS[@]}"; do [[ "$package" == "a_${module_name}_${variant}_A_${RELEASE_SUFFIX}" ]] && return 0; done
                report_error "$path" "Invalid CODE_HEMS package '$package'."
                ;;
            esac
          }

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            [[ "$file" == "$HEMS_ROOT/"* ]] || { echo "Skipping non-HEMS file: $file"; continue; }

            if [[ "$file" == "$HEMS_ROOT/BASELINES/"* ]] || [[ "$file" == "$HEMS_ROOT/DELIVERY_REQUESTS/"* ]] || [[ "$file" == "$HEMS_ROOT/INCOMING/"* ]] || [[ "$file" == "$HEMS_ROOT/README.md" ]] || [[ "$file" == "$HEMS_ROOT/CODEOWNERS" ]] || [[ "$file" == "$HEMS_ROOT/.gitignore" ]] || [[ "$file" == "$HEMS_ROOT/.gitattributes" ]] || [[ "$(basename "$file")" == ".keep" ]]; then
              echo "Skipping allowed support path: $file"
              continue
            fi

            checked_hems_files=$((checked_hems_files + 1))
            IFS="/" read -r -a parts <<< "$file"
            part_count="${#parts[@]}"

            # Module-level file: HEMS/AREA/Function/Sub-function/Module/File
            # Package-level file: HEMS/AREA/Function/Sub-function/Module/Package/File
            if (( part_count != 6 && part_count != 7 )); then
              report_error "$file" "Invalid path depth. Expected a module-level or package-level file path."
              continue
            fi

            area="${parts[1]}"; function_name="${parts[2]}"; subfunction_name="${parts[3]}"; module_name="${parts[4]}"
            array_contains "$area" "${ALLOWED_AREAS[@]}" || { report_error "$file" "Invalid controlled area '$area'."; continue; }
            validate_hierarchy "$file" "$function_name" "$subfunction_name" "$module_name"

            if (( part_count == 6 )); then
              checked_module_level_files=$((checked_module_level_files + 1))
              echo "Validating module-level file: $file"
            else
              checked_package_level_files=$((checked_package_level_files + 1))
              validate_package_name "$file" "$area" "$module_name" "${parts[5]}"
              echo "Validating package-level file: $file"
            fi
          done < changed_files.txt

          echo "Changed HEMS files checked:  $checked_hems_files"
          echo "Module-level files checked:  $checked_module_level_files"
          echo "Package-level files checked: $checked_package_level_files"

          [[ "$fail" -eq 0 ]] || { echo "Structure check failed."; exit 1; }
          echo "Structure check passed."
