name: HEMS Module Baseline

on:
  pull_request:
    types:
      - closed
    branches:
      - main

  # Used when the Auto Codebeamer workflow merges a PR using GITHUB_TOKEN.
  repository_dispatch:
    types:
      - hems-post-merge

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: hems-module-baseline-main
  cancel-in-progress: false

jobs:
  prepare-event:
    name: Resolve merged Pull Request
    runs-on: ubuntu-latest

    outputs:
      should_process: ${{ steps.resolve.outputs.should_process }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      pr_title: ${{ steps.resolve.outputs.pr_title }}
      source_branch: ${{ steps.resolve.outputs.source_branch }}
      target_branch: ${{ steps.resolve.outputs.target_branch }}
      merge_sha: ${{ steps.resolve.outputs.merge_sha }}

    steps:
      - name: Verify required tools
        shell: bash
        run: |
          set -euo pipefail

          for tool in gh python3; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::Required runner tool is missing: $tool"
              exit 1
            fi
          done

      - name: Resolve merged Pull Request information
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST_URL: ${{ github.server_url }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_MERGED: ${{ github.event.pull_request.merged }}
          DISPATCH_PR_NUMBER: ${{ github.event.client_payload.pr_number }}
        run: |
          set -euo pipefail

          GH_HOST="${GH_HOST_URL#https://}"
          GH_HOST="${GH_HOST#http://}"
          export GH_HOST GH_REPO

          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            PR_NUMBER="$DISPATCH_PR_NUMBER"
          else
            PR_NUMBER="$EVENT_PR_NUMBER"
          fi

          if [[ -z "$PR_NUMBER" ]]; then
            echo "::error::Pull Request number is unavailable."
            exit 1
          fi

          echo "Resolving Pull Request #${PR_NUMBER}."

          gh pr view "$PR_NUMBER" \
            --json number,title,state,mergedAt,baseRefName,headRefName,mergeCommit \
            > merged-pr.json

          python3 <<'PYTHON_SCRIPT'
          import json
          import os
          from pathlib import Path

          data = json.loads(
              Path("merged-pr.json").read_text(encoding="utf-8")
          )

          github_output = Path(os.environ["GITHUB_OUTPUT"])

          state = data.get("state", "")
          merged_at = data.get("mergedAt")
          merge_commit = data.get("mergeCommit") or {}
          merge_sha = merge_commit.get("oid", "")

          if state != "MERGED" or not merged_at or not merge_sha:
              with github_output.open("a", encoding="utf-8") as handle:
                  handle.write("should_process=false\n")

              print(
                  f"Pull Request #{data.get('number')} "
                  "is not confirmed as merged."
              )
              raise SystemExit(0)

          values = {
              "should_process": "true",
              "pr_number": str(data["number"]),
              "pr_title": data.get("title", ""),
              "source_branch": data.get("headRefName", ""),
              "target_branch": data.get("baseRefName", ""),
              "merge_sha": merge_sha,
          }

          with github_output.open("a", encoding="utf-8") as handle:
              for key, value in values.items():
                  delimiter = f"EOF_{key.upper()}"
                  handle.write(f"{key}<<{delimiter}\n")
                  handle.write(f"{value}\n")
                  handle.write(f"{delimiter}\n")

          print(f"Resolved merged Pull Request #{data['number']}")
          print(f"Source branch: {data.get('headRefName', '')}")
          print(f"Target branch: {data.get('baseRefName', '')}")
          print(f"Merge commit: {merge_sha}")
          PYTHON_SCRIPT

  create-module-baseline:
    name: Update manifests and create module baselines
    needs:
      - prepare-event

    if: needs.prepare-event.outputs.should_process == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Verify required runner tools
        shell: bash
        run: |
          set -euo pipefail

          for tool in git python3 base64; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::Required runner tool is missing: $tool"
              exit 1
            fi
          done

      - name: Checkout latest main and fetch complete history
        shell: bash
        env:
          ACCESS_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ needs.prepare-event.outputs.merge_sha }}
        run: |
          set -euo pipefail

          REPOSITORY_URL="${SERVER_URL}/${REPOSITORY}.git"

          AUTH_VALUE="$(
            printf 'x-access-token:%s' "$ACCESS_TOKEN" \
              | base64 \
              | tr -d '\n'
          )"

          git init -b main .
          git remote add origin "$REPOSITORY_URL"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git config \
            http."${SERVER_URL}/".extraheader \
            "AUTHORIZATION: basic ${AUTH_VALUE}"

          cleanup_auth() {
            git config --unset-all \
              http."${SERVER_URL}/".extraheader \
              2>/dev/null || true
          }

          trap cleanup_auth EXIT

          git fetch --prune origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/*:refs/tags/*"

          if ! git cat-file -e "${MERGE_SHA}^{commit}" 2>/dev/null; then
            git fetch origin "$MERGE_SHA"
          fi

          git checkout --force -B main refs/remotes/origin/main
          git clean -ffdx

          cleanup_auth
          trap - EXIT

      - name: Update manifests and create required baselines
        id: baseline
        shell: bash
        env:
          MERGE_SHA: ${{ needs.prepare-event.outputs.merge_sha }}
          PR_NUMBER: ${{ needs.prepare-event.outputs.pr_number }}
          PR_TITLE: ${{ needs.prepare-event.outputs.pr_title }}
          SOURCE_BRANCH: ${{ needs.prepare-event.outputs.source_branch }}
          TARGET_BRANCH: ${{ needs.prepare-event.outputs.target_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          python3 <<'PYTHON_SCRIPT'
          import hashlib
          import os
          import re
          import shutil
          import subprocess
          import zipfile

          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path


          merge_sha = os.environ["MERGE_SHA"].strip()
          pr_number = os.environ["PR_NUMBER"].strip()
          pr_title = os.environ["PR_TITLE"].strip()
          source_branch = os.environ["SOURCE_BRANCH"].strip()
          target_branch = os.environ["TARGET_BRANCH"].strip()
          repository = os.environ["REPOSITORY"].strip()

          github_output = Path(os.environ["GITHUB_OUTPUT"])

          generated_utc = datetime.now(timezone.utc).strftime(
              "%Y-%m-%dT%H:%M:%SZ"
          )

          CONTROLLED_AREAS = {
              "CODE_HEMS",
              "MOD_HEMS",
              "SPEC_HEMS",
          }

          SPECIFICATION_AREAS = {
              "CODE_HEMS",
              "SPEC_HEMS",
          }

          MODULE_MANIFEST_BY_AREA = {
              "CODE_HEMS": "code-manifest.yaml",
              "MOD_HEMS": "module-manifest.yaml",
              "SPEC_HEMS": "spec-manifest.yaml",
          }

          MODULE_TYPE_BY_AREA = {
              "CODE_HEMS": "code",
              "MOD_HEMS": "module",
              "SPEC_HEMS": "specification",
          }

          GENERATED_METADATA = {
              "code-manifest.yaml",
              "module-manifest.yaml",
              "spec-manifest.yaml",
              "specification-manifest.yaml",
              "component-manifest.yaml",
              "baseline-manifest.yaml",
              "checksums.sha256",
              "tag-details.txt",
              "trace_links.csv",
              ".keep",
          }

          UPDATED_MANIFESTS_FILE = Path("updated-manifests.txt")
          BASELINE_FILES_FILE = Path("baseline-files.txt")
          AFFECTED_SPECIFICATIONS_FILE = Path(
              "affected-specifications.txt"
          )
          UPDATED_MODULES_FILE = Path("updated-modules.txt")
          VERSION_SUMMARY_FILE = Path("version-summary.txt")
          TAG_DETAILS_FILE = Path("consolidated-tag-details.txt")


          def git(*args, check=True):
              result = subprocess.run(
                  ["git", *args],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )

              if check and result.returncode != 0:
                  print(result.stdout)
                  print(result.stderr)

                  raise RuntimeError(
                      "Git command failed: git "
                      + " ".join(args)
                  )

              return result.stdout.strip(), result.returncode


          def write_output(name, value):
              with github_output.open(
                  "a",
                  encoding="utf-8",
              ) as handle:
                  handle.write(f"{name}={value}\n")


          def yaml_quote(value):
              value = str(value)
              value = value.replace("\\", "\\\\")
              value = value.replace('"', '\\"')
              return f'"{value}"'


          def safe_name(value):
              value = re.sub(
                  r"[^A-Za-z0-9._-]+",
                  "-",
                  str(value),
              )

              value = re.sub(
                  r"-+",
                  "-",
                  value,
              ).strip(".-")

              if value.endswith(".lock"):
                  value = value[:-5]

              return value or "baseline"


          def top_value(text, key):
              match = re.search(
                  rf"^{re.escape(key)}:\s*(.*?)\s*$",
                  text,
                  re.MULTILINE,
              )

              if not match:
                  return ""

              value = match.group(1).strip()

              if (
                  len(value) >= 2
                  and value[0] == value[-1]
                  and value[0] in "\"'"
              ):
                  value = value[1:-1]

              return value


          def nested_value(text, section, key):
              lines = text.splitlines()

              try:
                  start = lines.index(f"{section}:") + 1
              except ValueError:
                  return ""

              for line in lines[start:]:
                  if line and not line.startswith((" ", "\t")):
                      break

                  match = re.match(
                      rf"^\s+{re.escape(key)}:\s*(.*?)\s*$",
                      line,
                  )

                  if match:
                      value = match.group(1).strip()

                      if (
                          len(value) >= 2
                          and value[0] == value[-1]
                          and value[0] in "\"'"
                      ):
                          value = value[1:-1]

                      return value

              return ""


          def current_version(text):
              value = (
                  nested_value(
                      text,
                      "item_version",
                      "version",
                  )
                  or top_value(
                      text,
                      "version",
                  )
              )

              return int(value) if value.isdigit() else 0


          def current_merge(text):
              return (
                  nested_value(
                      text,
                      "item_version",
                      "sha",
                  )
                  or top_value(
                      text,
                      "commit",
                  )
              )


          def parse_history(text):
              lines = text.splitlines()
              start = None

              for marker in (
                  "item_version_history:",
                  "version_history:",
              ):
                  if marker in lines:
                      start = lines.index(marker) + 1
                      break

              if start is None:
                  return []

              history = []
              entry = None

              for line in lines[start:]:
                  if line and not line.startswith((" ", "\t")):
                      break

                  version_match = re.match(
                      r"^\s+-\s+version:\s*(\d+)\s*$",
                      line,
                  )

                  field_match = re.match(
                      r"^\s+([A-Za-z0-9_]+):\s*(.*?)\s*$",
                      line,
                  )

                  if version_match:
                      if entry:
                          history.append(entry)

                      entry = {
                          "version": version_match.group(1)
                      }

                  elif field_match and entry is not None:
                      entry[field_match.group(1)] = (
                          field_match.group(2)
                          .strip()
                          .strip("\"'")
                      )

              if entry:
                  history.append(entry)

              return history


          def content_files(directory):
              files = []

              if not directory.is_dir():
                  return files

              for path in directory.rglob("*"):
                  if (
                      path.is_file()
                      and path.name not in GENERATED_METADATA
                  ):
                      files.append(
                          path.relative_to(directory).as_posix()
                      )

              return sorted(files)


          def extract_specification(area, module, package):
              prefix = f"a_{module}_"

              if area == "SPEC_HEMS":
                  suffix = "_A"
              else:
                  suffix = "_A_RI_16_0(1.0)"

              if (
                  package.startswith(prefix)
                  and package.endswith(suffix)
              ):
                  return package[
                      len(prefix): -len(suffix)
                  ]

              return package


          def path_identity(file_name):
              parts = file_name.split("/")

              if (
                  len(parts) < 6
                  or parts[0] != "HEMS"
                  or parts[1] not in CONTROLLED_AREAS
              ):
                  return None

              return {
                  "area": parts[1],
                  "function": parts[2],
                  "sub_function": parts[3],
                  "module": parts[4],
                  "package": (
                      parts[5]
                      if len(parts) >= 7
                      else ""
                  ),
                  "is_package_file": len(parts) >= 7,
                  "is_module_file": len(parts) == 6,
              }


          def list_packages_at_commit(
              commit_sha,
              area,
              function_name,
              sub_function,
              module,
          ):
              module_path = (
                  f"HEMS/{area}/{function_name}/"
                  f"{sub_function}/{module}"
              )

              output, status = git(
                  "ls-tree",
                  "-d",
                  "--name-only",
                  f"{commit_sha}:{module_path}",
                  check=False,
              )

              if status != 0 or not output:
                  return set()

              return {
                  line.strip()
                  for line in output.splitlines()
                  if line.strip()
              }


          def render_version_manifest(
              manifest_path,
              identity,
              version,
              version_label,
              old_text,
          ):
              history = [
                  record
                  for record in parse_history(old_text)
                  if (
                      record.get("sha")
                      or record.get("commit")
                  ) != merge_sha
              ]

              history.append({
                  "version": str(version),
                  "label": version_label,
                  "sha": merge_sha,
                  "pr": pr_number,
                  "updated_utc": generated_utc,
              })

              lines = [
                  f"{key}: {yaml_quote(value)}"
                  for key, value in identity.items()
              ]

              lines.extend([
                  f"version: {version}",
                  'delivery_cycle: "not_released"',
                  f"version_label: {yaml_quote(version_label)}",
                  f"commit: {yaml_quote(merge_sha)}",
                  f"pull_request: {yaml_quote(pr_number)}",
                  f"updated_utc: {yaml_quote(generated_utc)}",
                  f"source_branch: {yaml_quote(source_branch)}",
                  f"target_branch: {yaml_quote(target_branch)}",
                  f"pull_request_title: {yaml_quote(pr_title)}",
                  'generated_by: "GitHub Actions"',
                  "automation_owned: true",
                  "main_branch_only: true",
                  "files:",
              ])

              files = content_files(manifest_path.parent)

              if files:
                  for item in files:
                      lines.append(
                          f"  - {yaml_quote(item)}"
                      )
              else:
                  lines.append("  []")

              lines.extend([
                  "item_version:",
                  f"  version: {version}",
                  f"  label: {yaml_quote(version_label)}",
                  f"  sha: {yaml_quote(merge_sha)}",
                  f"  pr: {yaml_quote(pr_number)}",
                  f"  updated_utc: {yaml_quote(generated_utc)}",
                  "item_version_history:",
              ])

              for record in history:
                  lines.extend([
                      f"  - version: {record['version']}",
                      "    label: "
                      + yaml_quote(
                          record.get("label")
                          or record.get(
                              "tag",
                              "not_available",
                          )
                      ),
                      "    sha: "
                      + yaml_quote(
                          record.get("sha")
                          or record.get(
                              "commit",
                              "not_available",
                          )
                      ),
                      "    pr: "
                      + yaml_quote(
                          record.get("pr")
                          or record.get(
                              "pull_request",
                              "not_available",
                          )
                      ),
                      "    updated_utc: "
                      + yaml_quote(
                          record.get(
                              "updated_utc",
                              "not_available",
                          )
                      ),
                  ])

              return "\n".join(lines) + "\n"


          if not merge_sha:
              raise RuntimeError(
                  "Pull Request merge commit SHA is unavailable."
              )


          _, merge_status = git(
              "cat-file",
              "-e",
              f"{merge_sha}^{{commit}}",
              check=False,
          )

          if merge_status != 0:
              raise RuntimeError(
                  f"Merge commit does not exist locally: {merge_sha}"
              )


          # Critical comparison:
          # Compare main immediately before this merge against main
          # immediately after this merge.
          #
          # This prevents unrelated files from older branch states or
          # previous automation commits from being detected.
          pre_merge_sha, _ = git(
              "rev-parse",
              f"{merge_sha}^1",
          )

          print(f"Main before merge: {pre_merge_sha}")
          print(f"Main after merge: {merge_sha}")

          name_status_text, _ = git(
              "diff",
              "--name-status",
              "--find-renames",
              "--find-copies",
              pre_merge_sha,
              merge_sha,
          )


          merge_subject, _ = git(
              "log",
              "-1",
              "--format=%s",
              merge_sha,
          )

          merge_message, _ = git(
              "log",
              "-1",
              "--format=%B",
              merge_sha,
          )


          tracker_pattern = re.compile(
              r"(?<![A-Za-z0-9])#([0-9]{3,10})(?![0-9])"
          )

          tracker_match = (
              tracker_pattern.search(pr_title)
              or tracker_pattern.search(merge_message)
          )

          tracker_reference = (
              f"#{tracker_match.group(1)}"
              if tracker_match
              else "not_available"
          )


          changed_records = []

          for raw_line in name_status_text.splitlines():
              if not raw_line.strip():
                  continue

              columns = raw_line.split("\t")
              status = columns[0]

              if status.startswith(("R", "C")):
                  if len(columns) < 3:
                      continue

                  old_path = columns[1]
                  new_path = columns[2]
              else:
                  if len(columns) < 2:
                      continue

                  old_path = columns[1]
                  new_path = columns[1]

              changed_records.append({
                  "status": status,
                  "old_path": old_path,
                  "new_path": new_path,
              })


          print("")
          print("Files introduced by this merge:")

          if not changed_records:
              print("No changed files detected.")

          for record in changed_records:
              if record["old_path"] == record["new_path"]:
                  print(
                      f"- {record['status']}: "
                      f"{record['new_path']}"
                  )
              else:
                  print(
                      f"- {record['status']}: "
                      f"{record['old_path']} -> "
                      f"{record['new_path']}"
                  )


          changed_specifications = set()
          deleted_specifications = set()

          touched_modules_by_area = set()
          module_level_changes = set()
          mod_hems_changes = set()
          package_structure_candidates = set()

          specification_changes_by_module = defaultdict(set)


          for record in changed_records:
              status = record["status"]
              paths_to_process = []

              if status.startswith(("R", "C")):
                  paths_to_process.extend([
                      (record["old_path"], "old"),
                      (record["new_path"], "new"),
                  ])

              elif status.startswith("D"):
                  paths_to_process.append(
                      (record["old_path"], "old")
                  )

              else:
                  paths_to_process.append(
                      (record["new_path"], "new")
                  )


              for file_name, path_side in paths_to_process:
                  identity = path_identity(file_name)

                  if identity is None:
                      continue

                  if Path(file_name).name in GENERATED_METADATA:
                      print(
                          "Ignoring automation-generated file: "
                          f"{file_name}"
                      )
                      continue

                  area = identity["area"]
                  function_name = identity["function"]
                  sub_function = identity["sub_function"]
                  module = identity["module"]
                  package = identity["package"]

                  module_key = (
                      area,
                      function_name,
                      sub_function,
                      module,
                  )

                  touched_modules_by_area.add(module_key)

                  if identity["is_module_file"]:
                      module_level_changes.add(module_key)

                  if area == "MOD_HEMS":
                      mod_hems_changes.add(module_key)

                  if (
                      area in SPECIFICATION_AREAS
                      and identity["is_package_file"]
                  ):
                      specification_key = (
                          area,
                          function_name,
                          sub_function,
                          module,
                          package,
                      )

                      specification_changes_by_module[
                          module_key
                      ].add(package)

                      if (
                          status.startswith("D")
                          and path_side == "old"
                      ):
                          deleted_specifications.add(
                              specification_key
                          )
                      else:
                          changed_specifications.add(
                              specification_key
                          )

                      package_structure_candidates.add(
                          module_key
                      )


          package_count_changes = set()

          for (
              area,
              function_name,
              sub_function,
              module,
          ) in sorted(package_structure_candidates):

              before_packages = list_packages_at_commit(
                  pre_merge_sha,
                  area,
                  function_name,
                  sub_function,
                  module,
              )

              after_packages = list_packages_at_commit(
                  merge_sha,
                  area,
                  function_name,
                  sub_function,
                  module,
              )

              added_packages = (
                  after_packages - before_packages
              )

              removed_packages = (
                  before_packages - after_packages
              )

              if added_packages or removed_packages:
                  module_key = (
                      area,
                      function_name,
                      sub_function,
                      module,
                  )

                  package_count_changes.add(module_key)

                  print("")
                  print(
                      "Package structure changed for "
                      f"{area}/{function_name}/"
                      f"{sub_function}/{module}"
                  )

                  for package in sorted(added_packages):
                      print(f"  Added package: {package}")

                  for package in sorted(removed_packages):
                      print(f"  Removed package: {package}")


          multiple_specification_changes = {
              module_key
              for module_key, packages
              in specification_changes_by_module.items()
              if len(packages) > 1
          }


          modules_requiring_version_update = set()

          modules_requiring_version_update.update(
              module_level_changes
          )

          modules_requiring_version_update.update(
              mod_hems_changes
          )

          modules_requiring_version_update.update(
              package_count_changes
          )

          modules_requiring_version_update.update(
              multiple_specification_changes
          )


          updated_manifests = []
          version_summary = []


          def update_manifest(
              manifest_path,
              identity,
              logical_name,
              item_type,
          ):
              old_text = (
                  manifest_path.read_text(
                      encoding="utf-8",
                      errors="replace",
                  )
                  if manifest_path.is_file()
                  else ""
              )

              if current_merge(old_text) == merge_sha:
                  print(
                      "Already processed for this merge: "
                      f"{manifest_path}"
                  )
                  return None

              previous_version = current_version(old_text)
              next_version = previous_version + 1
              version_label = (
                  f"{logical_name}/v{next_version}"
              )

              manifest_path.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              manifest_path.write_text(
                  render_version_manifest(
                      manifest_path=manifest_path,
                      identity=identity,
                      version=next_version,
                      version_label=version_label,
                      old_text=old_text,
                  ),
                  encoding="utf-8",
              )

              manifest_string = manifest_path.as_posix()

              updated_manifests.append(
                  manifest_string
              )

              version_summary.append({
                  "type": item_type,
                  "logical_name": logical_name,
                  "previous_version": previous_version,
                  "version": next_version,
                  "manifest": manifest_string,
              })

              print("")
              print(f"Updated {item_type}: {logical_name}")
              print(f"Manifest: {manifest_string}")
              print(
                  f"Version: {previous_version} -> "
                  f"{next_version}"
              )

              return next_version


          # Update each affected specification exactly once.
          for (
              area,
              function_name,
              sub_function,
              module,
              package,
          ) in sorted(changed_specifications):

              package_directory = (
                  Path("HEMS")
                  / area
                  / function_name
                  / sub_function
                  / module
                  / package
              )

              if not package_directory.is_dir():
                  print(
                      "Skipping removed package: "
                      f"{package_directory}"
                  )
                  continue

              specification = extract_specification(
                  area,
                  module,
                  package,
              )

              manifest_path = (
                  package_directory
                  / "specification-manifest.yaml"
              )

              identity = {
                  "manifest_level": "specification",
                  "specification": specification,
                  "package": package,
                  "type": (
                      "source_specification"
                      if area == "SPEC_HEMS"
                      else "generated_code_specification"
                  ),
                  "area": area,
                  "function": function_name,
                  "sub_function": sub_function,
                  "module": module,
              }

              logical_name = "/".join([
                  "specification",
                  area,
                  function_name,
                  sub_function,
                  module,
                  specification,
              ])

              update_manifest(
                  manifest_path=manifest_path,
                  identity=identity,
                  logical_name=logical_name,
                  item_type="specification",
              )


          # Update a module manifest only when:
          # 1. A module-level file changed.
          # 2. MOD_HEMS content changed.
          # 3. A package was added or removed.
          # 4. Multiple specifications changed in the module.
          for (
              area,
              function_name,
              sub_function,
              module,
          ) in sorted(modules_requiring_version_update):

              module_directory = (
                  Path("HEMS")
                  / area
                  / function_name
                  / sub_function
                  / module
              )

              if not module_directory.is_dir():
                  print(
                      "Skipping removed module: "
                      f"{module_directory}"
                  )
                  continue

              manifest_path = (
                  module_directory
                  / MODULE_MANIFEST_BY_AREA[area]
              )

              identity = {
                  "manifest_level": "module",
                  "module": module,
                  "type": MODULE_TYPE_BY_AREA[area],
                  "area": area,
                  "function": function_name,
                  "sub_function": sub_function,
              }

              logical_name = "/".join([
                  "module",
                  area,
                  function_name,
                  sub_function,
                  module,
              ])

              update_manifest(
                  manifest_path=manifest_path,
                  identity=identity,
                  logical_name=logical_name,
                  item_type="module",
              )


          unique_baseline_modules = {
              (
                  function_name,
                  sub_function,
                  module,
              )
              for (
                  area,
                  function_name,
                  sub_function,
                  module,
              ) in modules_requiring_version_update
              if (
                  Path("HEMS")
                  / area
                  / function_name
                  / sub_function
                  / module
              ).is_dir()
          }

          baseline_created = bool(
              unique_baseline_modules
          )

          tag_name = safe_name(
              f"hems-baseline-pr-{pr_number}-"
              f"{merge_sha[:7]}"
          )[:120]


          if baseline_created:
              _, tag_status = git(
                  "show-ref",
                  "--verify",
                  "--quiet",
                  f"refs/tags/{tag_name}",
                  check=False,
              )

              if tag_status == 0:
                  raise RuntimeError(
                      f"Tag already exists: {tag_name}"
                  )


          baseline_files = []
          module_package_records = []


          for (
              function_name,
              sub_function,
              module,
          ) in sorted(unique_baseline_modules):

              baseline_directory = (
                  Path("HEMS")
                  / "BASELINES"
                  / function_name
                  / sub_function
                  / module
                  / tag_name
              )

              baseline_directory.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              staging_directory = (
                  Path("module-package-staging")
                  / function_name
                  / sub_function
                  / module
              )

              shutil.rmtree(
                  staging_directory,
                  ignore_errors=True,
              )

              staging_directory.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              included_files = []

              for area in (
                  "CODE_HEMS",
                  "MOD_HEMS",
                  "SPEC_HEMS",
              ):
                  module_source = (
                      Path("HEMS")
                      / area
                      / function_name
                      / sub_function
                      / module
                  )

                  if not module_source.is_dir():
                      continue

                  module_destination = (
                      staging_directory
                      / "HEMS"
                      / area
                      / function_name
                      / sub_function
                      / module
                  )

                  shutil.copytree(
                      module_source,
                      module_destination,
                      dirs_exist_ok=True,
                  )

                  for path in sorted(
                      module_source.rglob("*")
                  ):
                      if path.is_file():
                          included_files.append(
                              path.as_posix()
                          )


              included_files = sorted(
                  set(included_files)
              )

              if not included_files:
                  raise RuntimeError(
                      "No module content found for "
                      f"{function_name}/"
                      f"{sub_function}/"
                      f"{module}"
                  )


              module_zip = (
                  baseline_directory
                  / f"{module}-{tag_name}.zip"
              )

              baseline_manifest = (
                  baseline_directory
                  / "baseline-manifest.yaml"
              )

              checksum_file = (
                  baseline_directory
                  / "checksums.sha256"
              )

              tag_details_file = (
                  baseline_directory
                  / "tag-details.txt"
              )


              relevant_versions = [
                  record
                  for record in version_summary
                  if (
                      f"/{function_name}/"
                      f"{sub_function}/"
                      f"{module}"
                  ) in record["logical_name"]
              ]


              manifest_lines = [
                  f"baseline_tag: {yaml_quote(tag_name)}",
                  f"repository: {yaml_quote(repository)}",
                  f"pull_request: {yaml_quote(pr_number)}",
                  f"pull_request_title: {yaml_quote(pr_title)}",
                  f"tracker_id: {yaml_quote(tracker_reference)}",
                  f"pre_merge_commit: {yaml_quote(pre_merge_sha)}",
                  f"merge_commit: {yaml_quote(merge_sha)}",
                  f"generated_utc: {yaml_quote(generated_utc)}",
                  f"function: {yaml_quote(function_name)}",
                  f"sub_function: {yaml_quote(sub_function)}",
                  f"module: {yaml_quote(module)}",
                  "versions:",
              ]

              if relevant_versions:
                  for record in relevant_versions:
                      manifest_lines.extend([
                          "  - type: "
                          + yaml_quote(record["type"]),
                          "    component: "
                          + yaml_quote(
                              record["logical_name"]
                          ),
                          "    previous_version: "
                          + str(
                              record["previous_version"]
                          ),
                          "    version: "
                          + str(record["version"]),
                          "    manifest: "
                          + yaml_quote(
                              record["manifest"]
                          ),
                      ])
              else:
                  manifest_lines.append("  []")

              manifest_lines.append(
                  "included_files:"
              )

              for included_file in included_files:
                  manifest_lines.append(
                      f"  - {yaml_quote(included_file)}"
                  )

              baseline_manifest.write_text(
                  "\n".join(manifest_lines) + "\n",
                  encoding="utf-8",
              )


              checksum_lines = []

              for included_file in included_files:
                  digest = hashlib.sha256(
                      Path(included_file).read_bytes()
                  ).hexdigest()

                  checksum_lines.append(
                      f"{digest}  {included_file}"
                  )

              checksum_file.write_text(
                  "\n".join(checksum_lines) + "\n",
                  encoding="utf-8",
              )


              tag_details_file.write_text(
                  "\n".join([
                      "HEMS module baseline",
                      "",
                      f"Tag: {tag_name}",
                      f"Repository: {repository}",
                      f"Pull request: #{pr_number}",
                      f"Pull request title: {pr_title}",
                      f"Tracker reference: {tracker_reference}",
                      f"Main before merge: {pre_merge_sha}",
                      f"Main after merge: {merge_sha}",
                      f"Function: {function_name}",
                      f"Sub-function: {sub_function}",
                      f"Module: {module}",
                      "",
                      "Original merge message:",
                      merge_message,
                      "",
                      "Downloadable module ZIP:",
                      module_zip.as_posix(),
                  ]) + "\n",
                  encoding="utf-8",
              )


              for metadata_file in (
                  baseline_manifest,
                  checksum_file,
                  tag_details_file,
              ):
                  shutil.copy2(
                      metadata_file,
                      staging_directory
                      / metadata_file.name,
                  )


              with zipfile.ZipFile(
                  module_zip,
                  "w",
                  zipfile.ZIP_DEFLATED,
              ) as archive:
                  for staged_file in sorted(
                      staging_directory.rglob("*")
                  ):
                      if staged_file.is_file():
                          archive.write(
                              staged_file,
                              staged_file.relative_to(
                                  staging_directory
                              ).as_posix(),
                          )


              baseline_files.extend([
                  baseline_manifest.as_posix(),
                  checksum_file.as_posix(),
                  tag_details_file.as_posix(),
                  module_zip.as_posix(),
              ])

              module_package_records.append({
                  "function": function_name,
                  "sub_function": sub_function,
                  "module": module,
                  "zip": module_zip.as_posix(),
              })


          if baseline_created:
              consolidated_details = [
                  "HEMS consolidated module baseline",
                  "",
                  f"Tag: {tag_name}",
                  f"Repository: {repository}",
                  f"Pull request: #{pr_number}",
                  f"Pull request title: {pr_title}",
                  f"Tracker reference: {tracker_reference}",
                  f"Main before merge: {pre_merge_sha}",
                  f"Main after merge: {merge_sha}",
                  "",
                  "Affected modules and baseline ZIP paths:",
              ]

              for record in module_package_records:
                  consolidated_details.extend([
                      f"- {record['function']}/"
                      f"{record['sub_function']}/"
                      f"{record['module']}",
                      f"  ZIP: {record['zip']}",
                  ])

              TAG_DETAILS_FILE.write_text(
                  "\n".join(consolidated_details) + "\n",
                  encoding="utf-8",
              )


          UPDATED_MANIFESTS_FILE.write_text(
              "\n".join(updated_manifests)
              + ("\n" if updated_manifests else ""),
              encoding="utf-8",
          )

          BASELINE_FILES_FILE.write_text(
              "\n".join(baseline_files)
              + ("\n" if baseline_files else ""),
              encoding="utf-8",
          )

          AFFECTED_SPECIFICATIONS_FILE.write_text(
              "\n".join(
                  "/".join(item)
                  for item in sorted(
                      changed_specifications
                      | deleted_specifications
                  )
              )
              + (
                  "\n"
                  if (
                      changed_specifications
                      or deleted_specifications
                  )
                  else ""
              ),
              encoding="utf-8",
          )

          UPDATED_MODULES_FILE.write_text(
              "\n".join(
                  "/".join(item)
                  for item in sorted(
                      modules_requiring_version_update
                  )
              )
              + (
                  "\n"
                  if modules_requiring_version_update
                  else ""
              ),
              encoding="utf-8",
          )


          version_summary_lines = []

          for record in version_summary:
              version_summary_lines.append(
                  f"{record['type']} | "
                  f"{record['logical_name']} | "
                  f"{record['previous_version']} -> "
                  f"{record['version']} | "
                  f"{record['manifest']}"
              )

          VERSION_SUMMARY_FILE.write_text(
              "\n".join(version_summary_lines)
              + (
                  "\n"
                  if version_summary_lines
                  else ""
              ),
              encoding="utf-8",
          )


          changes_created = bool(
              updated_manifests or baseline_files
          )

          write_output(
              "changes_created",
              str(changes_created).lower(),
          )

          write_output(
              "baseline_created",
              str(baseline_created).lower(),
          )

          write_output("tag_name", tag_name)
          write_output("merge_sha", merge_sha)
          write_output("pre_merge_sha", pre_merge_sha)
          write_output(
              "tracker_reference",
              tracker_reference,
          )


          print("")
          print("============================================================")
          print("Post-merge processing summary")
          print("============================================================")
          print(f"Main before merge: {pre_merge_sha}")
          print(f"Main after merge: {merge_sha}")
          print(
              "Changed specification packages: "
              f"{len(changed_specifications)}"
          )
          print(
              "Deleted specification packages: "
              f"{len(deleted_specifications)}"
          )
          print(
              "Updated manifests: "
              f"{len(updated_manifests)}"
          )
          print(
              "Modules requiring baseline: "
              f"{len(unique_baseline_modules)}"
          )
          print(f"Baseline created: {baseline_created}")
          PYTHON_SCRIPT

      - name: Review generated changes
        if: steps.baseline.outputs.changes_created == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Main before merge:"
          echo "${{ steps.baseline.outputs.pre_merge_sha }}"
          echo ""

          echo "Main after merge:"
          echo "${{ steps.baseline.outputs.merge_sha }}"
          echo ""

          echo "Affected specifications:"
          if [[ -s affected-specifications.txt ]]; then
            cat affected-specifications.txt
          else
            echo "No specification packages changed."
          fi

          echo ""
          echo "Updated modules:"
          if [[ -s updated-modules.txt ]]; then
            cat updated-modules.txt
          else
            echo "No module version was updated."
          fi

          echo ""
          echo "Version summary:"
          if [[ -s version-summary.txt ]]; then
            cat version-summary.txt
          else
            echo "No version changes were generated."
          fi

          echo ""
          echo "Updated manifests:"
          if [[ -s updated-manifests.txt ]]; then
            cat updated-manifests.txt
          else
            echo "No manifests were updated."
          fi

          echo ""
          echo "Generated baseline files:"
          if [[ -s baseline-files.txt ]]; then
            cat baseline-files.txt
          else
            echo "No baseline files were generated."
          fi

          echo ""
          git diff -- \
            HEMS/CODE_HEMS \
            HEMS/MOD_HEMS \
            HEMS/SPEC_HEMS \
            HEMS/BASELINES

      - name: Commit generated changes to main
        if: steps.baseline.outputs.changes_created == 'true'
        shell: bash
        env:
          ACCESS_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          PR_NUMBER: ${{ needs.prepare-event.outputs.pr_number }}
          MERGE_SHA: ${{ steps.baseline.outputs.merge_sha }}
          TAG_NAME: ${{ steps.baseline.outputs.tag_name }}
          BASELINE_CREATED: ${{ steps.baseline.outputs.baseline_created }}
        run: |
          set -euo pipefail

          for list_file in \
            updated-manifests.txt \
            baseline-files.txt
          do
            if [[ ! -f "$list_file" ]]; then
              continue
            fi

            while IFS= read -r generated_file; do
              if [[ -z "$generated_file" ]]; then
                continue
              fi

              if [[ ! -f "$generated_file" ]]; then
                echo "::error::Generated file is missing: ${generated_file}"
                exit 1
              fi

              git add -- "$generated_file"
            done < "$list_file"
          done

          if git diff --cached --quiet; then
            echo "No generated changes are available to commit."
            exit 0
          fi

          if [[ "$BASELINE_CREATED" == "true" ]]; then
            COMMIT_MESSAGE="Update manifests and create module baseline ${TAG_NAME} after PR #${PR_NUMBER}"
          else
            COMMIT_MESSAGE="Update specification manifests after PR #${PR_NUMBER}"
          fi

          git commit -m "$COMMIT_MESSAGE"

          AUTH_VALUE="$(
            printf 'x-access-token:%s' "$ACCESS_TOKEN" \
              | base64 \
              | tr -d '\n'
          )"

          git config \
            http."${SERVER_URL}/".extraheader \
            "AUTHORIZATION: basic ${AUTH_VALUE}"

          cleanup_auth() {
            git config --unset-all \
              http."${SERVER_URL}/".extraheader \
              2>/dev/null || true
          }

          trap cleanup_auth EXIT

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"

          REMOTE_MAIN_SHA="$(
            git rev-parse refs/remotes/origin/main
          )"

          if [[ "$REMOTE_MAIN_SHA" != "$MERGE_SHA" ]]; then
            echo "::error::main changed after PR #${PR_NUMBER} was merged."
            echo "::error::Expected ${MERGE_SHA}, found ${REMOTE_MAIN_SHA}."
            echo "::error::Rerun the workflow after reconciling main."
            exit 1
          fi

          git push origin HEAD:main

          cleanup_auth
          trap - EXIT

      - name: Create and push consolidated baseline tag
        if: steps.baseline.outputs.baseline_created == 'true'
        shell: bash
        env:
          ACCESS_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          TAG_NAME: ${{ steps.baseline.outputs.tag_name }}
        run: |
          set -euo pipefail

          if [[ ! -f consolidated-tag-details.txt ]]; then
            echo "::error::Consolidated tag details file is missing."
            exit 1
          fi

          TAG_TARGET="$(git rev-parse HEAD)"

          if git show-ref \
            --verify \
            --quiet \
            "refs/tags/${TAG_NAME}"
          then
            echo "::error::Tag already exists: ${TAG_NAME}"
            exit 1
          fi

          git tag \
            --annotate "$TAG_NAME" \
            "$TAG_TARGET" \
            --file consolidated-tag-details.txt

          AUTH_VALUE="$(
            printf 'x-access-token:%s' "$ACCESS_TOKEN" \
              | base64 \
              | tr -d '\n'
          )"

          git config \
            http."${SERVER_URL}/".extraheader \
            "AUTHORIZATION: basic ${AUTH_VALUE}"

          cleanup_auth() {
            git config --unset-all \
              http."${SERVER_URL}/".extraheader \
              2>/dev/null || true
          }

          trap cleanup_auth EXIT

          git push origin "refs/tags/${TAG_NAME}"

          cleanup_auth
          trap - EXIT

          echo "Created baseline tag: ${TAG_NAME}"
          echo "Tag target: ${TAG_TARGET}"

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "HEMS post-merge workflow summary"
          echo "============================================================"
          echo "Pull Request: #${{ needs.prepare-event.outputs.pr_number }}"
          echo "Merge commit: ${{ needs.prepare-event.outputs.merge_sha }}"
          echo "Tracker reference: ${{ steps.baseline.outputs.tracker_reference }}"
          echo ""

          if [[ "${{ steps.baseline.outputs.changes_created }}" != "true" ]]; then
            echo "No applicable HEMS changes were generated."
            exit 0
          fi

          echo "Main before merge:"
          echo "${{ steps.baseline.outputs.pre_merge_sha }}"
          echo ""

          echo "Main after merge:"
          echo "${{ steps.baseline.outputs.merge_sha }}"
          echo ""

          echo "Baseline created:"
          echo "${{ steps.baseline.outputs.baseline_created }}"
          echo ""

          if [[ -s version-summary.txt ]]; then
            echo "Version changes:"
            cat version-summary.txt
          fi

          if [[ "${{ steps.baseline.outputs.baseline_created }}" == "true" ]]; then
            echo ""
            echo "Baseline tag:"
            echo "${{ steps.baseline.outputs.tag_name }}"
          else
            echo ""
            echo "Only affected specification manifests were updated."
            echo "No parent module baseline was required."
          fi
