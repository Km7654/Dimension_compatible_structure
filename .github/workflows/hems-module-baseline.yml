name: HEMS Module Baseline

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: hems-module-baseline-main
  cancel-in-progress: false

jobs:
  create-module-baseline:
    name: Version manifests, package modules, and create one tag
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Verify required runner tools
        shell: bash
        run: |
          set -euo pipefail

          for tool in git python3 base64; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::Required runner tool is missing: $tool"
              exit 1
            fi
          done

      - name: Checkout latest main and fetch tags using Git
        shell: bash
        env:
          ACCESS_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          REPOSITORY_URL="${SERVER_URL}/${REPOSITORY}.git"
          AUTH_VALUE="$(printf 'x-access-token:%s' "$ACCESS_TOKEN" | base64 | tr -d '\n')"

          git init -b main .
          git remote add origin "$REPOSITORY_URL"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http."${SERVER_URL}/".extraheader "AUTHORIZATION: basic ${AUTH_VALUE}"

          cleanup_auth() {
            git config --unset-all http."${SERVER_URL}/".extraheader 2>/dev/null || true
          }
          trap cleanup_auth EXIT

          git fetch --prune origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/*:refs/tags/*"

          if ! git cat-file -e "${MERGE_SHA}^{commit}" 2>/dev/null; then
            git fetch origin "$MERGE_SHA"
          fi

          git checkout --force -B main refs/remotes/origin/main
          git clean -ffdx

          cleanup_auth
          trap - EXIT

      - name: Update manifests and create per-module baseline packages
        id: baseline
        shell: bash
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          python3 <<'PYTHON_SCRIPT'
          import hashlib
          import os
          import re
          import shutil
          import subprocess
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          merge_sha = os.environ["MERGE_SHA"].strip()
          pr_number = os.environ["PR_NUMBER"].strip()
          pr_title = os.environ["PR_TITLE"].strip()
          source_branch = os.environ["SOURCE_BRANCH"].strip()
          target_branch = os.environ["TARGET_BRANCH"].strip()
          repository = os.environ["REPOSITORY"].strip()
          github_output = Path(os.environ["GITHUB_OUTPUT"])
          generated_utc = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          MODULE_MANIFEST_BY_AREA = {
              "CODE_HEMS": "code-manifest.yaml",
              "MOD_HEMS": "module-manifest.yaml",
              "SPEC_HEMS": "spec-manifest.yaml",
          }
          MODULE_TYPE_BY_AREA = {
              "CODE_HEMS": "code",
              "MOD_HEMS": "module",
              "SPEC_HEMS": "specification",
          }
          SPECIFICATION_AREAS = {"CODE_HEMS", "SPEC_HEMS"}
          GENERATED_METADATA = {
              "code-manifest.yaml",
              "module-manifest.yaml",
              "spec-manifest.yaml",
              "specification-manifest.yaml",
              "component-manifest.yaml",
              "trace_links.csv",
              ".keep",
          }

          UPDATED_MANIFESTS_FILE = Path("updated-manifests.txt")
          BASELINE_FILES_FILE = Path("baseline-files.txt")
          AFFECTED_MODULES_FILE = Path("affected-modules.txt")
          TAG_DETAILS_WORK_FILE = Path("consolidated-tag-details.txt")

          def git(*args, check=True):
              result = subprocess.run(
                  ["git", *args],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if check and result.returncode != 0:
                  print(result.stdout)
                  print(result.stderr)
                  raise RuntimeError(f"Git command failed: git {' '.join(args)}")
              return result.stdout.strip(), result.returncode

          def yaml_quote(value):
              value = str(value).replace("\\", "\\\\").replace('"', '\\"')
              return f'"{value}"'

          def safe_name(value):
              value = re.sub(r"[^A-Za-z0-9._-]+", "-", value)
              value = re.sub(r"-+", "-", value).strip(".-")
              if value.endswith(".lock"):
                  value = value[:-5]
              return value or "merge"

          def top_value(text, key):
              match = re.search(
                  rf"^{re.escape(key)}:\s*(.*?)\s*$",
                  text,
                  re.MULTILINE,
              )
              if not match:
                  return ""
              value = match.group(1).strip()
              if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                  value = value[1:-1]
              return value

          def nested_value(text, section, key):
              lines = text.splitlines()
              try:
                  start = lines.index(f"{section}:") + 1
              except ValueError:
                  return ""
              for line in lines[start:]:
                  if line and not line.startswith((" ", "\t")):
                      break
                  match = re.match(rf"^\s+{re.escape(key)}:\s*(.*?)\s*$", line)
                  if match:
                      value = match.group(1).strip()
                      if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                          value = value[1:-1]
                      return value
              return ""

          def current_version(text):
              value = nested_value(text, "item_version", "version") or top_value(text, "version")
              return int(value) if value.isdigit() else 0

          def current_merge(text):
              return nested_value(text, "item_version", "sha") or top_value(text, "commit")

          def parse_history(text):
              lines = text.splitlines()
              start = None
              for marker in ("item_version_history:", "version_history:"):
                  if marker in lines:
                      start = lines.index(marker) + 1
                      break
              if start is None:
                  return []

              history = []
              entry = None
              for line in lines[start:]:
                  if line and not line.startswith((" ", "\t")):
                      break
                  version_match = re.match(r"^\s+-\s+version:\s*(\d+)\s*$", line)
                  field_match = re.match(r"^\s+([A-Za-z0-9_]+):\s*(.*?)\s*$", line)
                  if version_match:
                      if entry:
                          history.append(entry)
                      entry = {"version": version_match.group(1)}
                  elif field_match and entry is not None:
                      entry[field_match.group(1)] = field_match.group(2).strip().strip("\"'")
              if entry:
                  history.append(entry)
              return history

          def content_files(directory):
              files = []
              for path in directory.rglob("*"):
                  if path.is_file() and path.name not in GENERATED_METADATA:
                      files.append(path.relative_to(directory).as_posix())
              return sorted(files)

          def extract_specification(area, module, package):
              prefix = f"a_{module}_"
              suffix = "_A" if area == "SPEC_HEMS" else "_A_RI_16_0(1.0)"
              if package.startswith(prefix) and package.endswith(suffix):
                  return package[len(prefix):-len(suffix)]
              return package

          def render_version_manifest(path, identity, version, version_label, old_text):
              history = [
                  record for record in parse_history(old_text)
                  if (record.get("sha") or record.get("commit")) != merge_sha
              ]
              history.append({
                  "version": str(version),
                  "label": version_label,
                  "sha": merge_sha,
                  "pr": pr_number,
                  "updated_utc": generated_utc,
              })

              lines = [f"{key}: {yaml_quote(value)}" for key, value in identity.items()]
              lines.extend([
                  f"version: {version}",
                  'delivery_cycle: "not_released"',
                  f"version_label: {yaml_quote(version_label)}",
                  f"commit: {yaml_quote(merge_sha)}",
                  f"pull_request: {yaml_quote(pr_number)}",
                  f"updated_utc: {yaml_quote(generated_utc)}",
                  f"source_branch: {yaml_quote(source_branch)}",
                  f"target_branch: {yaml_quote(target_branch)}",
                  f"pull_request_title: {yaml_quote(pr_title)}",
                  'generated_by: "GitHub Actions"',
                  "automation_owned: true",
                  "main_branch_only: true",
                  "files:",
              ])
              files = content_files(path.parent)
              lines.extend([f"  - {yaml_quote(item)}" for item in files] or ["  []"])
              lines.extend([
                  "item_version:",
                  f"  version: {version}",
                  f"  label: {yaml_quote(version_label)}",
                  f"  sha: {yaml_quote(merge_sha)}",
                  f"  pr: {yaml_quote(pr_number)}",
                  f"  updated_utc: {yaml_quote(generated_utc)}",
                  "item_version_history:",
              ])
              for record in history:
                  lines.extend([
                      f"  - version: {record['version']}",
                      f"    label: {yaml_quote(record.get('label') or record.get('tag', 'not_available'))}",
                      f"    sha: {yaml_quote(record.get('sha') or record.get('commit', 'not_available'))}",
                      f"    pr: {yaml_quote(record.get('pr') or record.get('pull_request', 'not_available'))}",
                      f"    updated_utc: {yaml_quote(record.get('updated_utc', 'not_available'))}",
                  ])
              return "\n".join(lines) + "\n"

          if not merge_sha or merge_sha == "0" * 40:
              raise RuntimeError("Pull-request merge commit SHA is unavailable.")

          parents_text, _ = git("rev-list", "--parents", "-n", "1", merge_sha)
          parents = parents_text.split()
          if len(parents) < 3:
              raise RuntimeError(
                  "Use the standard 'Create a merge commit' method. "
                  "Squash and rebase merges are not supported."
              )
          first_parent = parents[1]

          merge_subject, _ = git("log", "-1", "--format=%s", merge_sha)
          merge_message, _ = git("log", "-1", "--format=%B", merge_sha)
          tag_name = safe_name(merge_subject)[:120]

          _, tag_status = git(
              "show-ref", "--verify", "--quiet", f"refs/tags/{tag_name}", check=False
          )
          if tag_status == 0:
              raise RuntimeError(
                  f"Tag already exists: {tag_name}. Use a unique merge subject."
              )

          changed_text, _ = git(
              "diff", "--name-only", "--diff-filter=ACMR", first_parent, merge_sha
          )
          changed_files = [line for line in changed_text.splitlines() if line]

          changed_modules_by_area = set()
          affected_modules = set()
          changed_specifications = set()
          changed_engineering_files = []

          for file_name in changed_files:
              parts = file_name.split("/")
              if len(parts) < 6 or parts[0] != "HEMS":
                  continue

              area, function_name, sub_function, module = parts[1:5]
              if area not in MODULE_MANIFEST_BY_AREA:
                  continue
              if Path(file_name).name in GENERATED_METADATA:
                  print(f"Ignoring generated metadata: {file_name}")
                  continue
              if not Path(file_name).is_file():
                  continue

              changed_engineering_files.append(file_name)
              changed_modules_by_area.add((area, function_name, sub_function, module))
              affected_modules.add((function_name, sub_function, module))

              if area in SPECIFICATION_AREAS and len(parts) >= 7:
                  changed_specifications.add(
                      (area, function_name, sub_function, module, parts[5])
                  )

          changed_engineering_files = sorted(set(changed_engineering_files))

          if not affected_modules:
              UPDATED_MANIFESTS_FILE.write_text("", encoding="utf-8")
              BASELINE_FILES_FILE.write_text("", encoding="utf-8")
              AFFECTED_MODULES_FILE.write_text("", encoding="utf-8")
              with github_output.open("a", encoding="utf-8") as output:
                  output.write("changes_created=false\n")
              print("No applicable HEMS engineering-content changes were detected.")
              raise SystemExit(0)

          updated_manifests = []
          version_summary = []

          def update_manifest(path, identity, logical_name):
              old_text = path.read_text(encoding="utf-8", errors="replace") if path.is_file() else ""
              if current_merge(old_text) == merge_sha:
                  print(f"Already processed for this merge: {path}")
                  return

              version = current_version(old_text) + 1
              version_label = f"{logical_name}/v{version}"
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                  render_version_manifest(path, identity, version, version_label, old_text),
                  encoding="utf-8",
              )
              updated_manifests.append(path.as_posix())
              version_summary.append((logical_name, version, path.as_posix()))
              print(f"Updated {path} to version {version}")

          for area, function_name, sub_function, module in sorted(changed_modules_by_area):
              module_dir = Path("HEMS") / area / function_name / sub_function / module
              manifest_path = module_dir / MODULE_MANIFEST_BY_AREA[area]
              identity = {
                  "manifest_level": "module",
                  "module": module,
                  "type": MODULE_TYPE_BY_AREA[area],
                  "area": area,
                  "function": function_name,
                  "sub_function": sub_function,
              }
              logical_name = "/".join([
                  "module", area, function_name, sub_function, module
              ])
              update_manifest(manifest_path, identity, logical_name)

          for area, function_name, sub_function, module, package in sorted(changed_specifications):
              package_dir = Path("HEMS") / area / function_name / sub_function / module / package
              if not package_dir.is_dir():
                  print(f"Skipping missing package: {package_dir}")
                  continue

              specification = extract_specification(area, module, package)
              manifest_path = package_dir / "specification-manifest.yaml"
              identity = {
                  "manifest_level": "specification",
                  "specification": specification,
                  "package": package,
                  "type": (
                      "source_specification"
                      if area == "SPEC_HEMS"
                      else "generated_code_specification"
                  ),
                  "area": area,
                  "function": function_name,
                  "sub_function": sub_function,
                  "module": module,
              }
              logical_name = "/".join([
                  "specification", area, function_name,
                  sub_function, module, specification,
              ])
              update_manifest(manifest_path, identity, logical_name)

          baseline_files = []
          module_package_records = []

          for function_name, sub_function, module in sorted(affected_modules):
              baseline_dir = (
                  Path("HEMS") / "BASELINES" / function_name /
                  sub_function / module / tag_name
              )
              baseline_dir.mkdir(parents=True, exist_ok=True)

              staging_dir = Path("module-package-staging") / function_name / sub_function / module
              shutil.rmtree(staging_dir, ignore_errors=True)
              staging_dir.mkdir(parents=True, exist_ok=True)

              included_files = []
              for area in ("CODE_HEMS", "MOD_HEMS", "SPEC_HEMS"):
                  module_source = Path("HEMS") / area / function_name / sub_function / module
                  if not module_source.is_dir():
                      continue

                  module_destination = staging_dir / "HEMS" / area / function_name / sub_function / module
                  shutil.copytree(module_source, module_destination, dirs_exist_ok=True)
                  included_files.extend(
                      path.as_posix()
                      for path in sorted(module_source.rglob("*"))
                      if path.is_file()
                  )

              if not included_files:
                  raise RuntimeError(
                      f"No module content found for {function_name}/{sub_function}/{module}"
                  )

              module_zip = baseline_dir / f"{module}-{tag_name}.zip"
              module_manifest = baseline_dir / "baseline-manifest.yaml"
              module_checksums = baseline_dir / "checksums.sha256"
              module_details = baseline_dir / "tag-details.txt"

              checksum_lines = []
              for file_name in included_files:
                  digest = hashlib.sha256(Path(file_name).read_bytes()).hexdigest()
                  checksum_lines.append(f"{digest}  {file_name}")

              relevant_versions = [
                  record for record in version_summary
                  if f"/{function_name}/{sub_function}/{module}" in record[0]
              ]

              manifest_lines = [
                  f"baseline_tag: {yaml_quote(tag_name)}",
                  f"repository: {yaml_quote(repository)}",
                  f"function: {yaml_quote(function_name)}",
                  f"sub_function: {yaml_quote(sub_function)}",
                  f"module: {yaml_quote(module)}",
                  f"pull_request: {yaml_quote(pr_number)}",
                  f"merge_commit: {yaml_quote(merge_sha)}",
                  f"generated_utc: {yaml_quote(generated_utc)}",
                  "versions:",
              ]
              for logical_name, version, manifest_path in relevant_versions:
                  manifest_lines.extend([
                      f"  - component: {yaml_quote(logical_name)}",
                      f"    version: {version}",
                      f"    manifest: {yaml_quote(manifest_path)}",
                  ])
              if not relevant_versions:
                  manifest_lines.append("  []")
              manifest_lines.append("included_files:")
              manifest_lines.extend(f"  - {yaml_quote(item)}" for item in included_files)

              module_manifest.write_text(
                  "\n".join(manifest_lines) + "\n", encoding="utf-8"
              )
              module_checksums.write_text(
                  "\n".join(checksum_lines) + "\n", encoding="utf-8"
              )
              module_details.write_text(
                  "\n".join([
                      "HEMS module baseline",
                      "",
                      f"Tag: {tag_name}",
                      f"Function: {function_name}",
                      f"Sub-function: {sub_function}",
                      f"Module: {module}",
                      f"Pull request: #{pr_number}",
                      f"Merge commit: {merge_sha}",
                      "",
                      "Original merge message:",
                      merge_message,
                      "",
                      f"Downloadable module ZIP: {module_zip.as_posix()}",
                  ]) + "\n",
                  encoding="utf-8",
              )

              for metadata in (module_manifest, module_checksums, module_details):
                  destination = staging_dir / metadata.name
                  shutil.copy2(metadata, destination)

              with zipfile.ZipFile(module_zip, "w", zipfile.ZIP_DEFLATED) as archive:
                  for path in sorted(staging_dir.rglob("*")):
                      if path.is_file():
                          archive.write(path, path.relative_to(staging_dir).as_posix())

              baseline_files.extend([
                  module_manifest.as_posix(),
                  module_checksums.as_posix(),
                  module_details.as_posix(),
                  module_zip.as_posix(),
              ])
              module_package_records.append((
                  function_name,
                  sub_function,
                  module,
                  module_zip.as_posix(),
              ))

          consolidated_details = [
              "HEMS consolidated module baseline",
              "",
              "Original merge message:",
              merge_message,
              "",
              f"Repository: {repository}",
              f"Pull request: #{pr_number}",
              f"Merge commit: {merge_sha}",
              "",
              "Affected modules and downloadable ZIP paths:",
          ]
          for function_name, sub_function, module, zip_path in module_package_records:
              consolidated_details.extend([
                  f"- {function_name}/{sub_function}/{module}",
                  f"  ZIP: {zip_path}",
              ])
          consolidated_details.extend([
              "",
              "One consolidated Git tag was created for this merged PR.",
              "No GitHub Release was created automatically.",
              "To show a module ZIP directly under Assets, create a Release manually from this tag and upload the required ZIP.",
          ])
          TAG_DETAILS_WORK_FILE.write_text(
              "\n".join(consolidated_details) + "\n", encoding="utf-8"
          )

          UPDATED_MANIFESTS_FILE.write_text(
              "\n".join(updated_manifests) + ("\n" if updated_manifests else ""),
              encoding="utf-8",
          )
          BASELINE_FILES_FILE.write_text(
              "\n".join(baseline_files) + "\n",
              encoding="utf-8",
          )
          AFFECTED_MODULES_FILE.write_text(
              "\n".join(
                  "/".join(module_key) for module_key in sorted(affected_modules)
              ) + "\n",
              encoding="utf-8",
          )

          with github_output.open("a", encoding="utf-8") as output:
              output.write("changes_created=true\n")
              output.write(f"tag_name={tag_name}\n")
              output.write(f"merge_sha={merge_sha}\n")

          print("============================================================")
          print(f"Tag: {tag_name}")
          print(f"Affected modules: {len(affected_modules)}")
          print(f"Updated manifests: {len(updated_manifests)}")
          print(f"Module ZIP files: {len(module_package_records)}")
          for _, _, module, zip_path in module_package_records:
              print(f"- {module}: {zip_path}")
          print("No GitHub Release was created.")
          PYTHON_SCRIPT

      - name: Review generated manifests and module baselines
        if: steps.baseline.outputs.changes_created == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Affected modules:"
          cat affected-modules.txt
          echo ""
          echo "Updated manifests:"
          cat updated-manifests.txt
          echo ""
          echo "Generated baseline files:"
          cat baseline-files.txt
          echo ""
          git diff -- HEMS/CODE_HEMS HEMS/MOD_HEMS HEMS/SPEC_HEMS HEMS/BASELINES

      - name: Commit manifests and per-module ZIP files to main
        if: steps.baseline.outputs.changes_created == 'true'
        shell: bash
        env:
          ACCESS_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ steps.baseline.outputs.merge_sha }}
          TAG_NAME: ${{ steps.baseline.outputs.tag_name }}
        run: |
          set -euo pipefail

          for list_file in updated-manifests.txt baseline-files.txt; do
            while IFS= read -r generated_file; do
              if [[ -z "$generated_file" ]]; then
                continue
              fi
              if [[ ! -f "$generated_file" ]]; then
                echo "::error::Generated file is missing: $generated_file"
                exit 1
              fi
              git add -- "$generated_file"
            done < "$list_file"
          done

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "Create module baselines ${TAG_NAME} after PR #${PR_NUMBER}"

          AUTH_VALUE="$(printf 'x-access-token:%s' "$ACCESS_TOKEN" | base64 | tr -d '\n')"
          git config http."${SERVER_URL}/".extraheader "AUTHORIZATION: basic ${AUTH_VALUE}"

          cleanup_auth() {
            git config --unset-all http."${SERVER_URL}/".extraheader 2>/dev/null || true
          }
          trap cleanup_auth EXIT

          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if [[ "$(git rev-parse refs/remotes/origin/main)" != "$MERGE_SHA" ]]; then
            echo "::error::main changed after this PR merge. Reconcile the latest main branch and retry."
            exit 1
          fi

          git push origin HEAD:main

          cleanup_auth
          trap - EXIT

      - name: Create and push exactly one consolidated annotated tag
        if: steps.baseline.outputs.changes_created == 'true'
        shell: bash
        env:
          ACCESS_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          TAG_NAME: ${{ steps.baseline.outputs.tag_name }}
        run: |
          set -euo pipefail

          TAG_TARGET="$(git rev-parse HEAD)"

          if [[ ! -f consolidated-tag-details.txt ]]; then
            echo "::error::Consolidated tag details file is missing."
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/$TAG_NAME"; then
            echo "::error::Tag already exists: $TAG_NAME"
            exit 1
          fi

          git tag --annotate "$TAG_NAME" "$TAG_TARGET" \
            --file consolidated-tag-details.txt

          AUTH_VALUE="$(printf 'x-access-token:%s' "$ACCESS_TOKEN" | base64 | tr -d '\n')"
          git config http."${SERVER_URL}/".extraheader "AUTHORIZATION: basic ${AUTH_VALUE}"

          cleanup_auth() {
            git config --unset-all http."${SERVER_URL}/".extraheader 2>/dev/null || true
          }
          trap cleanup_auth EXIT

          git push origin "refs/tags/$TAG_NAME"

          cleanup_auth
          trap - EXIT

          echo "Created exactly one tag: $TAG_NAME"
          echo "The tag points to the commit containing all per-module ZIP files."
          echo "No GitHub Release was created."

      - name: Summary
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.baseline.outputs.changes_created }}" == "true" ]]; then
            echo "HEMS module baseline generation completed."
            echo "Tag: ${{ steps.baseline.outputs.tag_name }}"
            echo ""
            echo "Affected modules:"
            cat affected-modules.txt
            echo ""
            echo "Module ZIP files are stored under:"
            echo "HEMS/BASELINES/<Function>/<Sub-function>/<Module>/${{ steps.baseline.outputs.tag_name }}/"
            echo ""
