name: Consolidated HEMS Merge Versioning

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: consolidated-hems-versioning-main
  cancel-in-progress: false

jobs:
  version-and-package:
    name: Update manifests, create ZIP, and create one tag
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Verify required runner tools
        shell: bash
        run: |
          set -euo pipefail

          for tool in git python3 base64; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::Required runner tool is missing: $tool"
              exit 1
            fi
          done

      - name: Checkout latest main and fetch tags using Git
        shell: bash
        env:
          ACCESS_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          REPOSITORY_URL="${SERVER_URL}/${REPOSITORY}.git"
          AUTH_VALUE="$(printf 'x-access-token:%s' "$ACCESS_TOKEN" | base64 | tr -d '\n')"

          git init -b main .
          git remote add origin "$REPOSITORY_URL"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http."${SERVER_URL}/".extraheader "AUTHORIZATION: basic ${AUTH_VALUE}"

          cleanup_auth() {
            git config --unset-all http."${SERVER_URL}/".extraheader 2>/dev/null || true
          }
          trap cleanup_auth EXIT

          git fetch --prune origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/*:refs/tags/*"

          if ! git cat-file -e "${MERGE_SHA}^{commit}" 2>/dev/null; then
            git fetch origin "$MERGE_SHA"
          fi

          git checkout --force -B main refs/remotes/origin/main
          git clean -ffdx

          cleanup_auth
          trap - EXIT

      - name: Update manifests and build consolidated baseline package
        id: baseline
        shell: bash
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          python3 <<'PYTHON_SCRIPT'
          import hashlib
          import os
          import re
          import shutil
          import subprocess
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          merge_sha = os.environ["MERGE_SHA"].strip()
          pr_number = os.environ["PR_NUMBER"].strip()
          pr_title = os.environ["PR_TITLE"].strip()
          source_branch = os.environ["SOURCE_BRANCH"].strip()
          target_branch = os.environ["TARGET_BRANCH"].strip()
          repository = os.environ["REPOSITORY"].strip()
          github_output = Path(os.environ["GITHUB_OUTPUT"])
          updated_utc = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          module_manifest_by_area = {
              "CODE_HEMS": "code-manifest.yaml",
              "MOD_HEMS": "module-manifest.yaml",
              "SPEC_HEMS": "spec-manifest.yaml",
          }
          module_type_by_area = {
              "CODE_HEMS": "code",
              "MOD_HEMS": "module",
              "SPEC_HEMS": "specification",
          }
          specification_areas = {"CODE_HEMS", "SPEC_HEMS"}
          generated_metadata = {
              "code-manifest.yaml",
              "module-manifest.yaml",
              "spec-manifest.yaml",
              "specification-manifest.yaml",
              "component-manifest.yaml",
              "trace_links.csv",
              ".keep",
          }

          updated_manifests_path = Path("updated-manifests.txt")
          changed_engineering_path = Path("changed-engineering-files.txt")
          baseline_files_path = Path("baseline-files.txt")

          def git(*args, check=True):
              result = subprocess.run(
                  ["git", *args],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if check and result.returncode != 0:
                  print(result.stdout)
                  print(result.stderr)
                  raise RuntimeError(f"Git command failed: git {' '.join(args)}")
              return result.stdout.strip(), result.returncode

          def yaml_quote(value):
              value = str(value).replace("\\", "\\\\").replace('"', '\\"')
              return f'"{value}"'

          def safe_component(value):
              value = re.sub(r"[^A-Za-z0-9._-]+", "-", value)
              value = re.sub(r"-+", "-", value).strip(".-")
              return value or "merge"

          def top_value(text, key):
              match = re.search(
                  rf"^{re.escape(key)}:\s*(.*?)\s*$",
                  text,
                  re.MULTILINE,
              )
              if not match:
                  return ""
              value = match.group(1).strip()
              if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                  value = value[1:-1]
              return value

          def nested_value(text, section, key):
              lines = text.splitlines()
              try:
                  start = lines.index(f"{section}:") + 1
              except ValueError:
                  return ""
              for line in lines[start:]:
                  if line and not line.startswith((" ", "\t")):
                      break
                  match = re.match(rf"^\s+{re.escape(key)}:\s*(.*?)\s*$", line)
                  if match:
                      value = match.group(1).strip()
                      if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                          value = value[1:-1]
                      return value
              return ""

          def existing_version(text):
              value = nested_value(text, "item_version", "version") or top_value(text, "version")
              return int(value) if value.isdigit() else 0

          def existing_merge(text):
              return nested_value(text, "item_version", "sha") or top_value(text, "commit")

          def parse_history(text):
              lines = text.splitlines()
              start = None
              for marker in ("item_version_history:", "version_history:"):
                  if marker in lines:
                      start = lines.index(marker) + 1
                      break
              if start is None:
                  return []

              history = []
              entry = None
              for line in lines[start:]:
                  if line and not line.startswith((" ", "\t")):
                      break
                  version_match = re.match(r"^\s+-\s+version:\s*(\d+)\s*$", line)
                  field_match = re.match(r"^\s+([A-Za-z0-9_]+):\s*(.*?)\s*$", line)
                  if version_match:
                      if entry:
                          history.append(entry)
                      entry = {"version": version_match.group(1)}
                  elif field_match and entry is not None:
                      entry[field_match.group(1)] = field_match.group(2).strip().strip("\"'")
              if entry:
                  history.append(entry)
              return history

          def content_files(directory):
              files = []
              for path in directory.rglob("*"):
                  if path.is_file() and path.name not in generated_metadata:
                      files.append(path.relative_to(directory).as_posix())
              return sorted(files)

          def extract_specification(area, module, package):
              prefix = f"a_{module}_"
              suffix = "_A" if area == "SPEC_HEMS" else "_A_RI_16_0(1.0)"
              if package.startswith(prefix) and package.endswith(suffix):
                  return package[len(prefix):-len(suffix)]
              return package

          def render_manifest(path, identity, version, version_label, old_text):
              history = [
                  entry for entry in parse_history(old_text)
                  if (entry.get("sha") or entry.get("commit")) != merge_sha
              ]
              history.append({
                  "version": str(version),
                  "tag": version_label,
                  "sha": merge_sha,
                  "pr": pr_number,
                  "updated_utc": updated_utc,
              })

              lines = [f"{key}: {yaml_quote(value)}" for key, value in identity.items()]
              lines.extend([
                  f"version: {version}",
                  'delivery_cycle: "not_released"',
                  f"version_label: {yaml_quote(version_label)}",
                  f"commit: {yaml_quote(merge_sha)}",
                  f"pull_request: {yaml_quote(pr_number)}",
                  f"updated_utc: {yaml_quote(updated_utc)}",
                  f"source_branch: {yaml_quote(source_branch)}",
                  f"target_branch: {yaml_quote(target_branch)}",
                  f"pull_request_title: {yaml_quote(pr_title)}",
                  'generated_by: "GitHub Actions"',
                  "automation_owned: true",
                  "main_branch_only: true",
                  "files:",
              ])
              files = content_files(path.parent)
              lines.extend([f"  - {yaml_quote(item)}" for item in files] or ["  []"])
              lines.extend([
                  "item_version:",
                  f"  version: {version}",
                  f"  label: {yaml_quote(version_label)}",
                  f"  sha: {yaml_quote(merge_sha)}",
                  f"  pr: {yaml_quote(pr_number)}",
                  f"  updated_utc: {yaml_quote(updated_utc)}",
                  "item_version_history:",
              ])
              for record in history:
                  lines.extend([
                      f"  - version: {record['version']}",
                      f"    label: {yaml_quote(record.get('label') or record.get('tag', 'not_available'))}",
                      f"    sha: {yaml_quote(record.get('sha') or record.get('commit', 'not_available'))}",
                      f"    pr: {yaml_quote(record.get('pr') or record.get('pull_request', 'not_available'))}",
                      f"    updated_utc: {yaml_quote(record.get('updated_utc', 'not_available'))}",
                  ])
              return "\n".join(lines) + "\n"

          if not merge_sha or merge_sha == "0" * 40:
              raise RuntimeError("Merge commit SHA is unavailable.")

          parents_text, _ = git("rev-list", "--parents", "-n", "1", merge_sha)
          parents = parents_text.split()
          if len(parents) < 3:
              raise RuntimeError(
                  "Use the standard 'Create a merge commit' method. "
                  "Squash and rebase merges are not supported by this workflow."
              )
          first_parent = parents[1]

          merge_subject, _ = git("log", "-1", "--format=%s", merge_sha)
          merge_message, _ = git("log", "-1", "--format=%B", merge_sha)

          tag_name = safe_component(merge_subject)[:120]
          if not tag_name:
              tag_name = f"merge-{merge_sha[:12]}"

          _, tag_exists = git(
              "show-ref", "--verify", "--quiet", f"refs/tags/{tag_name}", check=False
          )
          if tag_exists == 0:
              raise RuntimeError(
                  f"The consolidated tag already exists: {tag_name}. "
                  "Use a unique merge message for each baseline."
              )

          changed_text, _ = git(
              "diff", "--name-only", "--diff-filter=ACMR", first_parent, merge_sha
          )
          changed_files = [line for line in changed_text.splitlines() if line]

          changed_engineering_files = []
          changed_modules = set()
          changed_specifications = set()

          for file_name in changed_files:
              parts = file_name.split("/")
              if len(parts) < 6 or parts[0] != "HEMS":
                  continue

              area, function_name, sub_function, module = parts[1:5]
              if area not in module_manifest_by_area:
                  continue
              if Path(file_name).name in generated_metadata:
                  print(f"Ignoring generated metadata change: {file_name}")
                  continue
              if not Path(file_name).is_file():
                  continue

              changed_engineering_files.append(file_name)
              changed_modules.add((area, function_name, sub_function, module))

              if area in specification_areas and len(parts) >= 7:
                  changed_specifications.add(
                      (area, function_name, sub_function, module, parts[5])
                  )

          changed_engineering_files = sorted(set(changed_engineering_files))

          if not changed_engineering_files:
              updated_manifests_path.write_text("", encoding="utf-8")
              changed_engineering_path.write_text("", encoding="utf-8")
              baseline_files_path.write_text("", encoding="utf-8")
              with github_output.open("a", encoding="utf-8") as output:
                  output.write("changes_created=false\n")
              print("No changed HEMS engineering files were found.")
              raise SystemExit(0)

          updated_manifests = []
          version_summary = []

          def update_manifest(path, identity, logical_name):
              old_text = path.read_text(encoding="utf-8", errors="replace") if path.is_file() else ""
              if existing_merge(old_text) == merge_sha:
                  print(f"Already processed for this merge: {path}")
                  return

              version = existing_version(old_text) + 1
              version_label = f"{logical_name}/v{version}"
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                  render_manifest(path, identity, version, version_label, old_text),
                  encoding="utf-8",
              )
              updated_manifests.append(path.as_posix())
              version_summary.append((logical_name, version, path.as_posix()))
              print(f"Updated {path} to version {version}")

          for area, function_name, sub_function, module in sorted(changed_modules):
              directory = Path("HEMS") / area / function_name / sub_function / module
              manifest_path = directory / module_manifest_by_area[area]
              identity = {
                  "manifest_level": "module",
                  "module": module,
                  "type": module_type_by_area[area],
                  "area": area,
                  "function": function_name,
                  "sub_function": sub_function,
              }
              logical_name = "/".join([
                  "module", area, function_name, sub_function, module
              ])
              update_manifest(manifest_path, identity, logical_name)

          for area, function_name, sub_function, module, package in sorted(changed_specifications):
              directory = (
                  Path("HEMS") / area / function_name / sub_function / module / package
              )
              if not directory.is_dir():
                  print(f"Skipping missing package directory: {directory}")
                  continue

              specification = extract_specification(area, module, package)
              manifest_path = directory / "specification-manifest.yaml"
              identity = {
                  "manifest_level": "specification",
                  "specification": specification,
                  "package": package,
                  "type": (
                      "source_specification"
                      if area == "SPEC_HEMS"
                      else "generated_code_specification"
                  ),
                  "area": area,
                  "function": function_name,
                  "sub_function": sub_function,
                  "module": module,
              }
              logical_name = "/".join([
                  "specification", area, function_name,
                  sub_function, module, specification,
              ])
              update_manifest(manifest_path, identity, logical_name)

          baseline_dir = Path("HEMS") / "BASELINES" / tag_name
          baseline_dir.mkdir(parents=True, exist_ok=True)
          package_root = Path(f"baseline-content-{tag_name}")
          shutil.rmtree(package_root, ignore_errors=True)
          package_root.mkdir(parents=True)

          all_package_files = sorted(set(changed_engineering_files + updated_manifests))
          for relative_name in all_package_files:
              source = Path(relative_name)
              if not source.is_file():
                  raise RuntimeError(f"Baseline source file is missing: {source}")
              destination = package_root / source
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)

          checksums = []
          for relative_name in all_package_files:
              path = Path(relative_name)
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              checksums.append(f"{digest}  {relative_name}")

          manifest_lines = [
              f"baseline_tag: {yaml_quote(tag_name)}",
              f"repository: {yaml_quote(repository)}",
              f"merge_commit: {yaml_quote(merge_sha)}",
              f"first_parent: {yaml_quote(first_parent)}",
              f"pull_request: {yaml_quote(pr_number)}",
              f"source_branch: {yaml_quote(source_branch)}",
              f"target_branch: {yaml_quote(target_branch)}",
              f"generated_utc: {yaml_quote(updated_utc)}",
              "merge_message: |",
          ]
          manifest_lines.extend(f"  {line}" for line in merge_message.splitlines())
          manifest_lines.append("versions:")
          for logical_name, version, manifest_path in version_summary:
              manifest_lines.extend([
                  f"  - component: {yaml_quote(logical_name)}",
                  f"    version: {version}",
                  f"    manifest: {yaml_quote(manifest_path)}",
              ])
          manifest_lines.append("files:")
          manifest_lines.extend(f"  - {yaml_quote(item)}" for item in all_package_files)

          baseline_manifest = baseline_dir / "baseline-manifest.yaml"
          baseline_checksums = baseline_dir / "checksums.sha256"
          baseline_notes = baseline_dir / "tag-details.txt"
          baseline_zip = baseline_dir / f"changed-files-{tag_name}.zip"

          baseline_manifest.write_text("\n".join(manifest_lines) + "\n", encoding="utf-8")
          baseline_checksums.write_text("\n".join(checksums) + "\n", encoding="utf-8")

          def details_section(title, values):
              return [title] + ([f"- {value}" for value in values] or ["- None"])

          modules = sorted({item[3] for item in changed_modules})
          specifications = sorted({
              extract_specification(item[0], item[3], item[4])
              for item in changed_specifications
          })
          tag_details = [
              "HEMS consolidated merge baseline",
              "",
              "Original merge message:",
              merge_message,
              "",
              f"Repository: {repository}",
              f"Pull request: #{pr_number}",
              f"Merge commit: {merge_sha}",
              "",
              *details_section("Modules included:", modules),
              "",
              *details_section("Specifications included:", specifications),
              "",
              *details_section(
                  "Versioned components:",
                  [f"{name} = v{version}" for name, version, _ in version_summary],
              ),
              "",
              *details_section("Files included:", all_package_files),
              "",
              f"ZIP stored in repository: {baseline_zip.as_posix()}",
              "No GitHub Release was created. A user may create a Release manually from this tag.",
          ]
          baseline_notes.write_text("\n".join(tag_details) + "\n", encoding="utf-8")

          for metadata in (baseline_manifest, baseline_checksums, baseline_notes):
              destination = package_root / metadata
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(metadata, destination)

          with zipfile.ZipFile(baseline_zip, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(package_root.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.as_posix())

          updated_manifests_path.write_text(
              "\n".join(updated_manifests) + "\n",
              encoding="utf-8",
          )
          changed_engineering_path.write_text(
              "\n".join(changed_engineering_files) + "\n",
              encoding="utf-8",
          )
          baseline_files = [
              baseline_manifest.as_posix(),
              baseline_checksums.as_posix(),
              baseline_notes.as_posix(),
              baseline_zip.as_posix(),
          ]
          baseline_files_path.write_text(
              "\n".join(baseline_files) + "\n",
              encoding="utf-8",
          )

          with github_output.open("a", encoding="utf-8") as output:
              output.write("changes_created=true\n")
              output.write(f"tag_name={tag_name}\n")
              output.write(f"merge_sha={merge_sha}\n")

          print("============================================================")
          print(f"Consolidated tag: {tag_name}")
          print(f"Changed engineering files: {len(changed_engineering_files)}")
          print(f"Updated manifests: {len(updated_manifests)}")
          print(f"Versioned components: {len(version_summary)}")
          print(f"ZIP: {baseline_zip}")
          print("No module/specification tags were created.")
          print("No GitHub Release will be created.")
          PYTHON_SCRIPT

      - name: Review generated manifests and baseline package
        if: steps.baseline.outputs.changes_created == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Updated manifests:"
          cat updated-manifests.txt
          echo ""
          echo "Changed engineering files:"
          cat changed-engineering-files.txt
          echo ""
          echo "Baseline files committed to main:"
          cat baseline-files.txt
          echo ""
          git diff -- HEMS/CODE_HEMS HEMS/MOD_HEMS HEMS/SPEC_HEMS HEMS/BASELINES

      - name: Commit manifests and ZIP to main
        if: steps.baseline.outputs.changes_created == 'true'
        shell: bash
        env:
          ACCESS_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ steps.baseline.outputs.merge_sha }}
          TAG_NAME: ${{ steps.baseline.outputs.tag_name }}
        run: |
          set -euo pipefail

          while IFS= read -r file; do
            if [[ -z "$file" ]]; then
              continue
            fi
            if [[ ! -f "$file" ]]; then
              echo "::error::Generated file is missing: $file"
              exit 1
            fi
            git add -- "$file"
          done < updated-manifests.txt

          while IFS= read -r file; do
            if [[ -z "$file" ]]; then
              continue
            fi
            if [[ ! -f "$file" ]]; then
              echo "::error::Baseline file is missing: $file"
              exit 1
            fi
            git add -- "$file"
          done < baseline-files.txt

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "Create consolidated HEMS baseline ${TAG_NAME} after PR #${PR_NUMBER}"

          AUTH_VALUE="$(printf 'x-access-token:%s' "$ACCESS_TOKEN" | base64 | tr -d '\n')"
          git config http."${SERVER_URL}/".extraheader "AUTHORIZATION: basic ${AUTH_VALUE}"

          cleanup_auth() {
            git config --unset-all http."${SERVER_URL}/".extraheader 2>/dev/null || true
          }
          trap cleanup_auth EXIT

          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if [[ "$(git rev-parse refs/remotes/origin/main)" != "$MERGE_SHA" ]]; then
            echo "::error::main changed after this PR merge. Reconcile latest main before retrying."
            exit 1
          fi

          git push origin HEAD:main

          cleanup_auth
          trap - EXIT

      - name: Create and push exactly one annotated tag
        if: steps.baseline.outputs.changes_created == 'true'
        shell: bash
        env:
          ACCESS_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          TAG_NAME: ${{ steps.baseline.outputs.tag_name }}
        run: |
          set -euo pipefail

          TAG_TARGET="$(git rev-parse HEAD)"
          TAG_DETAILS="HEMS/BASELINES/${TAG_NAME}/tag-details.txt"

          if [[ ! -f "$TAG_DETAILS" ]]; then
            echo "::error::Tag details file is missing: $TAG_DETAILS"
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/$TAG_NAME"; then
            echo "::error::Tag already exists: $TAG_NAME"
            exit 1
          fi

          git tag --annotate "$TAG_NAME" "$TAG_TARGET" --file "$TAG_DETAILS"

          AUTH_VALUE="$(printf 'x-access-token:%s' "$ACCESS_TOKEN" | base64 | tr -d '\n')"
          git config http."${SERVER_URL}/".extraheader "AUTHORIZATION: basic ${AUTH_VALUE}"

          cleanup_auth() {
            git config --unset-all http."${SERVER_URL}/".extraheader 2>/dev/null || true
          }
          trap cleanup_auth EXIT

          git push origin "refs/tags/$TAG_NAME"

          cleanup_auth
          trap - EXIT

          echo "Created exactly one consolidated tag: $TAG_NAME"
          echo "No separate MOD_HEMS, SPEC_HEMS, CODE_HEMS, module, or specification tags were created."
          echo "No GitHub Release was created."

      - name: Summary
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.baseline.outputs.changes_created }}" == "true" ]]; then
            echo "Consolidated HEMS versioning completed."
            echo "Tag: ${{ steps.baseline.outputs.tag_name }}"
            echo "ZIP: HEMS/BASELINES/${{ steps.baseline.outputs.tag_name }}/changed-files-${{ steps.baseline.outputs.tag_name }}.zip"
            echo "A Release was not created. Create a Release manually from the tag if required."
          else
            echo "No applicable HEMS engineering files changed."
          fi
