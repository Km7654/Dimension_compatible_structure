name: Automatic Merge Baseline

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: automatic-merge-baseline-main
  cancel-in-progress: false

jobs:
  create-merge-baseline:
    name: Create ZIP, annotated tag, and release
    runs-on: ubuntu-latest

    steps:
      - name: Check required tools
        shell: bash
        run: |
          set -euo pipefail

          for tool in git python3 gh base64; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::Required runner tool is missing: $tool"
              exit 1
            fi
          done

      - name: Checkout main using Git
        shell: bash
        env:
          ACCESS_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          REPOSITORY_URL="${SERVER_URL}/${REPOSITORY}.git"
          AUTH_VALUE="$(printf 'x-access-token:%s' "$ACCESS_TOKEN" | base64 | tr -d '\n')"

          git init .
          git remote add origin "$REPOSITORY_URL"
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local http."${SERVER_URL}/".extraheader "AUTHORIZATION: basic ${AUTH_VALUE}"

          cleanup_auth() {
            git config --local --unset-all http."${SERVER_URL}/".extraheader 2>/dev/null || true
          }
          trap cleanup_auth EXIT

          git fetch --no-tags --prune origin \
            "+refs/heads/main:refs/remotes/origin/main"

          if ! git cat-file -e "${MERGE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$MERGE_SHA"
          fi

          if [[ -n "$BEFORE_SHA" ]] && \
             [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] && \
             ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BEFORE_SHA"
          fi

          git checkout --force --detach "$MERGE_SHA"
          git clean -ffdx

          cleanup_auth
          trap - EXIT

      - name: Validate merge and collect changed HEMS files
        id: baseline
        shell: bash
        env:
          MERGE_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ -z "$BEFORE_SHA" ]] || \
             [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "::notice::No valid commit exists before this push. Baseline creation is skipped."
            echo "create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::Pre-merge commit is unavailable: $BEFORE_SHA"
            exit 1
          fi

          PARENT_COUNT="$(git rev-list --parents -n 1 "$MERGE_SHA" | awk '{print NF - 1}')"
          if [[ "$PARENT_COUNT" -lt 2 ]]; then
            echo "::notice::Latest main commit is not a standard merge commit. Baseline creation is skipped."
            echo "Commit: $MERGE_SHA"
            echo "Parent count: $PARENT_COUNT"
            echo "create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MERGE_SUBJECT="$(git log -1 --format='%s' "$MERGE_SHA")"
          git log -1 --format='%B' "$MERGE_SHA" > merge-message.txt

          if [[ -z "$MERGE_SUBJECT" ]]; then
            echo "::error::Merge commit subject is empty."
            exit 1
          fi

          # Use Python instead of sed so braces and other special characters
          # in merge messages cannot break tag-name sanitization.
          TAG_NAME="$(MERGE_SUBJECT_VALUE="$MERGE_SUBJECT" python3 - <<'PYTHON_TAG'
          import os
          import re

          value = os.environ["MERGE_SUBJECT_VALUE"].strip()
          value = re.sub(r"\s+", "-", value)
          value = re.sub(r"[~^:?*\[\]\\@{}]+", "-", value)
          value = value.replace("..", "-").replace("/", "-")
          value = re.sub(r"-+", "-", value).strip(".-")
          value = value.replace("@{", "-")
          if value.endswith(".lock"):
              value = value[:-5]
          print(value[:120])
          PYTHON_TAG
          )"

          if [[ -z "$TAG_NAME" ]] || ! git check-ref-format "refs/tags/$TAG_NAME"; then
            TAG_NAME="merge-${MERGE_SHA:0:12}"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            TAG_NAME="${TAG_NAME}-${MERGE_SHA:0:12}"
          fi

          : > changed-hems-files.txt
          while IFS= read -r path; do
            case "$path" in
              HEMS/CODE_HEMS/*|HEMS/MOD_HEMS/*|HEMS/SPEC_HEMS/*)
                if [[ -f "$path" ]]; then
                  printf '%s\n' "$path" >> changed-hems-files.txt
                fi
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR "$BEFORE_SHA" "$MERGE_SHA")

          sort -u changed-hems-files.txt -o changed-hems-files.txt

          if [[ ! -s changed-hems-files.txt ]]; then
            echo "::notice::Merge contains no added, copied, modified, or renamed files in controlled HEMS areas."
            echo "create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "create=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "before_sha=$BEFORE_SHA" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"

          echo "Merge subject: $MERGE_SUBJECT"
          echo "Generated tag: $TAG_NAME"
          echo "Changed HEMS files:"
          cat changed-hems-files.txt

      - name: Build ZIP and baseline metadata
        if: steps.baseline.outputs.create == 'true'
        shell: bash
        env:
          TAG_NAME: ${{ steps.baseline.outputs.tag_name }}
          BEFORE_SHA: ${{ steps.baseline.outputs.before_sha }}
          MERGE_SHA: ${{ steps.baseline.outputs.merge_sha }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          python3 - <<'PYTHON_BASELINE'
          import hashlib
          import os
          import pathlib
          import subprocess
          import zipfile

          tag = os.environ["TAG_NAME"]
          before_sha = os.environ["BEFORE_SHA"]
          merge_sha = os.environ["MERGE_SHA"]
          repository = os.environ["REPOSITORY"]
          actor = os.environ["ACTOR"]

          package_root = pathlib.Path(f"merge-baseline-{tag}")
          zip_path = pathlib.Path(f"merge-baseline-{tag}.zip")
          manifest_path = pathlib.Path(f"baseline-manifest-{tag}.yaml")
          tree_path = pathlib.Path(f"baseline-folder-tree-{tag}.md")
          checksum_path = pathlib.Path(f"checksums-{tag}.sha256")
          tag_message_path = pathlib.Path(f"tag-message-{tag}.txt")

          files = [
              pathlib.Path(line.strip())
              for line in pathlib.Path("changed-hems-files.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          merge_message = pathlib.Path("merge-message.txt").read_text(encoding="utf-8").strip()

          modules = sorted({p.parts[4] for p in files if len(p.parts) >= 6})
          specifications = sorted({
              p.parts[5] for p in files
              if len(p.parts) >= 7 and p.parts[1] == "SPEC_HEMS"
          })
          code_packages = sorted({
              p.parts[5] for p in files
              if len(p.parts) >= 7 and p.parts[1] == "CODE_HEMS"
          })
          model_packages = sorted({
              p.parts[5] for p in files
              if len(p.parts) >= 7 and p.parts[1] == "MOD_HEMS"
          })

          def quote(value):
              value = str(value).replace("\\", "\\\\").replace('"', '\\"')
              return f'"{value}"'

          manifest = [
              f"tag: {quote(tag)}",
              f"repository: {quote(repository)}",
              f"generated_by: {quote(actor)}",
              f"before_commit: {quote(before_sha)}",
              f"merge_commit: {quote(merge_sha)}",
              "merge_message: |",
          ]
          manifest.extend(f"  {line}" for line in merge_message.splitlines())

          for heading, values in (
              ("modules", modules),
              ("specifications", specifications),
              ("code_packages", code_packages),
              ("model_packages", model_packages),
          ):
              manifest.append(f"{heading}:")
              if values:
                  manifest.extend(f"  - {quote(value)}" for value in values)
              else:
                  manifest.append("  []")

          manifest.append("released_files:")
          checksums = []
          for path in files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              last_commit = subprocess.check_output(
                  ["git", "log", "-n", "1", "--format=%H", "--", str(path)],
                  text=True,
              ).strip() or "unknown"
              package = path.parts[5] if len(path.parts) >= 7 else "not_applicable"
              manifest.extend([
                  f"  - path: {quote(path)}",
                  f"    area: {quote(path.parts[1])}",
                  f"    function: {quote(path.parts[2])}",
                  f"    sub_function: {quote(path.parts[3])}",
                  f"    module: {quote(path.parts[4])}",
                  f"    package: {quote(package)}",
                  f"    file_name: {quote(path.name)}",
                  f"    sha256: {quote(digest)}",
                  f"    last_changed_commit: {quote(last_commit)}",
              ])
              checksums.append(f"{digest}  {path}")

          manifest_path.write_text("\n".join(manifest) + "\n", encoding="utf-8")
          checksum_path.write_text("\n".join(checksums) + "\n", encoding="utf-8")

          tree = {}
          for path in files:
              current = tree
              for part in path.parts:
                  current = current.setdefault(part, {})

          def render(node, prefix=""):
              lines = []
              entries = sorted(node.items())
              for index, (name, child) in enumerate(entries):
                  last = index == len(entries) - 1
                  lines.append(prefix + ("└── " if last else "├── ") + name)
                  if child:
                      lines.extend(render(child, prefix + ("    " if last else "│   ")))
              return lines

          tree_path.write_text(
              "\n".join([
                  f"# HEMS Merge Baseline: {tag}",
                  "",
                  "```text",
                  *render(tree),
                  "```",
                  "",
                  f"Total released files: {len(files)}",
              ]) + "\n",
              encoding="utf-8",
          )

          def section(title, values):
              result = [title]
              result.extend(f"- {value}" for value in values)
              if not values:
                  result.append("- None")
              return result

          tag_message = [
              "HEMS automatic merge baseline",
              "",
              "Original merge message:",
              merge_message,
              "",
              f"Repository: {repository}",
              f"Pre-merge commit: {before_sha}",
              f"Merge commit: {merge_sha}",
              "",
              *section("Modules included:", modules),
              "",
              *section("Specifications included:", specifications),
              "",
              *section("Code packages included:", code_packages),
              "",
              *section("Model packages included:", model_packages),
              "",
              *section("Files included:", [str(path) for path in files]),
              "",
              f"ZIP asset: {zip_path.name}",
          ]
          tag_message_path.write_text("\n".join(tag_message) + "\n", encoding="utf-8")

          package_root.mkdir(parents=True, exist_ok=True)
          for source in files:
              destination = package_root / source
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(source.read_bytes())

          for metadata in (manifest_path, tree_path, checksum_path, tag_message_path):
              (package_root / metadata.name).write_bytes(metadata.read_bytes())

          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as archive:
              for item in sorted(package_root.rglob("*")):
                  if item.is_file():
                      archive.write(item, item.as_posix())

          print(f"ZIP: {zip_path}")
          print(f"Modules: {len(modules)}")
          print(f"Specifications: {len(specifications)}")
          print(f"Files: {len(files)}")
          PYTHON_BASELINE

          ls -lh \
            "merge-baseline-${TAG_NAME}.zip" \
            "baseline-manifest-${TAG_NAME}.yaml" \
            "baseline-folder-tree-${TAG_NAME}.md" \
            "checksums-${TAG_NAME}.sha256" \
            "tag-message-${TAG_NAME}.txt"

      - name: Create and push annotated Git tag
        if: steps.baseline.outputs.create == 'true'
        shell: bash
        env:
          ACCESS_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          TAG_NAME: ${{ steps.baseline.outputs.tag_name }}
          MERGE_SHA: ${{ steps.baseline.outputs.merge_sha }}
        run: |
          set -euo pipefail

          AUTH_VALUE="$(printf 'x-access-token:%s' "$ACCESS_TOKEN" | base64 | tr -d '\n')"
          git config --local http."${SERVER_URL}/".extraheader "AUTHORIZATION: basic ${AUTH_VALUE}"

          cleanup_auth() {
            git config --local --unset-all http."${SERVER_URL}/".extraheader 2>/dev/null || true
          }
          trap cleanup_auth EXIT

          git tag --annotate "$TAG_NAME" "$MERGE_SHA" \
            --file "tag-message-${TAG_NAME}.txt"
          git push origin "refs/tags/$TAG_NAME"

          cleanup_auth
          trap - EXIT

      - name: Create GitHub Release and upload baseline assets
        if: steps.baseline.outputs.create == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          TAG_NAME: ${{ steps.baseline.outputs.tag_name }}
        run: |
          set -euo pipefail

          GH_HOST="${SERVER_URL#https://}"
          GH_HOST="${GH_HOST#http://}"

          gh release create "$TAG_NAME" \
            "merge-baseline-${TAG_NAME}.zip" \
            "baseline-manifest-${TAG_NAME}.yaml" \
            "baseline-folder-tree-${TAG_NAME}.md" \
            "checksums-${TAG_NAME}.sha256" \
            --hostname "$GH_HOST" \
            --title "HEMS Merge Baseline: $TAG_NAME" \
            --notes-file "tag-message-${TAG_NAME}.txt" \
            --verify-tag

          echo "Baseline release created for tag: $TAG_NAME"
