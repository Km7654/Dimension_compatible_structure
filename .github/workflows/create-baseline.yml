name: Automatic Merge Baseline

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: automatic-merge-baseline-main
  cancel-in-progress: false

jobs:
  create-merge-baseline:
    name: Create baseline package and annotated tag
    runs-on: ubuntu-latest

    steps:
      - name: Check required runner tools
        shell: bash
        run: |
          set -euo pipefail

          required_tools=(git python3 gh sha256sum awk sed)

          for tool in "${required_tools[@]}"; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::Required tool is not installed on the runner: $tool"
              exit 1
            fi
          done

      - name: Checkout exact main commit using Git
        shell: bash
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          REPOSITORY_URL="${SERVER_URL}/${REPOSITORY}.git"
          BASIC_AUTH="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"

          git init .
          git remote add origin "$REPOSITORY_URL"
          git config --local http."${SERVER_URL}/".extraheader "AUTHORIZATION: basic ${BASIC_AUTH}"
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cleanup_credentials() {
            git config --local --unset-all http."${SERVER_URL}/".extraheader 2>/dev/null || true
          }
          trap cleanup_credentials EXIT

          git fetch --no-tags --prune origin \
            "+refs/heads/main:refs/remotes/origin/main"

          if ! git cat-file -e "${CHECKOUT_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$CHECKOUT_SHA"
          fi

          if [[ -n "$BEFORE_SHA" ]] && \
             [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] && \
             ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BEFORE_SHA"
          fi

          git checkout --force --detach "$CHECKOUT_SHA"
          git clean -ffdx

          cleanup_credentials
          trap - EXIT

      - name: Validate merge and determine changed HEMS files
        id: merge
        shell: bash
        env:
          MERGE_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ -z "$BEFORE_SHA" ]] || \
             [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "::notice::No valid pre-push commit is available. Baseline creation is skipped."
            echo "create_baseline=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::The pre-merge commit is not available: $BEFORE_SHA"
            exit 1
          fi

          PARENT_COUNT="$(git rev-list --parents -n 1 "$MERGE_SHA" | awk '{print NF - 1}')"

          if [[ "$PARENT_COUNT" -lt 2 ]]; then
            echo "::notice::The push to main is not a merge commit. Baseline creation is skipped."
            echo "Commit: $MERGE_SHA"
            echo "Parent count: $PARENT_COUNT"
            echo "create_baseline=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MERGE_SUBJECT="$(git log -1 --format='%s' "$MERGE_SHA")"
          MERGE_MESSAGE="$(git log -1 --format='%B' "$MERGE_SHA")"

          if [[ -z "$MERGE_SUBJECT" ]]; then
            echo "::error::The merge commit subject is empty and cannot be used to create a tag."
            exit 1
          fi

          # Git tags cannot contain spaces or several special characters.
          # Convert the merge subject to a safe tag while preserving its meaning.
          TAG_NAME="$(printf '%s' "$MERGE_SUBJECT" \
            | tr '[:space:]' '-' \
            | sed -E 's#[~^:?*\\\[\]@{}]+#-#g; s#\.\.+#-#g; s#/+ #-#g; s#/+#-#g; s#-+#-#g; s#^[.-]+##; s#[.-]+$##')"

          TAG_NAME="${TAG_NAME:0:120}"

          if [[ -z "$TAG_NAME" ]]; then
            TAG_NAME="merge-${MERGE_SHA:0:12}"
          fi

          if ! git check-ref-format "refs/tags/$TAG_NAME"; then
            TAG_NAME="merge-${MERGE_SHA:0:12}"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            TAG_NAME="${TAG_NAME}-${MERGE_SHA:0:12}"
          fi

          git diff --name-only --diff-filter=ACMR "$BEFORE_SHA" "$MERGE_SHA" \
            | grep -E '^HEMS/(CODE_HEMS|MOD_HEMS|SPEC_HEMS)/' \
            | while IFS= read -r path; do
                if [[ -f "$path" ]]; then
                  printf '%s\n' "$path"
                fi
              done \
            | sort -u > changed-hems-files.txt

          if [[ ! -s changed-hems-files.txt ]]; then
            echo "::notice::The merge contains no added, copied, modified, or renamed files under the controlled HEMS areas."
            echo "create_baseline=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "$MERGE_MESSAGE" > merge-message.txt
          printf '%s\n' "$TAG_NAME" > tag-name.txt

          echo "create_baseline=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "before_sha=$BEFORE_SHA" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"

          echo "Merge subject: $MERGE_SUBJECT"
          echo "Generated tag: $TAG_NAME"
          echo "Changed controlled HEMS files:"
          cat changed-hems-files.txt

      - name: Build baseline metadata and ZIP package
        if: steps.merge.outputs.create_baseline == 'true'
        shell: bash
        env:
          TAG_NAME: ${{ steps.merge.outputs.tag_name }}
          BEFORE_SHA: ${{ steps.merge.outputs.before_sha }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          PACKAGE_ROOT="merge-baseline-${TAG_NAME}"
          ZIP_FILE="merge-baseline-${TAG_NAME}.zip"
          MANIFEST_FILE="baseline-manifest-${TAG_NAME}.yaml"
          TREE_FILE="baseline-folder-tree-${TAG_NAME}.md"
          CHECKSUM_FILE="checksums-${TAG_NAME}.sha256"
          TAG_MESSAGE_FILE="tag-message-${TAG_NAME}.txt"

          rm -rf "$PACKAGE_ROOT" "$ZIP_FILE"
          mkdir -p "$PACKAGE_ROOT"

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            mkdir -p "$PACKAGE_ROOT/$(dirname "$file")"
            cp -- "$file" "$PACKAGE_ROOT/$file"
          done < changed-hems-files.txt

          python3 - <<'PYTHON_SCRIPT'
          import hashlib
          import os
          import pathlib
          import subprocess
          import zipfile

          tag = os.environ["TAG_NAME"]
          before_sha = os.environ["BEFORE_SHA"]
          merge_sha = os.environ["MERGE_SHA"]
          repository = os.environ["REPOSITORY"]
          actor = os.environ["ACTOR"]

          package_root = pathlib.Path(f"merge-baseline-{tag}")
          zip_file = pathlib.Path(f"merge-baseline-{tag}.zip")
          manifest_file = pathlib.Path(f"baseline-manifest-{tag}.yaml")
          tree_file = pathlib.Path(f"baseline-folder-tree-{tag}.md")
          checksum_file = pathlib.Path(f"checksums-{tag}.sha256")
          tag_message_file = pathlib.Path(f"tag-message-{tag}.txt")

          files = [
              pathlib.Path(line.strip())
              for line in pathlib.Path("changed-hems-files.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          merge_message = pathlib.Path("merge-message.txt").read_text(encoding="utf-8").strip()

          modules = sorted({p.parts[4] for p in files if len(p.parts) >= 6})
          spec_packages = sorted({
              p.parts[5]
              for p in files
              if len(p.parts) >= 7 and p.parts[1] == "SPEC_HEMS"
          })
          code_packages = sorted({
              p.parts[5]
              for p in files
              if len(p.parts) >= 7 and p.parts[1] == "CODE_HEMS"
          })
          model_packages = sorted({
              p.parts[5]
              for p in files
              if len(p.parts) >= 7 and p.parts[1] == "MOD_HEMS"
          })

          def yaml_quote(value):
              value = str(value).replace("\\", "\\\\").replace('"', '\\"')
              return f'"{value}"'

          manifest_lines = [
              f"tag: {yaml_quote(tag)}",
              f"repository: {yaml_quote(repository)}",
              f"generated_by: {yaml_quote(actor)}",
              f"before_commit: {yaml_quote(before_sha)}",
              f"merge_commit: {yaml_quote(merge_sha)}",
              "merge_message: |",
          ]
          manifest_lines.extend(f"  {line}" for line in merge_message.splitlines())
          manifest_lines.append("modules:")
          manifest_lines.extend(f"  - {yaml_quote(value)}" for value in modules)
          manifest_lines.append("specifications:")
          manifest_lines.extend(f"  - {yaml_quote(value)}" for value in spec_packages)
          manifest_lines.append("code_packages:")
          manifest_lines.extend(f"  - {yaml_quote(value)}" for value in code_packages)
          manifest_lines.append("model_packages:")
          manifest_lines.extend(f"  - {yaml_quote(value)}" for value in model_packages)
          manifest_lines.append("released_files:")

          checksum_lines = []
          for path in files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              last_commit = subprocess.check_output(
                  ["git", "log", "-n", "1", "--format=%H", "--", str(path)],
                  text=True,
              ).strip() or "unknown"
              manifest_lines.extend([
                  f"  - path: {yaml_quote(path)}",
                  f"    sha256: {yaml_quote(digest)}",
                  f"    last_changed_commit: {yaml_quote(last_commit)}",
              ])
              checksum_lines.append(f"{digest}  {path}")

          manifest_file.write_text("\n".join(manifest_lines) + "\n", encoding="utf-8")
          checksum_file.write_text("\n".join(checksum_lines) + "\n", encoding="utf-8")

          tree = {}
          for path in files:
              current = tree
              for part in path.parts:
                  current = current.setdefault(part, {})

          def render_tree(node, prefix=""):
              lines = []
              entries = sorted(node.items())
              for index, (name, child) in enumerate(entries):
                  last = index == len(entries) - 1
                  lines.append(prefix + ("└── " if last else "├── ") + name)
                  if child:
                      lines.extend(render_tree(child, prefix + ("    " if last else "│   ")))
              return lines

          tree_lines = [
              f"# Merge Baseline Folder Structure: {tag}",
              "",
              "```text",
              *render_tree(tree),
              "```",
              "",
              f"Total released files: {len(files)}",
          ]
          tree_file.write_text("\n".join(tree_lines) + "\n", encoding="utf-8")

          def section(title, values):
              lines = [title]
              lines.extend(f"- {value}" for value in values)
              if not values:
                  lines.append("- None")
              return lines

          tag_lines = [
              "HEMS automatic merge baseline",
              "",
              "Original merge message:",
              merge_message,
              "",
              f"Repository: {repository}",
              f"Pre-merge commit: {before_sha}",
              f"Merge commit: {merge_sha}",
              "",
              *section("Modules included:", modules),
              "",
              *section("Specifications included:", spec_packages),
              "",
              *section("Code packages included:", code_packages),
              "",
              *section("Model packages included:", model_packages),
              "",
              *section("Files included:", [str(path) for path in files]),
              "",
              f"ZIP asset: {zip_file.name}",
          ]
          tag_message_file.write_text("\n".join(tag_lines) + "\n", encoding="utf-8")

          for metadata in (manifest_file, tree_file, checksum_file, tag_message_file):
              (package_root / metadata.name).write_bytes(metadata.read_bytes())

          with zipfile.ZipFile(zip_file, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(package_root.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.as_posix())

          print(f"Created {zip_file}")
          print(f"Modules: {len(modules)}")
          print(f"Specifications: {len(spec_packages)}")
          print(f"Files: {len(files)}")
          PYTHON_SCRIPT

          echo "Created baseline files:"
          ls -lh "$ZIP_FILE" "$MANIFEST_FILE" "$TREE_FILE" "$CHECKSUM_FILE" "$TAG_MESSAGE_FILE"

      - name: Create and push annotated Git tag
        if: steps.merge.outputs.create_baseline == 'true'
        shell: bash
        env:
          PUSH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.merge.outputs.tag_name }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          BASIC_AUTH="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          TAG_MESSAGE_FILE="tag-message-${TAG_NAME}.txt"

          git config --local http."${SERVER_URL}/".extraheader "AUTHORIZATION: basic ${BASIC_AUTH}"

          cleanup_credentials() {
            git config --local --unset-all http."${SERVER_URL}/".extraheader 2>/dev/null || true
          }
          trap cleanup_credentials EXIT

          git tag --annotate "$TAG_NAME" "$MERGE_SHA" --file "$TAG_MESSAGE_FILE"
          git push origin "refs/tags/$TAG_NAME"

          cleanup_credentials
          trap - EXIT

      - name: Create GitHub Release and attach baseline ZIP
        if: steps.merge.outputs.create_baseline == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: ${{ github.server_url }}
          TAG_NAME: ${{ steps.merge.outputs.tag_name }}
        run: |
          set -euo pipefail

          GH_HOST="${GH_HOST#https://}"
          GH_HOST="${GH_HOST#http://}"

          ZIP_FILE="merge-baseline-${TAG_NAME}.zip"
          MANIFEST_FILE="baseline-manifest-${TAG_NAME}.yaml"
          TREE_FILE="baseline-folder-tree-${TAG_NAME}.md"
          CHECKSUM_FILE="checksums-${TAG_NAME}.sha256"
          TAG_MESSAGE_FILE="tag-message-${TAG_NAME}.txt"

          if gh release view "$TAG_NAME" --hostname "$GH_HOST" >/dev/null 2>&1; then
            echo "::error::A GitHub Release already exists for tag: $TAG_NAME"
            exit 1
          fi

          gh release create "$TAG_NAME" \
            "$ZIP_FILE" \
            "$MANIFEST_FILE" \
            "$TREE_FILE" \
            "$CHECKSUM_FILE" \
            --hostname "$GH_HOST" \
            --title "HEMS Merge Baseline: $TAG_NAME" \
            --notes-file "$TAG_MESSAGE_FILE" \
            --verify-tag

          echo "Baseline release created successfully for tag: $TAG_NAME"
