name: Automatic Merge Baseline

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: automatic-merge-baseline-main
  cancel-in-progress: false

jobs:
  baseline:
    name: Create one annotated tag and baseline release
    runs-on: ubuntu-latest
    steps:
      - name: Verify runner tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in git python3 gh base64; do
            command -v "$tool" >/dev/null 2>&1 || { echo "::error::Missing tool: $tool"; exit 1; }
          done

      - name: Checkout main with Git
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          URL="${SERVER_URL}/${REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git init -b main .
          git remote add origin "$URL"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http."${SERVER_URL}/".extraheader "AUTHORIZATION: basic ${AUTH}"
          trap 'git config --unset-all http."${SERVER_URL}/".extraheader 2>/dev/null || true' EXIT
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git checkout --force --detach "$MERGE_SHA"
          if [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] && ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BEFORE_SHA"
          fi
          git config --unset-all http."${SERVER_URL}/".extraheader 2>/dev/null || true
          trap - EXIT

      - name: Determine baseline information
        id: info
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "create=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          PARENTS="$(git rev-list --parents -n 1 "$MERGE_SHA" | awk '{print NF-1}')"
          if [[ "$PARENTS" -lt 2 ]]; then
            echo "::notice::Not a standard merge commit. No baseline created."
            echo "create=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          SUBJECT="$(git log -1 --format=%s "$MERGE_SHA")"
          git log -1 --format=%B "$MERGE_SHA" > merge-message.txt
          TAG="$(SUBJECT="$SUBJECT" python3 - <<'PY'
          import os,re
          s=os.environ['SUBJECT'].strip()
          s=re.sub(r'\s+','-',s)
          s=re.sub(r'[~^:?*\[\]\\@{}]+','-',s)
          s=re.sub(r'-+','-',s.replace('..','-').replace('/','-')).strip('.-')
          if s.endswith('.lock'): s=s[:-5]
          print(s[:120])
          PY
          )"
          if [[ -z "$TAG" ]] || ! git check-ref-format "refs/tags/$TAG"; then TAG="merge-${MERGE_SHA:0:12}"; fi

          : > changed-hems-files.txt
          while IFS= read -r f; do
            case "$f" in
              HEMS/CODE_HEMS/*|HEMS/MOD_HEMS/*|HEMS/SPEC_HEMS/*) [[ -f "$f" ]] && printf '%s\n' "$f" >> changed-hems-files.txt ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR "$BEFORE_SHA" "$MERGE_SHA")
          sort -u changed-hems-files.txt -o changed-hems-files.txt
          if [[ ! -s changed-hems-files.txt ]]; then
            echo "::notice::No changed controlled HEMS files. No baseline created."
            echo "create=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "create=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "before=$BEFORE_SHA" >> "$GITHUB_OUTPUT"
          echo "merge=$MERGE_SHA" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG"
          cat changed-hems-files.txt

      - name: Build ZIP, manifest, tree, checksums, and tag details
        if: steps.info.outputs.create == 'true'
        shell: bash
        env:
          TAG: ${{ steps.info.outputs.tag }}
          BEFORE_SHA: ${{ steps.info.outputs.before }}
          MERGE_SHA: ${{ steps.info.outputs.merge }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, shutil, subprocess, zipfile
          tag=os.environ['TAG']; before=os.environ['BEFORE_SHA']; merge=os.environ['MERGE_SHA']; repo=os.environ['REPOSITORY']
          files=[pathlib.Path(x) for x in pathlib.Path('changed-hems-files.txt').read_text().splitlines() if x]
          message=pathlib.Path('merge-message.txt').read_text().strip()
          modules=sorted({p.parts[4] for p in files if len(p.parts)>4})
          specs=sorted({p.parts[5] for p in files if len(p.parts)>5 and p.parts[1]=='SPEC_HEMS'})
          codes=sorted({p.parts[5] for p in files if len(p.parts)>5 and p.parts[1]=='CODE_HEMS'})
          models=sorted({p.parts[5] for p in files if len(p.parts)>5 and p.parts[1]=='MOD_HEMS'})
          root=pathlib.Path(f'merge-baseline-{tag}'); shutil.rmtree(root,ignore_errors=True); root.mkdir()
          for p in files:
            d=root/p; d.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,d)
          q=lambda s:'"'+str(s).replace('\\','\\\\').replace('"','\\"')+'"'
          manifest=[f'tag: {q(tag)}',f'repository: {q(repo)}',f'before_commit: {q(before)}',f'merge_commit: {q(merge)}','modules:']
          manifest += [f'  - {q(x)}' for x in modules] or ['  []']
          manifest += ['specifications:']+[f'  - {q(x)}' for x in specs] or ['  []']
          manifest += ['released_files:']
          checks=[]
          for p in files:
            h=hashlib.sha256(p.read_bytes()).hexdigest(); checks.append(f'{h}  {p}')
            package=p.parts[5] if len(p.parts)>6 else 'not_applicable'
            manifest += [f'  - path: {q(p)}',f'    module: {q(p.parts[4])}',f'    package: {q(package)}',f'    sha256: {q(h)}']
          mp=pathlib.Path(f'baseline-manifest-{tag}.yaml'); mp.write_text('\n'.join(manifest)+'\n')
          cp=pathlib.Path(f'checksums-{tag}.sha256'); cp.write_text('\n'.join(checks)+'\n')
          tree={}
          for p in files:
            n=tree
            for x in p.parts:n=n.setdefault(x,{})
          def render(n,p=''):
            out=[]; a=sorted(n.items())
            for i,(k,v) in enumerate(a):
              last=i==len(a)-1; out.append(p+('└── ' if last else '├── ')+k)
              if v:out+=render(v,p+('    ' if last else '│   '))
            return out
          tp=pathlib.Path(f'baseline-folder-tree-{tag}.md'); tp.write_text(f'# HEMS Merge Baseline: {tag}\n\n```text\n'+'\n'.join(render(tree))+'\n```\n')
          def sec(title,vals):return [title]+([f'- {x}' for x in vals] or ['- None'])
          details=['HEMS automatic merge baseline','','Original merge message:',message,'',f'Repository: {repo}',f'Pre-merge commit: {before}',f'Merge commit: {merge}','']
          details+=sec('Modules included:',modules)+['']+sec('Specifications included:',specs)+['']+sec('Code packages included:',codes)+['']+sec('Model packages included:',models)+['']+sec('Files included:',[str(x) for x in files])
          dp=pathlib.Path(f'tag-message-{tag}.txt'); dp.write_text('\n'.join(details)+'\n')
          for p in (mp,cp,tp,dp):shutil.copy2(p,root/p.name)
          with zipfile.ZipFile(f'merge-baseline-{tag}.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in root.rglob('*'):
              if p.is_file():z.write(p,p.as_posix())
          PY

      - name: Create or reuse exactly one annotated tag
        if: steps.info.outputs.create == 'true'
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          TAG: ${{ steps.info.outputs.tag }}
          MERGE_SHA: ${{ steps.info.outputs.merge }}
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git config http."${SERVER_URL}/".extraheader "AUTHORIZATION: basic ${AUTH}"
          trap 'git config --unset-all http."${SERVER_URL}/".extraheader 2>/dev/null || true' EXIT
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            EXISTING="$(git rev-list -n 1 "$TAG")"
            if [[ "$EXISTING" != "$MERGE_SHA" ]]; then
              echo "::error::Tag '$TAG' already exists on different commit $EXISTING. No second tag will be created."
              exit 1
            fi
            echo "Reusing existing tag '$TAG' on this merge commit."
          else
            git tag -a "$TAG" "$MERGE_SHA" -F "tag-message-${TAG}.txt"
            git push origin "refs/tags/$TAG"
            echo "Created one annotated tag: $TAG"
          fi
          git config --unset-all http."${SERVER_URL}/".extraheader 2>/dev/null || true
          trap - EXIT

      - name: Create or reuse one GitHub Release
        if: steps.info.outputs.create == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: ${{ github.server_url }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          set -euo pipefail
          GH_HOST="${GH_HOST#https://}"; GH_HOST="${GH_HOST#http://}"
          export GH_HOST GH_REPO
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release '$TAG' already exists. No duplicate release created."
            exit 0
          fi
          gh release create "$TAG" \
            "merge-baseline-${TAG}.zip" \
            "baseline-manifest-${TAG}.yaml" \
            "baseline-folder-tree-${TAG}.md" \
            "checksums-${TAG}.sha256" \
            --title "HEMS Merge Baseline: $TAG" \
            --notes-file "tag-message-${TAG}.txt" \
            --verify-tag
