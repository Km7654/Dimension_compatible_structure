name: MATLAB Validation Evidence Check

on:
  pull_request:
    branches:
      - main
      - production
      - 'release/**'
  push:
    branches:
      - main
      - production
      - 'release/**'
      - 'test/**'
      - 'feature/**'
  workflow_dispatch:

jobs:
  matlab-validation-evidence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check MATLAB validation evidence
        shell: bash
        run: |
          set -euo pipefail

          HEMS_ROOT="HEMS"
          fail=0

          echo "Checking MATLAB validation evidence..."

          if [[ ! -d "$HEMS_ROOT/MOD_HEMS" ]]; then
            echo "No MOD_HEMS folder found. Skipping MATLAB evidence check."
            exit 0
          fi

          while IFS= read -r mod_dir; do
            echo "Checking module: $mod_dir"

            if ! find "$mod_dir/model" -type f -name "*.slx" 2>/dev/null | grep -q .; then
              echo "::error::$mod_dir must contain at least one Simulink model file under model/."
              fail=1
            fi

            if ! find "$mod_dir/reports" "$mod_dir/analysis" -type f \( -name "*.txt" -o -name "*.pdf" -o -name "*.xml" -o -name "*.html" \) 2>/dev/null | grep -q .; then
              echo "::error::$mod_dir must contain validation evidence under reports/ or analysis/."
              fail=1
            fi

          done < <(find "$HEMS_ROOT/MOD_HEMS" -mindepth 3 -maxdepth 3 -type d)

          if [[ "$fail" -ne 0 ]]; then
            echo "MATLAB validation evidence check failed."
            exit 1
          fi

          echo "MATLAB validation evidence check passed."
