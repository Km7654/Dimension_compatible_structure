name: Item Specification Versioning

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  item-spec-versioning:
    name: Update item version inside package manifest
    runs-on: ubuntu-latest

    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git user
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Update item version in package manifest
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          python3 <<'PYTHON_SCRIPT'
          import os
          import re
          import subprocess
          from pathlib import Path
          from datetime import datetime, timezone

          base_sha = os.environ["BASE_SHA"]
          merge_sha = os.environ["MERGE_SHA"]
          pr_number = os.environ["PR_NUMBER"]
          pr_title = os.environ["PR_TITLE"]
          source_branch = os.environ["SOURCE_BRANCH"]
          target_branch = os.environ["TARGET_BRANCH"]
          repository = os.environ["REPOSITORY"]
          updated_utc = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          manifest_by_area = {
              "CODE_HEMS": "code-manifest.yaml",
              "MOD_HEMS": "module-manifest.yaml",
              "SPEC_HEMS": "spec-manifest.yaml",
          }

          ignored_file_names = {
              "code-manifest.yaml",
              "module-manifest.yaml",
              "spec-manifest.yaml",
              "trace_links.csv",
              ".keep",
          }

          ignored_prefixes = (
              "HEMS/BASELINES/",
              "HEMS/INCOMING/",
              "HEMS/DELIVERY_REQUESTS/",
          )

          def run_git(command):
              return subprocess.check_output(command, text=True).strip()

          def safe_tag_component(value):
              return re.sub(r"[^A-Za-z0-9._-]+", "_", value)

          def yaml_quote(value):
              text = str(value).replace('"', "'")
              return f'"{text}"'

          def strip_old_item_version_sections(manifest_text):
              lines = manifest_text.splitlines()
              keep_lines = []

              for line in lines:
                  if line.startswith("item_version:"):
                      break
                  if line.startswith("item_version_history:"):
                      break
                  keep_lines.append(line)

              return "\n".join(keep_lines).rstrip() + "\n"

          def extract_top_level_section(manifest_text, section_name):
              lines = manifest_text.splitlines()
              start = None

              for index, line in enumerate(lines):
                  if line == f"{section_name}:":
                      start = index + 1
                      break

              if start is None:
                  return []

              section_lines = []
              for line in lines[start:]:
                  if line and not line.startswith(" "):
                      break
                  section_lines.append(line)

              return section_lines

          def parse_existing_item_version(manifest_text):
              section_lines = extract_top_level_section(manifest_text, "item_version")
              data = {}

              for line in section_lines:
                  match = re.match(r"\s+([A-Za-z0-9_]+):\s*(.*)\s*$", line)
                  if not match:
                      continue

                  key = match.group(1).strip()
                  value = match.group(2).strip().strip('"').strip("'")
                  data[key] = value

              return data

          def extract_existing_history_entries(manifest_text):
              section_lines = extract_top_level_section(manifest_text, "item_version_history")
              return [line for line in section_lines if line.strip()]

          def get_manifest_path(item_info):
              manifest_name = manifest_by_area[item_info["area"]]
              return (
                  Path("HEMS")
                  / item_info["area"]
                  / item_info["function"]
                  / item_info["sub_function"]
                  / item_info["item"]
                  / manifest_name
              )

          def build_basic_manifest(item_info, manifest_path):
              item_dir = manifest_path.parent
              direct_files = sorted(
                  file.name
                  for file in item_dir.iterdir()
                  if file.is_file() and file.name != manifest_path.name
              )

              manifest_type = {
                  "CODE_HEMS": "code",
                  "MOD_HEMS": "module",
                  "SPEC_HEMS": "specification",
              }[item_info["area"]]

              lines = [
                  f"module: {item_info['item']}",
                  f"type: {manifest_type}",
                  f"area: {item_info['area']}",
                  f"function: {item_info['function']}",
                  f"sub_function: {item_info['sub_function']}",
                  "version: not_released",
                  "delivery_cycle: not_released",
                  f"commit: {merge_sha}",
                  "generated_by: GitHub Actions",
                  f"generated_on: {updated_utc}",
                  "files:",
              ]

              for file_name in direct_files:
                  lines.append(f"  - {file_name}")

              return "\n".join(lines) + "\n"

          print(f"Base SHA: {base_sha}")
          print(f"Merge SHA: {merge_sha}")
          print(f"Pull Request: {pr_number}")

          changed_output = run_git([
              "git",
              "diff",
              "--name-only",
              "--diff-filter=ACMR",
              base_sha,
              merge_sha,
          ])

          changed_files = [
              line.strip()
              for line in changed_output.splitlines()
              if line.strip()
          ]

          print("Changed files:")
          for changed_file in changed_files:
              print(f" - {changed_file}")

          changed_items = {}

          for file_path in changed_files:
              if not file_path.startswith("HEMS/"):
                  continue

              if file_path.startswith(ignored_prefixes):
                  continue

              parts = file_path.split("/")

              # Expected controlled structure:
              # HEMS / AREA / Function / Sub-function / Item folder / File inside item folder
              if len(parts) != 6:
                  continue

              root, area, function_name, sub_function, item_folder, file_name = parts

              if root != "HEMS":
                  continue

              if area not in manifest_by_area:
                  continue

              if file_name in ignored_file_names:
                  continue

              item_key = "/".join(parts[:5])

              changed_items[item_key] = {
                  "area": area,
                  "function": function_name,
                  "sub_function": sub_function,
                  "item": item_folder,
                  "item_folder_path": item_key,
              }

          if not changed_items:
              print("No item folders requiring version updates were changed.")
              raise SystemExit(0)

          created_tags = []
          updated_manifests = []

          for item_folder_path, item_info in sorted(changed_items.items()):
              manifest_path = get_manifest_path(item_info)

              if manifest_path.is_file():
                  original_manifest = manifest_path.read_text(encoding="utf-8", errors="ignore")
              else:
                  original_manifest = build_basic_manifest(item_info, manifest_path)

              base_manifest = strip_old_item_version_sections(original_manifest)
              old_version_data = parse_existing_item_version(original_manifest)
              existing_history_lines = extract_existing_history_entries(original_manifest)

              old_version = int(old_version_data.get("version", "0") or "0")
              old_merge_sha = old_version_data.get("sha", "")

              if old_merge_sha == merge_sha:
                  print(f"Skipping duplicate version update for {item_folder_path}. Same merge SHA already recorded.")
                  updated_manifests.append(str(manifest_path))
                  continue

              new_version = old_version + 1

              tag_name = (
                  f"item/"
                  f"{item_info['area']}/"
                  f"{item_info['function']}/"
                  f"{item_info['sub_function']}/"
                  f"{safe_tag_component(item_info['item'])}/"
                  f"v{new_version}"
              )

              item_version_section = [
                  "item_version:",
                  f"  version: {new_version}",
                  f"  tag: {tag_name}",
                  f"  sha: {merge_sha}",
              ]

              new_history_entry = [
                  f"  - version: {new_version}",
                  f"    tag: {tag_name}",
                  f"    sha: {merge_sha}",
              ]

              history_lines = ["item_version_history:"]
              history_lines.extend(existing_history_lines)
              history_lines.extend(new_history_entry)

              final_manifest = (
                  base_manifest.rstrip()
                  + "\n\n"
                  + "\n".join(item_version_section)
                  + "\n\n"
                  + "\n".join(history_lines)
                  + "\n"
              )

              manifest_path.write_text(final_manifest, encoding="utf-8")
              updated_manifests.append(str(manifest_path))
              print(f"Updated manifest: {manifest_path}")
              print(f"Item folder: {item_folder_path}")
              print(f"New item version: {new_version}")
              print(f"Tag: {tag_name}")
              print(f"SHA: {merge_sha}")

              tag_exists = run_git(["git", "tag", "--list", tag_name])

              if tag_exists:
                  print(f"Tag already exists, skipping tag creation: {tag_name}")
              else:
                  subprocess.run([
                      "git",
                      "tag",
                      "-a",
                      tag_name,
                      "-m",
                      f"Item version {new_version} for {item_info['item']}",
                  ], check=True)
                  created_tags.append(tag_name)
                  print(f"Created tag: {tag_name}")

          print("Updated manifest files:")
          for manifest in updated_manifests:
              print(f" - {manifest}")

          if created_tags:
              print("Created tags:")
              for tag in created_tags:
                  print(f" - {tag}")
          else:
              print("No new tags were created.")
          PYTHON_SCRIPT

      - name: Commit updated package manifests
        shell: bash
        run: |
          set -euo pipefail

          git add HEMS/CODE_HEMS HEMS/MOD_HEMS HEMS/SPEC_HEMS

          if git diff --cached --quiet; then
            echo "No package manifest version changes to commit."
          else
            git commit -m "Update item versions in package manifests after PR #${{ github.event.pull_request.number }}"
            git push origin main
          fi

      - name: Push item version tags
        shell: bash
        run: |
          set -euo pipefail
          git push origin --tags
