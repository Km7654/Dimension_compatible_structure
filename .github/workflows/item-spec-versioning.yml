name: Module and Specification Versioning

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: module-specification-versioning-main
  cancel-in-progress: false

jobs:
  versioning:
    name: Version changed modules and specifications
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Verify runner tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in git python3 base64; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::Required runner tool is missing: $tool"
              exit 1
            fi
          done

      - name: Checkout latest main and fetch tags using Git
        shell: bash
        env:
          ACCESS_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          REPOSITORY_URL="${SERVER_URL}/${REPOSITORY}.git"
          AUTH_VALUE="$(printf 'x-access-token:%s' "$ACCESS_TOKEN" | base64 | tr -d '\n')"

          git init -b main .
          git remote add origin "$REPOSITORY_URL"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http."${SERVER_URL}/".extraheader "AUTHORIZATION: basic ${AUTH_VALUE}"

          cleanup_auth() {
            git config --unset-all http."${SERVER_URL}/".extraheader 2>/dev/null || true
          }
          trap cleanup_auth EXIT

          git fetch --prune origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/*:refs/tags/*"

          if ! git cat-file -e "${MERGE_SHA}^{commit}" 2>/dev/null; then
            git fetch origin "$MERGE_SHA"
          fi

          git checkout --force -B main refs/remotes/origin/main
          git clean -ffdx

          cleanup_auth
          trap - EXIT

      - name: Generate or update module and specification manifests
        id: versioning
        shell: bash
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          python3 <<'PYTHON_SCRIPT'
          import os
          import re
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          merge_sha = os.environ["MERGE_SHA"].strip()
          pr_number = os.environ["PR_NUMBER"].strip()
          pr_title = os.environ["PR_TITLE"].strip()
          source_branch = os.environ["SOURCE_BRANCH"].strip()
          target_branch = os.environ["TARGET_BRANCH"].strip()
          repository = os.environ["REPOSITORY"].strip()
          github_output = Path(os.environ["GITHUB_OUTPUT"])
          updated_utc = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          module_manifest_by_area = {
              "CODE_HEMS": "code-manifest.yaml",
              "MOD_HEMS": "module-manifest.yaml",
              "SPEC_HEMS": "spec-manifest.yaml",
          }
          module_type_by_area = {
              "CODE_HEMS": "code",
              "MOD_HEMS": "module",
              "SPEC_HEMS": "specification",
          }
          specification_areas = {"CODE_HEMS", "SPEC_HEMS"}
          generated_metadata = {
              "code-manifest.yaml",
              "module-manifest.yaml",
              "spec-manifest.yaml",
              "specification-manifest.yaml",
              "component-manifest.yaml",
              "trace_links.csv",
              ".keep",
          }

          updated_file = Path("updated-manifests.txt")
          tags_file = Path("created-version-tags.txt")

          def git(*args, check=True):
              result = subprocess.run(
                  ["git", *args], text=True,
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              )
              if check and result.returncode != 0:
                  print(result.stdout)
                  print(result.stderr)
                  raise RuntimeError(f"Git command failed: git {' '.join(args)}")
              return result.stdout.strip(), result.returncode

          def quote(value):
              value = str(value).replace("\\", "\\\\").replace('"', '\\"')
              return f'"{value}"'

          def safe_tag(value):
              value = re.sub(r"[^A-Za-z0-9._-]+", "_", value)
              return value.strip("._-") or "unnamed"

          def top_value(text, key):
              match = re.search(rf"^{re.escape(key)}:\s*(.*?)\s*$", text, re.MULTILINE)
              if not match:
                  return ""
              value = match.group(1).strip()
              if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                  value = value[1:-1]
              return value

          def section_value(text, section, key):
              lines = text.splitlines()
              try:
                  start = lines.index(f"{section}:") + 1
              except ValueError:
                  return ""
              for line in lines[start:]:
                  if line and not line.startswith((" ", "\t")):
                      break
                  match = re.match(rf"^\s+{re.escape(key)}:\s*(.*?)\s*$", line)
                  if match:
                      value = match.group(1).strip()
                      if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                          value = value[1:-1]
                      return value
              return ""

          def current_version(text):
              value = section_value(text, "item_version", "version") or top_value(text, "version")
              return int(value) if value.isdigit() else 0

          def current_merge(text):
              return section_value(text, "item_version", "sha") or top_value(text, "commit")

          def parse_history(text):
              lines = text.splitlines()
              start = None
              for marker in ("item_version_history:", "version_history:"):
                  if marker in lines:
                      start = lines.index(marker) + 1
                      break
              if start is None:
                  return []
              history, entry = [], None
              for line in lines[start:]:
                  if line and not line.startswith((" ", "\t")):
                      break
                  version_match = re.match(r"^\s+-\s+version:\s*(\d+)\s*$", line)
                  field_match = re.match(r"^\s+([A-Za-z0-9_]+):\s*(.*?)\s*$", line)
                  if version_match:
                      if entry:
                          history.append(entry)
                      entry = {"version": version_match.group(1)}
                  elif field_match and entry is not None:
                      value = field_match.group(2).strip().strip("\"'")
                      entry[field_match.group(1)] = value
              if entry:
                  history.append(entry)
              return history

          def content_files(directory):
              output = []
              for path in directory.rglob("*"):
                  if path.is_file() and path.name not in generated_metadata:
                      output.append(path.relative_to(directory).as_posix())
              return sorted(output)

          def extract_specification(area, module, package):
              prefix = f"a_{module}_"
              suffix = "_A" if area == "SPEC_HEMS" else "_A_RI_16_0(1.0)"
              if package.startswith(prefix) and package.endswith(suffix):
                  return package[len(prefix):-len(suffix)]
              return package

          if not merge_sha or merge_sha == "0" * 40:
              raise RuntimeError("Merge commit SHA is unavailable.")

          parents_text, _ = git("rev-list", "--parents", "-n", "1", merge_sha)
          parents = parents_text.split()
          if len(parents) < 3:
              raise RuntimeError("Use the standard 'Create a merge commit' merge method.")
          first_parent = parents[1]

          changed_text, _ = git(
              "diff", "--name-only", "--diff-filter=ACMR",
              first_parent, merge_sha,
          )
          changed_files = [line for line in changed_text.splitlines() if line]

          changed_modules = set()
          changed_specifications = set()

          for file_name in changed_files:
              parts = file_name.split("/")
              if len(parts) < 6 or parts[0] != "HEMS":
                  continue
              area, function_name, sub_function, module = parts[1:5]
              if area not in module_manifest_by_area:
                  continue
              if Path(file_name).name in generated_metadata:
                  print(f"Ignoring automation metadata: {file_name}")
                  continue

              changed_modules.add((area, function_name, sub_function, module))

              # A specification/code package file has this shape:
              # HEMS/AREA/Function/Sub-function/Module/Package/File
              if area in specification_areas and len(parts) >= 7:
                  changed_specifications.add(
                      (area, function_name, sub_function, module, parts[5])
                  )

          print(f"Changed modules: {len(changed_modules)}")
          print(f"Changed specification packages: {len(changed_specifications)}")
          for item in sorted(changed_specifications):
              print("Changed specification:", "/".join(item))

          updated_manifests = []
          created_tags = []

          def update_manifest(path, identity, tag_prefix):
              old_text = path.read_text(encoding="utf-8", errors="replace") if path.is_file() else ""
              if current_merge(old_text) == merge_sha:
                  print(f"Already processed for this merge: {path}")
                  return

              version = current_version(old_text) + 1
              tag_name = f"{tag_prefix}/v{version}"
              _, tag_status = git("show-ref", "--verify", "--quiet", f"refs/tags/{tag_name}", check=False)
              if tag_status == 0:
                  raise RuntimeError(f"Version tag already exists: {tag_name}")

              history = [h for h in parse_history(old_text)
                         if (h.get("sha") or h.get("commit")) != merge_sha]
              history.append({
                  "version": str(version),
                  "tag": tag_name,
                  "sha": merge_sha,
                  "pr": pr_number,
                  "updated_utc": updated_utc,
              })

              lines = [f"{key}: {quote(value)}" for key, value in identity.items()]
              lines.extend([
                  f"version: {version}",
                  'delivery_cycle: "not_released"',
                  f"tag: {quote(tag_name)}",
                  f"commit: {quote(merge_sha)}",
                  f"pull_request: {quote(pr_number)}",
                  f"updated_utc: {quote(updated_utc)}",
                  f"source_branch: {quote(source_branch)}",
                  f"target_branch: {quote(target_branch)}",
                  f"pull_request_title: {quote(pr_title)}",
                  'generated_by: "GitHub Actions"',
                  "automation_owned: true",
                  "main_branch_only: true",
                  "files:",
              ])
              files = content_files(path.parent)
              lines.extend([f"  - {quote(name)}" for name in files] or ["  []"])
              lines.extend([
                  "item_version:",
                  f"  version: {version}",
                  f"  tag: {quote(tag_name)}",
                  f"  sha: {quote(merge_sha)}",
                  f"  pr: {quote(pr_number)}",
                  f"  updated_utc: {quote(updated_utc)}",
                  "item_version_history:",
              ])
              for record in history:
                  lines.extend([
                      f"  - version: {record['version']}",
                      f"    tag: {quote(record.get('tag', 'not_available'))}",
                      f"    sha: {quote(record.get('sha') or record.get('commit', 'not_available'))}",
                      f"    pr: {quote(record.get('pr') or record.get('pull_request', 'not_available'))}",
                      f"    updated_utc: {quote(record.get('updated_utc', 'not_available'))}",
                  ])

              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")
              git(
                  "tag", "-a", tag_name, merge_sha, "-m",
                  f"{identity['manifest_level']} version {version}; PR #{pr_number}; merge {merge_sha}",
              )
              updated_manifests.append(path.as_posix())
              created_tags.append(tag_name)
              print(f"Updated {path} to version {version}")
              print(f"Prepared annotated tag {tag_name}")

          for area, function_name, sub_function, module in sorted(changed_modules):
              module_dir = Path("HEMS") / area / function_name / sub_function / module
              manifest_path = module_dir / module_manifest_by_area[area]
              identity = {
                  "manifest_level": "module",
                  "module": module,
                  "type": module_type_by_area[area],
                  "area": area,
                  "function": function_name,
                  "sub_function": sub_function,
              }
              tag_prefix = "/".join([
                  "module", safe_tag(area), safe_tag(function_name),
                  safe_tag(sub_function), safe_tag(module),
              ])
              update_manifest(manifest_path, identity, tag_prefix)

          for area, function_name, sub_function, module, package in sorted(changed_specifications):
              package_dir = Path("HEMS") / area / function_name / sub_function / module / package
              if not package_dir.is_dir():
                  print(f"Skipping missing package: {package_dir}")
                  continue
              specification = extract_specification(area, module, package)
              manifest_path = package_dir / "specification-manifest.yaml"
              identity = {
                  "manifest_level": "specification",
                  "specification": specification,
                  "package": package,
                  "type": "source_specification" if area == "SPEC_HEMS" else "generated_code_specification",
                  "area": area,
                  "function": function_name,
                  "sub_function": sub_function,
                  "module": module,
              }
              tag_prefix = "/".join([
                  "specification", safe_tag(area), safe_tag(function_name),
                  safe_tag(sub_function), safe_tag(module), safe_tag(specification),
              ])
              update_manifest(manifest_path, identity, tag_prefix)

          updated_file.write_text(
              "\n".join(updated_manifests) + ("\n" if updated_manifests else ""),
              encoding="utf-8",
          )
          tags_file.write_text(
              "\n".join(created_tags) + ("\n" if created_tags else ""),
              encoding="utf-8",
          )
          with github_output.open("a", encoding="utf-8") as output:
              output.write(f"changes_created={'true' if updated_manifests else 'false'}\n")
              output.write(f"tags_created={'true' if created_tags else 'false'}\n")

          print(f"Updated manifests: {len(updated_manifests)}")
          print(f"Prepared tags: {len(created_tags)}")
          PYTHON_SCRIPT

      - name: Review generated manifests
        if: steps.versioning.outputs.changes_created == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Generated or updated manifests:"
          cat updated-manifests.txt
          git diff -- HEMS/CODE_HEMS HEMS/MOD_HEMS HEMS/SPEC_HEMS

      - name: Commit manifests to main
        if: steps.versioning.outputs.changes_created == 'true'
        shell: bash
        env:
          ACCESS_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          while IFS= read -r manifest; do
            if [[ -z "$manifest" ]]; then
              continue
            fi
            if [[ ! -f "$manifest" ]]; then
              echo "::error::Generated manifest is missing: $manifest"
              exit 1
            fi
            git add -- "$manifest"
          done < updated-manifests.txt

          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git commit -m "Update module and specification versions after PR #${PR_NUMBER}"

          AUTH_VALUE="$(printf 'x-access-token:%s' "$ACCESS_TOKEN" | base64 | tr -d '\n')"
          git config http."${SERVER_URL}/".extraheader "AUTHORIZATION: basic ${AUTH_VALUE}"
          trap 'git config --unset-all http."${SERVER_URL}/".extraheader 2>/dev/null || true' EXIT

          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if [[ "$(git rev-parse refs/remotes/origin/main)" != "$MERGE_SHA" ]]; then
            echo "::error::main changed after this PR merge. Retry after reconciling current main."
            exit 1
          fi

          git push origin HEAD:main
          git config --unset-all http."${SERVER_URL}/".extraheader 2>/dev/null || true
          trap - EXIT

      - name: Push module and specification version tags
        if: steps.versioning.outputs.tags_created == 'true'
        shell: bash
        env:
          ACCESS_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          AUTH_VALUE="$(printf 'x-access-token:%s' "$ACCESS_TOKEN" | base64 | tr -d '\n')"
          git config http."${SERVER_URL}/".extraheader "AUTHORIZATION: basic ${AUTH_VALUE}"
          trap 'git config --unset-all http."${SERVER_URL}/".extraheader 2>/dev/null || true' EXIT

          while IFS= read -r tag_name; do
            if [[ -z "$tag_name" ]]; then
              continue
            fi
            echo "Pushing tag: $tag_name"
            git push origin "refs/tags/$tag_name"
          done < created-version-tags.txt

          git config --unset-all http."${SERVER_URL}/".extraheader 2>/dev/null || true
          trap - EXIT

      - name: Versioning summary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.versioning.outputs.changes_created }}" == "true" ]]; then
            echo "Module and specification manifests were updated on main."
            echo "Module and specification version tags were created."
          else
            echo "No applicable HEMS engineering files changed."
          fi
