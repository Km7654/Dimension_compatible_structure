name: Item, Module, and Specification Versioning

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: module-specification-versioning-main
  cancel-in-progress: false

jobs:
  versioning:
    name: Update main-only module and specification manifests
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Verify required runner tools
        shell: bash
        run: |
          set -euo pipefail

          for tool in git python3 base64; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::Required runner tool is missing: $tool"
              exit 1
            fi
          done

      - name: Checkout latest main using Git
        shell: bash
        env:
          ACCESS_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          REPOSITORY_URL="${SERVER_URL}/${REPOSITORY}.git"
          AUTH_VALUE="$(printf 'x-access-token:%s' "$ACCESS_TOKEN" | base64 | tr -d '\n')"

          git init -b main .
          git remote add origin "$REPOSITORY_URL"
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local http."${SERVER_URL}/".extraheader "AUTHORIZATION: basic ${AUTH_VALUE}"

          cleanup_auth() {
            git config --local --unset-all http."${SERVER_URL}/".extraheader 2>/dev/null || true
          }
          trap cleanup_auth EXIT

          git fetch --no-tags --prune origin \
            "+refs/heads/main:refs/remotes/origin/main"
          git checkout --force -B main refs/remotes/origin/main
          git clean -ffdx

          if ! git cat-file -e "${MERGE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$MERGE_SHA"
          fi

          cleanup_auth
          trap - EXIT

      - name: Update module and specification versions
        id: versioning
        shell: bash
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_OUTPUT_FILE: ${{ github.output }}
        run: |
          set -euo pipefail

          python3 <<'PYTHON_SCRIPT'
          import os
          import re
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          merge_sha = os.environ["MERGE_SHA"].strip()
          pr_number = os.environ["PR_NUMBER"].strip()
          pr_title = os.environ["PR_TITLE"].strip()
          source_branch = os.environ["SOURCE_BRANCH"].strip()
          target_branch = os.environ["TARGET_BRANCH"].strip()
          repository = os.environ["REPOSITORY"].strip()
          github_output = Path(os.environ["GITHUB_OUTPUT"])
          updated_utc = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          ZERO_SHA = "0" * 40
          CONTROLLED_AREAS = {"CODE_HEMS", "MOD_HEMS", "SPEC_HEMS"}
          MODULE_MANIFEST_BY_AREA = {
              "CODE_HEMS": "code-manifest.yaml",
              "MOD_HEMS": "module-manifest.yaml",
              "SPEC_HEMS": "spec-manifest.yaml",
          }
          MODULE_TYPE_BY_AREA = {
              "CODE_HEMS": "code",
              "MOD_HEMS": "module",
              "SPEC_HEMS": "specification",
          }
          SPECIFICATION_AREAS = {"CODE_HEMS", "SPEC_HEMS"}
          SPECIFICATION_MANIFEST = "specification-manifest.yaml"
          GENERATED_MANIFEST_NAMES = {
              "code-manifest.yaml",
              "module-manifest.yaml",
              "spec-manifest.yaml",
              "specification-manifest.yaml",
              "component-manifest.yaml",
          }
          IGNORED_METADATA_NAMES = GENERATED_MANIFEST_NAMES | {
              "trace_links.csv",
              ".keep",
          }

          updated_manifests_file = Path("updated-manifests.txt")
          created_tags_file = Path("created-version-tags.txt")

          def git(*args, allow_failure=False):
              result = subprocess.run(
                  ["git", *args], text=True,
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              )
              if result.returncode != 0 and not allow_failure:
                  print(result.stdout)
                  print(result.stderr)
                  raise RuntimeError(f"Git command failed: git {' '.join(args)}")
              return result.stdout.strip()

          def yaml_quote(value):
              value = str(value).replace("\\", "\\\\").replace('"', '\\"')
              return f'"{value}"'

          def safe_tag(value):
              value = re.sub(r"[^A-Za-z0-9._-]+", "_", value)
              return value.strip("._-") or "unnamed"

          def read_manifest(path):
              if not path.is_file():
                  return ""
              return path.read_text(encoding="utf-8", errors="replace")

          def scalar(text, key):
              match = re.search(
                  rf"^{re.escape(key)}:[ \t]*(.*?)[ \t]*$",
                  text, re.MULTILINE,
              )
              if not match:
                  return ""
              value = match.group(1).strip()
              if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                  value = value[1:-1]
              return value

          def nested_scalar(text, section, key):
              lines = text.splitlines()
              try:
                  start = lines.index(f"{section}:") + 1
              except ValueError:
                  return ""
              for line in lines[start:]:
                  if line and not line.startswith((" ", "\t")):
                      break
                  match = re.match(rf"^\s+{re.escape(key)}:\s*(.*?)\s*$", line)
                  if match:
                      value = match.group(1).strip()
                      if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                          value = value[1:-1]
                      return value
              return ""

          def existing_version(text):
              # Backward compatible with the old item_version section and
              # the newer top-level version field.
              value = nested_scalar(text, "item_version", "version") or scalar(text, "version")
              return int(value) if value.isdigit() else 0

          def existing_commit(text):
              # The old workflow stored the merge SHA as item_version.sha.
              return nested_scalar(text, "item_version", "sha") or scalar(text, "commit")

          def parse_history(text):
              # Preserve history created by both the old workflow
              # (item_version_history) and the extended workflow
              # (version_history).
              lines = text.splitlines()
              start = None
              for marker in ("item_version_history:", "version_history:"):
                  if marker in lines:
                      start = lines.index(marker) + 1
                      break
              if start is None:
                  return []
              entries = []
              current = None
              for line in lines[start:]:
                  if line and not line.startswith((" ", "\t")):
                      break
                  match_version = re.match(r"^\s+-\s+version:\s*(\d+)\s*$", line)
                  match_field = re.match(r"^\s+([A-Za-z0-9_]+):\s*(.*?)\s*$", line)
                  if match_version:
                      if current:
                          entries.append(current)
                      current = {"version": match_version.group(1)}
                  elif match_field and current is not None:
                      value = match_field.group(2)
                      if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                          value = value[1:-1]
                      current[match_field.group(1)] = value
              if current:
                  entries.append(current)
              return entries

          def list_content_files(directory, current_manifest_name):
              files = []
              for path in directory.rglob("*"):
                  if not path.is_file():
                      continue
                  if path.name in GENERATED_MANIFEST_NAMES:
                      continue
                  files.append(path.relative_to(directory).as_posix())
              return sorted(files)

          def render_manifest(identity, old_text, new_version, tag_name, directory, manifest_name):
              history = [entry for entry in parse_history(old_text)
                         if entry.get("commit") != merge_sha]
              history.append({
                  "version": str(new_version),
                  "tag": tag_name,
                  "commit": merge_sha,
                  "pull_request": pr_number,
                  "updated_utc": updated_utc,
              })
              lines = []
              for key, value in identity.items():
                  lines.append(f"{key}: {yaml_quote(value)}")
              lines.extend([
                  f"version: {new_version}",
                  "delivery_cycle: "not_released"",
                  f"tag: {yaml_quote(tag_name)}",
                  f"commit: {yaml_quote(merge_sha)}",
                  f"pull_request: {yaml_quote(pr_number)}",
                  f"updated_utc: {yaml_quote(updated_utc)}",
                  f"source_branch: {yaml_quote(source_branch)}",
                  f"target_branch: {yaml_quote(target_branch)}",
                  f"pull_request_title: {yaml_quote(pr_title)}",
                  "generated_by: \"GitHub Actions\"",
                  "automation_owned: true",
                  "main_branch_only: true",
                  "files:",
              ])
              content_files = list_content_files(directory, manifest_name)
              if content_files:
                  lines.extend(f"  - {yaml_quote(item)}" for item in content_files)
              else:
                  lines.append("  []")
              # Retain the old workflow's current-version fields so
              # existing consumers do not lose compatibility.
              lines.extend([
                  "item_version:",
                  f"  version: {new_version}",
                  f"  tag: {yaml_quote(tag_name)}",
                  f"  sha: {yaml_quote(merge_sha)}",
                  f"  pr: {yaml_quote(pr_number)}",
                  f"  updated_utc: {yaml_quote(updated_utc)}",
                  "item_version_history:",
              ])
              for entry in history:
                  lines.append(f"  - version: {entry['version']}")
                  field_aliases = (
                      ("tag", "tag"),
                      ("commit", "sha"),
                      ("sha", "sha"),
                      ("pull_request", "pr"),
                      ("pr", "pr"),
                      ("updated_utc", "updated_utc"),
                  )
                  written = set()
                  for source_field, output_field in field_aliases:
                      if output_field in written or not entry.get(source_field):
                          continue
                      lines.append(f"    {output_field}: {yaml_quote(entry[source_field])}")
                      written.add(output_field)
              return "\n".join(lines) + "\n"

          if not merge_sha or merge_sha == ZERO_SHA:
              raise RuntimeError("Pull-request merge commit SHA is unavailable.")
          git("cat-file", "-e", f"{merge_sha}^{{commit}}")

          parents = git("rev-list", "--parents", "-n", "1", merge_sha).split()
          if len(parents) < 3:
              raise RuntimeError(
                  "The merged PR did not produce a standard merge commit. "
                  "Use the 'Create a merge commit' merge method."
              )
          first_parent = parents[1]

          changed_output = git(
              "diff", "--name-only", "--diff-filter=ACMR",
              first_parent, merge_sha,
          )
          changed_files = [line for line in changed_output.splitlines() if line]

          changed_modules = {}
          changed_specifications = {}

          for file_name in changed_files:
              parts = file_name.split("/")
              if len(parts) < 6 or parts[0] != "HEMS":
                  continue
              area, function_name, sub_function, module = parts[1:5]
              if area not in CONTROLLED_AREAS:
                  continue
              if Path(file_name).name in IGNORED_METADATA_NAMES:
                  print(f"Ignoring automation metadata change: {file_name}")
                  continue

              module_key = (area, function_name, sub_function, module)
              changed_modules[module_key] = True

              # Package/specification-level content appears at depth 7 or more:
              # HEMS/AREA/Function/Sub-function/Module/Package/File
              if area in SPECIFICATION_AREAS and len(parts) >= 7:
                  package = parts[5]
                  spec_key = (area, function_name, sub_function, module, package)
                  changed_specifications[spec_key] = True

          print("============================================================")
          print("Main-only module and specification versioning")
          print("============================================================")
          print(f"Repository: {repository}")
          print(f"PR: #{pr_number} - {pr_title}")
          print(f"Merge commit: {merge_sha}")
          print(f"Changed modules: {len(changed_modules)}")
          print(f"Changed specifications: {len(changed_specifications)}")

          if not changed_modules:
              updated_manifests_file.write_text("", encoding="utf-8")
              created_tags_file.write_text("", encoding="utf-8")
              with github_output.open("a", encoding="utf-8") as output:
                  output.write("changes_created=false\n")
                  output.write("tags_created=false\n")
              raise SystemExit(0)

          updated_manifests = []
          created_tags = []

          def update_one_manifest(path, identity, tag_prefix):
              old_text = read_manifest(path)
              if existing_commit(old_text) == merge_sha:
                  print(f"Already versioned for this merge: {path}")
                  return
              version = existing_version(old_text) + 1
              tag_name = f"{tag_prefix}/v{version}"

              existing_remote_tag = git(
                  "ls-remote", "--tags", "origin", f"refs/tags/{tag_name}",
                  allow_failure=True,
              )
              if existing_remote_tag:
                  raise RuntimeError(
                      f"Version tag already exists and cannot be reused: {tag_name}"
                  )

              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                  render_manifest(
                      identity, old_text, version, tag_name,
                      path.parent, path.name,
                  ),
                  encoding="utf-8",
              )
              git(
                  "tag", "-a", tag_name, merge_sha, "-m",
                  f"{identity.get('manifest_level', 'version')} version {version}; "
                  f"PR #{pr_number}; merge {merge_sha}",
              )
              updated_manifests.append(path.as_posix())
              created_tags.append(tag_name)
              print(f"Updated: {path} -> version {version}")
              print(f"Created local tag: {tag_name}")

          for area, function_name, sub_function, module in sorted(changed_modules):
              directory = Path("HEMS") / area / function_name / sub_function / module
              manifest_name = MODULE_MANIFEST_BY_AREA[area]
              manifest_path = directory / manifest_name
              identity = {
                  "manifest_level": "module",
                  "module": module,
                  "type": MODULE_TYPE_BY_AREA[area],
                  "area": area,
                  "function": function_name,
                  "sub_function": sub_function,
              }
              prefix = "/".join([
                  "module", safe_tag(area), safe_tag(function_name),
                  safe_tag(sub_function), safe_tag(module),
              ])
              update_one_manifest(manifest_path, identity, prefix)

          for area, function_name, sub_function, module, package in sorted(changed_specifications):
              directory = (
                  Path("HEMS") / area / function_name /
                  sub_function / module / package
              )
              if not directory.is_dir():
                  print(f"Skipping missing specification package: {directory}")
                  continue

              if area == "SPEC_HEMS":
                  prefix = f"a_{module}_"
                  suffix = "_A"
              else:
                  prefix = f"a_{module}_"
                  suffix = "_A_RI_16_0(1.0)"
              specification = package
              if package.startswith(prefix) and package.endswith(suffix):
                  specification = package[len(prefix):-len(suffix)]

              manifest_path = directory / SPECIFICATION_MANIFEST
              identity = {
                  "manifest_level": "specification",
                  "specification": specification,
                  "package": package,
                  "type": "source_specification" if area == "SPEC_HEMS" else "generated_code_specification",
                  "area": area,
                  "function": function_name,
                  "sub_function": sub_function,
                  "module": module,
              }
              prefix_tag = "/".join([
                  "specification", safe_tag(area), safe_tag(function_name),
                  safe_tag(sub_function), safe_tag(module),
                  safe_tag(specification),
              ])
              update_one_manifest(manifest_path, identity, prefix_tag)

          updated_manifests_file.write_text(
              "\n".join(updated_manifests) + ("\n" if updated_manifests else ""),
              encoding="utf-8",
          )
          created_tags_file.write_text(
              "\n".join(created_tags) + ("\n" if created_tags else ""),
              encoding="utf-8",
          )
          with github_output.open("a", encoding="utf-8") as output:
              output.write(f"changes_created={'true' if updated_manifests else 'false'}\n")
              output.write(f"tags_created={'true' if created_tags else 'false'}\n")

          print("============================================================")
          print(f"Manifests updated: {len(updated_manifests)}")
          print(f"Version tags prepared: {len(created_tags)}")
          PYTHON_SCRIPT

      - name: Review generated main-only manifests
        if: steps.versioning.outputs.changes_created == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Automation-generated manifests:"
          cat updated-manifests.txt
          echo ""
          git diff -- HEMS/CODE_HEMS HEMS/MOD_HEMS HEMS/SPEC_HEMS

      - name: Commit manifests to main
        if: steps.versioning.outputs.changes_created == 'true'
        shell: bash
        env:
          ACCESS_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          while IFS= read -r manifest; do
            [[ -z "$manifest" ]] && continue
            if [[ ! -f "$manifest" ]]; then
              echo "::error::Generated manifest is missing: $manifest"
              exit 1
            fi
            git add -- "$manifest"
          done < updated-manifests.txt

          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git commit -m "Update module and specification versions after PR #${PR_NUMBER}"

          AUTH_VALUE="$(printf 'x-access-token:%s' "$ACCESS_TOKEN" | base64 | tr -d '\n')"
          git config --local http."${SERVER_URL}/".extraheader "AUTHORIZATION: basic ${AUTH_VALUE}"
          trap 'git config --local --unset-all http."${SERVER_URL}/".extraheader 2>/dev/null || true' EXIT

          # Protect against silently overwriting newer main-branch changes.
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if [[ "$(git rev-parse refs/remotes/origin/main)" != "$MERGE_SHA" ]]; then
            echo "::error::main moved after PR #${PR_NUMBER} was merged. Rerun after reconciling the latest main branch."
            exit 1
          fi

          git push origin HEAD:main
          git config --local --unset-all http."${SERVER_URL}/".extraheader 2>/dev/null || true
          trap - EXIT

      - name: Push module and specification version tags
        if: steps.versioning.outputs.tags_created == 'true'
        shell: bash
        env:
          ACCESS_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          AUTH_VALUE="$(printf 'x-access-token:%s' "$ACCESS_TOKEN" | base64 | tr -d '\n')"
          git config --local http."${SERVER_URL}/".extraheader "AUTHORIZATION: basic ${AUTH_VALUE}"
          trap 'git config --local --unset-all http."${SERVER_URL}/".extraheader 2>/dev/null || true' EXIT

          while IFS= read -r tag_name; do
            [[ -z "$tag_name" ]] && continue
            echo "Pushing version tag: $tag_name"
            git push origin "refs/tags/$tag_name"
          done < created-version-tags.txt

          git config --local --unset-all http."${SERVER_URL}/".extraheader 2>/dev/null || true
          trap - EXIT

      - name: Versioning summary
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.versioning.outputs.changes_created }}" == "true" ]]; then
            echo "Module and specification versioning completed successfully."
            echo "The generated manifests were committed only to main."
          else
            echo "No applicable HEMS engineering-content changes were detected."
          fi
