name: Item Specification Versioning

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  item-spec-versioning:
    name: Update changed HEMS item versions
    runs-on: ubuntu-latest

    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure Git user
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Update changed item versions
        id: versioning
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          python3 <<'PYTHON_SCRIPT'
          import os
          import re
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path


          base_sha = os.environ["BASE_SHA"].strip()
          merge_sha = os.environ["MERGE_SHA"].strip()
          pr_number = os.environ["PR_NUMBER"].strip()
          pr_title = os.environ["PR_TITLE"].strip()
          source_branch = os.environ["SOURCE_BRANCH"].strip()
          target_branch = os.environ["TARGET_BRANCH"].strip()
          repository = os.environ["REPOSITORY"].strip()

          updated_utc = datetime.now(timezone.utc).strftime(
              "%Y-%m-%dT%H:%M:%SZ"
          )


          MANIFEST_BY_AREA = {
              "CODE_HEMS": "code-manifest.yaml",
              "MOD_HEMS": "module-manifest.yaml",
              "SPEC_HEMS": "spec-manifest.yaml",
          }

          MANIFEST_TYPE_BY_AREA = {
              "CODE_HEMS": "code",
              "MOD_HEMS": "module",
              "SPEC_HEMS": "specification",
          }

          IGNORED_FILE_NAMES = {
              "code-manifest.yaml",
              "module-manifest.yaml",
              "spec-manifest.yaml",
              "component-manifest.yaml",
              "trace_links.csv",
              ".keep",
          }

          IGNORED_PREFIXES = (
              "HEMS/BASELINES/",
              "HEMS/INCOMING/",
              "HEMS/DELIVERY_REQUESTS/",
          )

          ZERO_SHA = "0000000000000000000000000000000000000000"

          UPDATED_MANIFESTS_FILE = Path("updated-item-manifests.txt")
          CREATED_TAGS_FILE = Path("created-item-tags.txt")


          def run_git(command, allow_failure=False):
              result = subprocess.run(
                  command,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )

              if result.returncode != 0 and not allow_failure:
                  print(result.stdout)
                  print(result.stderr)
                  raise subprocess.CalledProcessError(
                      result.returncode,
                      command,
                      output=result.stdout,
                      stderr=result.stderr,
                  )

              return result.stdout.strip()


          def safe_tag_component(value):
              return re.sub(r"[^A-Za-z0-9._-]+", "_", value)


          def yaml_quote(value):
              escaped_value = str(value).replace("\\", "\\\\")
              escaped_value = escaped_value.replace('"', '\\"')
              return f'"{escaped_value}"'


          def get_top_level_value(manifest_text, field_name):
              pattern = re.compile(
                  rf"^{re.escape(field_name)}:[ \t]*(.*?)[ \t]*$",
                  re.MULTILINE,
              )

              match = pattern.search(manifest_text)

              if not match:
                  return ""

              value = match.group(1).strip()

              if (
                  len(value) >= 2
                  and value[0] == value[-1]
                  and value[0] in {"'", '"'}
              ):
                  value = value[1:-1]

              return value.strip()


          def set_top_level_value(manifest_text, field_name, value):
              replacement = f"{field_name}: {value}"

              pattern = re.compile(
                  rf"^{re.escape(field_name)}:[^\r\n]*$",
                  re.MULTILINE,
              )

              if pattern.search(manifest_text):
                  return pattern.sub(
                      lambda _: replacement,
                      manifest_text,
                      count=1,
                  )

              lines = manifest_text.splitlines()

              insert_after_fields = {
                  "module",
                  "type",
                  "area",
                  "function",
                  "sub_function",
              }

              insert_index = 0

              for index, line in enumerate(lines):
                  if not line or line.startswith((" ", "\t")):
                      continue

                  field = line.split(":", 1)[0].strip()

                  if field in insert_after_fields:
                      insert_index = index + 1

              lines.insert(insert_index, replacement)

              return "\n".join(lines) + "\n"


          def extract_top_level_section(manifest_text, section_name):
              lines = manifest_text.splitlines()
              section_start = None

              for index, line in enumerate(lines):
                  if line.strip() == f"{section_name}:" and not line.startswith(
                      (" ", "\t")
                  ):
                      section_start = index + 1
                      break

              if section_start is None:
                  return []

              section_lines = []

              for line in lines[section_start:]:
                  if line and not line.startswith((" ", "\t")):
                      break

                  section_lines.append(line)

              return section_lines


          def parse_existing_item_version(manifest_text):
              section_lines = extract_top_level_section(
                  manifest_text,
                  "item_version",
              )

              version_data = {}

              for line in section_lines:
                  match = re.match(
                      r"^[ \t]+([A-Za-z0-9_]+):[ \t]*(.*?)[ \t]*$",
                      line,
                  )

                  if not match:
                      continue

                  key = match.group(1).strip()
                  value = match.group(2).strip()

                  if (
                      len(value) >= 2
                      and value[0] == value[-1]
                      and value[0] in {"'", '"'}
                  ):
                      value = value[1:-1]

                  version_data[key] = value

              return version_data


          def remove_generated_version_sections(manifest_text):
              generated_sections = {
                  "item_version",
                  "item_version_history",
              }

              lines = manifest_text.splitlines()
              retained_lines = []

              index = 0

              while index < len(lines):
                  current_line = lines[index]

                  if current_line and not current_line.startswith(
                      (" ", "\t")
                  ):
                      field_name = current_line.split(":", 1)[0].strip()

                      if (
                          field_name in generated_sections
                          and current_line.strip()
                          == f"{field_name}:"
                      ):
                          index += 1

                          while index < len(lines):
                              following_line = lines[index]

                              if (
                                  following_line
                                  and not following_line.startswith(
                                      (" ", "\t")
                                  )
                              ):
                                  break

                              index += 1

                          continue

                  retained_lines.append(current_line)
                  index += 1

              return "\n".join(retained_lines).rstrip() + "\n"


          def parse_existing_history(manifest_text):
              section_lines = extract_top_level_section(
                  manifest_text,
                  "item_version_history",
              )

              entries = []
              current_entry = None

              for line in section_lines:
                  version_match = re.match(
                      r"^[ \t]+-[ \t]+version:[ \t]*(.+?)[ \t]*$",
                      line,
                  )

                  field_match = re.match(
                      r"^[ \t]+([A-Za-z0-9_]+):[ \t]*(.*?)[ \t]*$",
                      line,
                  )

                  if version_match:
                      if current_entry:
                          entries.append(current_entry)

                      current_entry = {
                          "version": version_match.group(1).strip()
                      }

                      continue

                  if field_match and current_entry is not None:
                      key = field_match.group(1).strip()
                      value = field_match.group(2).strip()

                      if (
                          len(value) >= 2
                          and value[0] == value[-1]
                          and value[0] in {"'", '"'}
                      ):
                          value = value[1:-1]

                      current_entry[key] = value

              if current_entry:
                  entries.append(current_entry)

              return entries


          def get_manifest_path(item_info):
              manifest_name = MANIFEST_BY_AREA[item_info["area"]]

              return (
                  Path("HEMS")
                  / item_info["area"]
                  / item_info["function"]
                  / item_info["sub_function"]
                  / item_info["item"]
                  / manifest_name
              )


          def collect_nested_manifest_files(item_directory, manifest_name):
              collected_files = []

              for file_path in item_directory.rglob("*"):
                  if not file_path.is_file():
                      continue

                  if file_path.name == manifest_name:
                      continue

                  relative_path = file_path.relative_to(item_directory)
                  collected_files.append(relative_path.as_posix())

              return sorted(collected_files)


          def build_basic_manifest(item_info, manifest_path):
              item_directory = manifest_path.parent
              item_directory.mkdir(parents=True, exist_ok=True)

              manifest_type = MANIFEST_TYPE_BY_AREA[item_info["area"]]

              files = collect_nested_manifest_files(
                  item_directory,
                  manifest_path.name,
              )

              lines = [
                  f"module: {item_info['item']}",
                  f"type: {manifest_type}",
                  f"area: {item_info['area']}",
                  f"function: {item_info['function']}",
                  f"sub_function: {item_info['sub_function']}",
                  "version: not_released",
                  "delivery_cycle: not_released",
                  "commit: not_released",
                  "generated_by: GitHub Actions",
                  f"generated_on: {updated_utc}",
                  "structure_type: nested_generated_packages",
                  "files:",
              ]

              for relative_file in files:
                  lines.append(f"  - {relative_file}")

              return "\n".join(lines) + "\n"


          def determine_old_version(manifest_text):
              item_version_data = parse_existing_item_version(manifest_text)

              item_version_value = item_version_data.get(
                  "version",
                  "",
              ).strip()

              if item_version_value.isdigit():
                  return int(item_version_value)

              top_level_version = get_top_level_value(
                  manifest_text,
                  "version",
              )

              if top_level_version.isdigit():
                  return int(top_level_version)

              return 0


          def get_previous_merge_sha(manifest_text):
              item_version_data = parse_existing_item_version(manifest_text)

              item_version_sha = item_version_data.get("sha", "").strip()

              if item_version_sha:
                  return item_version_sha

              top_level_commit = get_top_level_value(
                  manifest_text,
                  "commit",
              )

              if top_level_commit in {
                  "",
                  "not_released",
                  "placeholder",
              }:
                  return ""

              return top_level_commit


          def build_version_sections(
              old_history,
              new_version,
              tag_name,
              current_merge_sha,
          ):
              current_version_lines = [
                  "item_version:",
                  f"  version: {new_version}",
                  f"  tag: {tag_name}",
                  f"  sha: {current_merge_sha}",
                  f"  pr: {pr_number}",
                  f"  updated_utc: {yaml_quote(updated_utc)}",
              ]

              history_lines = ["item_version_history:"]

              for history_entry in old_history:
                  history_version = history_entry.get("version", "")

                  if not history_version:
                      continue

                  history_lines.append(
                      f"  - version: {history_version}"
                  )

                  optional_fields = (
                      "tag",
                      "sha",
                      "pr",
                      "updated_utc",
                  )

                  for field_name in optional_fields:
                      field_value = history_entry.get(
                          field_name,
                          "",
                      )

                      if not field_value:
                          continue

                      if field_name == "updated_utc":
                          history_lines.append(
                              f"    {field_name}: "
                              f"{yaml_quote(field_value)}"
                          )
                      else:
                          history_lines.append(
                              f"    {field_name}: {field_value}"
                          )

              history_lines.extend([
                  f"  - version: {new_version}",
                  f"    tag: {tag_name}",
                  f"    sha: {current_merge_sha}",
                  f"    pr: {pr_number}",
                  f"    updated_utc: {yaml_quote(updated_utc)}",
              ])

              return current_version_lines, history_lines


          print("============================================================")
          print("Item Specification Versioning")
          print("============================================================")
          print()
          print(f"Repository: {repository}")
          print(f"Pull request: #{pr_number}")
          print(f"Pull request title: {pr_title}")
          print(f"Source branch: {source_branch}")
          print(f"Target branch: {target_branch}")
          print(f"Base SHA: {base_sha}")
          print(f"Merge SHA: {merge_sha}")
          print()

          if not merge_sha or merge_sha == ZERO_SHA:
              raise RuntimeError(
                  "The pull request merge commit SHA is unavailable."
              )

          run_git([
              "git",
              "cat-file",
              "-e",
              f"{merge_sha}^{{commit}}",
          ])

          if (
              not base_sha
              or base_sha == ZERO_SHA
              or not run_git(
                  [
                      "git",
                      "cat-file",
                      "-e",
                      f"{base_sha}^{{commit}}",
                  ],
                  allow_failure=True,
              )
              == ""
          ):
              print(
                  "Warning: the PR base SHA could not be verified locally."
              )

          changed_output = run_git([
              "git",
              "diff",
              "--name-only",
              "--diff-filter=ACMR",
              base_sha,
              merge_sha,
          ])

          changed_files = [
              line.strip()
              for line in changed_output.splitlines()
              if line.strip()
          ]

          print("Changed files:")

          if changed_files:
              for changed_file in changed_files:
                  print(f" - {changed_file}")
          else:
              print(" - No changed files found.")

          print()

          changed_items = {}

          for file_path in changed_files:
              if not file_path.startswith("HEMS/"):
                  continue

              if file_path.startswith(IGNORED_PREFIXES):
                  print(f"Skipping support path: {file_path}")
                  continue

              parts = file_path.split("/")

              # Supported item-level path:
              #
              # HEMS / AREA / Function / Sub-function / Item / File
              #
              # Supported nested package path:
              #
              # HEMS / AREA / Function / Sub-function / Item /
              # PackageFolder / File
              if len(parts) not in {6, 7}:
                  print(
                      "Skipping unsupported HEMS path depth: "
                      f"{file_path}"
                  )
                  continue

              root = parts[0]
              area = parts[1]
              function_name = parts[2]
              sub_function = parts[3]
              item_folder = parts[4]
              changed_file_name = parts[-1]

              if root != "HEMS":
                  continue

              if area not in MANIFEST_BY_AREA:
                  continue

              if changed_file_name in IGNORED_FILE_NAMES:
                  print(
                      "Skipping metadata-only change: "
                      f"{file_path}"
                  )
                  continue

              item_key = "/".join(parts[:5])

              changed_items[item_key] = {
                  "area": area,
                  "function": function_name,
                  "sub_function": sub_function,
                  "item": item_folder,
                  "item_folder_path": item_key,
              }

          if not changed_items:
              print(
                  "No HEMS item content changes requiring version "
                  "updates were detected."
              )

              UPDATED_MANIFESTS_FILE.write_text(
                  "",
                  encoding="utf-8",
              )

              CREATED_TAGS_FILE.write_text(
                  "",
                  encoding="utf-8",
              )

              with Path(os.environ["GITHUB_OUTPUT"]).open(
                  "a",
                  encoding="utf-8",
              ) as output_file:
                  output_file.write("changes_created=false\n")
                  output_file.write("tags_created=false\n")

              raise SystemExit(0)

          print("Changed items:")
          for item_key in sorted(changed_items):
              print(f" - {item_key}")
          print()

          created_tags = []
          updated_manifests = []

          for item_folder_path, item_info in sorted(
              changed_items.items()
          ):
              manifest_path = get_manifest_path(item_info)

              print("------------------------------------------------------------")
              print(f"Processing item: {item_folder_path}")
              print(f"Manifest: {manifest_path}")

              if manifest_path.is_file():
                  original_manifest = manifest_path.read_text(
                      encoding="utf-8",
                      errors="ignore",
                  )
              else:
                  print(
                      "Manifest does not exist. Creating a basic nested "
                      "structure manifest."
                  )

                  original_manifest = build_basic_manifest(
                      item_info,
                      manifest_path,
                  )

              old_version = determine_old_version(original_manifest)

              previous_merge_sha = get_previous_merge_sha(
                  original_manifest
              )

              if previous_merge_sha == merge_sha:
                  print(
                      "Skipping duplicate version update. "
                      "This merge SHA is already recorded."
                  )
                  continue

              new_version = old_version + 1

              tag_name = (
                  "item/"
                  f"{safe_tag_component(item_info['area'])}/"
                  f"{safe_tag_component(item_info['function'])}/"
                  f"{safe_tag_component(item_info['sub_function'])}/"
                  f"{safe_tag_component(item_info['item'])}/"
                  f"v{new_version}"
              )

              existing_history = parse_existing_history(
                  original_manifest
              )

              existing_history = [
                  history_entry
                  for history_entry in existing_history
                  if history_entry.get("sha", "") != merge_sha
              ]

              manifest_without_generated_sections = (
                  remove_generated_version_sections(
                      original_manifest
                  )
              )

              manifest_without_generated_sections = (
                  set_top_level_value(
                      manifest_without_generated_sections,
                      "version",
                      str(new_version),
                  )
              )

              manifest_without_generated_sections = (
                  set_top_level_value(
                      manifest_without_generated_sections,
                      "commit",
                      merge_sha,
                  )
              )

              manifest_without_generated_sections = (
                  set_top_level_value(
                      manifest_without_generated_sections,
                      "generated_by",
                      "GitHub Actions",
                  )
              )

              manifest_without_generated_sections = (
                  set_top_level_value(
                      manifest_without_generated_sections,
                      "generated_on",
                      updated_utc,
                  )
              )

              current_version_lines, history_lines = (
                  build_version_sections(
                      existing_history,
                      new_version,
                      tag_name,
                      merge_sha,
                  )
              )

              final_manifest = (
                  manifest_without_generated_sections.rstrip()
                  + "\n\n"
                  + "\n".join(current_version_lines)
                  + "\n\n"
                  + "\n".join(history_lines)
                  + "\n"
              )

              manifest_path.write_text(
                  final_manifest,
                  encoding="utf-8",
              )

              updated_manifests.append(str(manifest_path))

              print(f"Previous item version: {old_version}")
              print(f"New item version: {new_version}")
              print(f"Tag: {tag_name}")
              print(f"Merge SHA: {merge_sha}")

              existing_tag = run_git([
                  "git",
                  "tag",
                  "--list",
                  tag_name,
              ])

              if existing_tag:
                  print(
                      "Tag already exists. Tag creation skipped: "
                      f"{tag_name}"
                  )
              else:
                  subprocess.run(
                      [
                          "git",
                          "tag",
                          "-a",
                          tag_name,
                          merge_sha,
                          "-m",
                          (
                              f"Item version {new_version} for "
                              f"{item_info['item']} after PR "
                              f"#{pr_number}"
                          ),
                      ],
                      check=True,
                  )

                  created_tags.append(tag_name)
                  print(f"Created annotated tag: {tag_name}")

          UPDATED_MANIFESTS_FILE.write_text(
              (
                  "\n".join(updated_manifests) + "\n"
                  if updated_manifests
                  else ""
              ),
              encoding="utf-8",
          )

          CREATED_TAGS_FILE.write_text(
              (
                  "\n".join(created_tags) + "\n"
                  if created_tags
                  else ""
              ),
              encoding="utf-8",
          )

          print()
          print("============================================================")
          print("Versioning summary")
          print("============================================================")
          print(f"Changed items detected: {len(changed_items)}")
          print(f"Manifests updated: {len(updated_manifests)}")
          print(f"Tags created: {len(created_tags)}")

          if updated_manifests:
              print()
              print("Updated manifests:")
              for updated_manifest in updated_manifests:
                  print(f" - {updated_manifest}")

          if created_tags:
              print()
              print("Created tags:")
              for created_tag in created_tags:
                  print(f" - {created_tag}")

          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a",
              encoding="utf-8",
          ) as output_file:
              output_file.write(
                  f"changes_created="
                  f"{'true' if updated_manifests else 'false'}\n"
              )

              output_file.write(
                  f"tags_created="
                  f"{'true' if created_tags else 'false'}\n"
              )
          PYTHON_SCRIPT

      - name: Review updated manifests
        if: steps.versioning.outputs.changes_created == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Updated manifest files:"

          while IFS= read -r manifest; do
            [[ -z "$manifest" ]] && continue
            echo " - $manifest"
          done < updated-item-manifests.txt

          echo ""
          echo "Git diff:"
          git diff -- HEMS/CODE_HEMS HEMS/MOD_HEMS HEMS/SPEC_HEMS

      - name: Commit updated item manifests
        if: steps.versioning.outputs.changes_created == 'true'
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r manifest; do
            [[ -z "$manifest" ]] && continue

            if [[ ! -f "$manifest" ]]; then
              echo "::error::Updated manifest does not exist: $manifest"
              exit 1
            fi

            git add -- "$manifest"
          done < updated-item-manifests.txt

          if git diff --cached --quiet; then
            echo "No item manifest version changes to commit."
            exit 0
          fi

          git commit \
            -m "Update item versions after PR #${{ github.event.pull_request.number }}"

          git push origin HEAD:main

      - name: Push created item version tags
        if: steps.versioning.outputs.tags_created == 'true'
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r tag_name; do
            [[ -z "$tag_name" ]] && continue

            echo "Pushing tag: $tag_name"
            git push origin "refs/tags/$tag_name"
          done < created-item-tags.txt

      - name: Versioning completed
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.versioning.outputs.changes_created }}" == "true" ]]; then
            echo "Item specification versioning completed successfully."
          else
            echo "No applicable HEMS item content changes were detected."
          fi