name: Release Baseline

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, example: v1.0.0"
        required: true
        type: string
      delivery_cycle:
        description: "Delivery cycle, example: MD31_01"
        required: true
        default: "MD31_01"
        type: string

permissions:
  contents: write

jobs:
  release-baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install required tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Configure Git user
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Validate release version does not already exist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"

          echo "Checking whether tag already exists: $VERSION"

          git fetch --tags

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "ERROR: Tag $VERSION already exists."
            echo "Use a new version number, for example v1.0.1."
            exit 1
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "ERROR: GitHub Release $VERSION already exists."
            echo "Use a new version number."
            exit 1
          fi

      - name: Generate code, module, and specification manifests
        shell: bash
        run: |
          set -euo pipefail

          HEMS_ROOT="HEMS"
          VERSION="${{ inputs.version }}"
          DELIVERY_CYCLE="${{ inputs.delivery_cycle }}"
          COMMIT_ID="${{ github.sha }}"

          echo "Generating package manifests for version: $VERSION"

          generate_manifest() {
            local module_dir="$1"
            local manifest_file="$2"
            local area="$3"
            local type="$4"

            local module
            local sub_function
            local function_name

            module="$(basename "$module_dir")"
            sub_function="$(basename "$(dirname "$module_dir")")"
            function_name="$(basename "$(dirname "$(dirname "$module_dir")")")"

            {
              echo "module: $module"
              echo "type: $type"
              echo "area: $area"
              echo "function: $function_name"
              echo "sub_function: $sub_function"
              echo "version: $VERSION"
              echo "delivery_cycle: $DELIVERY_CYCLE"
              echo "commit: $COMMIT_ID"
              echo "generated_by: GitHub Actions"
              echo "generated_on: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
              echo "files:"
            } > "$manifest_file"

            find "$module_dir" -type f ! -name "$(basename "$manifest_file")" | sort | while read -r file; do
              relative_file="${file#"$module_dir/"}"
              echo "  - $relative_file" >> "$manifest_file"
            done
          }

          if [[ -d "$HEMS_ROOT/CODE_HEMS" ]]; then
            while IFS= read -r dir; do
              generate_manifest "$dir" "$dir/code-manifest.yaml" "CODE_HEMS" "code"
            done < <(find "$HEMS_ROOT/CODE_HEMS" -mindepth 3 -maxdepth 3 -type d | sort)
          else
            echo "WARNING: $HEMS_ROOT/CODE_HEMS not found."
          fi

          if [[ -d "$HEMS_ROOT/MOD_HEMS" ]]; then
            while IFS= read -r dir; do
              generate_manifest "$dir" "$dir/module-manifest.yaml" "MOD_HEMS" "module"
            done < <(find "$HEMS_ROOT/MOD_HEMS" -mindepth 3 -maxdepth 3 -type d | sort)
          else
            echo "WARNING: $HEMS_ROOT/MOD_HEMS not found."
          fi

          if [[ -d "$HEMS_ROOT/SPEC_HEMS" ]]; then
            while IFS= read -r dir; do
              generate_manifest "$dir" "$dir/spec-manifest.yaml" "SPEC_HEMS" "specification"
            done < <(find "$HEMS_ROOT/SPEC_HEMS" -mindepth 3 -maxdepth 3 -type d | sort)
          else
            echo "WARNING: $HEMS_ROOT/SPEC_HEMS not found."
          fi

      - name: Generate baseline manifest with released files and versions
        shell: bash
        run: |
          set -euo pipefail

          HEMS_ROOT="HEMS"
          VERSION="${{ inputs.version }}"
          DELIVERY_CYCLE="${{ inputs.delivery_cycle }}"
          BASELINE_DIR="$HEMS_ROOT/BASELINES/$VERSION"
          BASELINE_MANIFEST="$BASELINE_DIR/baseline-manifest.yaml"

          mkdir -p "$BASELINE_DIR"

          echo "Generating baseline manifest for release: $VERSION"

          {
            echo "baseline: $VERSION"
            echo "delivery_cycle: $DELIVERY_CYCLE"
            echo "release_commit: ${{ github.sha }}"
            echo "branch: ${{ github.ref_name }}"
            echo "generated_by: GitHub Actions"
            echo "generated_on: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo ""
            echo "released_files:"
          } > "$BASELINE_MANIFEST"

          find "$HEMS_ROOT/CODE_HEMS" "$HEMS_ROOT/MOD_HEMS" "$HEMS_ROOT/SPEC_HEMS" -type f 2>/dev/null | sort | while read -r file; do
            IFS='/' read -r -a parts <<< "$file"

            area="${parts-unknown}"
            function_name="${parts-unknown}"
            sub_function="${parts-unknown}"
            module="${parts-unknown}"

            file_hash="$(sha256sum "$file" | awk '{print $1}')"
            last_changed_commit="$(git log -n 1 --format="%H" -- "$file" || echo "unknown")"

            {
              echo "  - path: $file"
              echo "    area: $area"
              echo "    function: $function_name"
              echo "    sub_function: $sub_function"
              echo "    module: $module"
              echo "    release_version: $VERSION"
              echo "    release_commit: ${{ github.sha }}"
              echo "    last_changed_commit: $last_changed_commit"
              echo "    sha256: $file_hash"
            } >> "$BASELINE_MANIFEST"
          done

          echo "Baseline manifest generated:"
          cat "$BASELINE_MANIFEST"

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail

          HEMS_ROOT="HEMS"
          VERSION="${{ inputs.version }}"
          CHECKSUM_FILE="$HEMS_ROOT/BASELINES/$VERSION/checksums.sha256"

          echo "Generating checksums..."

          : > "$CHECKSUM_FILE"

          find "$HEMS_ROOT/CODE_HEMS" "$HEMS_ROOT/MOD_HEMS" "$HEMS_ROOT/SPEC_HEMS" -type f 2>/dev/null | sort | while read -r file; do
            sha256sum "$file" >> "$CHECKSUM_FILE"
          done

          echo "Checksums generated at: $CHECKSUM_FILE"
          cat "$CHECKSUM_FILE"

      - name: Commit generated manifests
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"

          git add HEMS

          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
          else
            git commit -m "Generate release manifests for $VERSION"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Refresh commit after manifest push
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin "${{ github.ref_name }}"
          git reset --hard "origin/${{ github.ref_name }}"

      - name: Create release packages
        shell: bash
        run: |
          set -euo pipefail

          HEMS_ROOT="HEMS"
          VERSION="${{ inputs.version }}"

          mkdir -p release-assets/module-packages
          mkdir -p release-assets/baseline

          echo "Creating full release package..."
          zip -r "release-assets/HEMS-full-release-$VERSION.zip" \
            "$HEMS_ROOT/CODE_HEMS" \
            "$HEMS_ROOT/MOD_HEMS" \
            "$HEMS_ROOT/SPEC_HEMS" \
            "$HEMS_ROOT/BASELINES/$VERSION"

          echo "Creating code-level packages..."
          if [[ -d "$HEMS_ROOT/CODE_HEMS" ]]; then
            while IFS= read -r dir; do
              module="$(basename "$dir")"
              zip -r "release-assets/module-packages/code-${module}-$VERSION.zip" "$dir"
            done < <(find "$HEMS_ROOT/CODE_HEMS" -mindepth 3 -maxdepth 3 -type d | sort)
          fi

          echo "Creating module-level packages..."
          if [[ -d "$HEMS_ROOT/MOD_HEMS" ]]; then
            while IFS= read -r dir; do
              module="$(basename "$dir")"
              zip -r "release-assets/module-packages/module-${module}-$VERSION.zip" "$dir"
            done < <(find "$HEMS_ROOT/MOD_HEMS" -mindepth 3 -maxdepth 3 -type d | sort)
          fi

          echo "Creating specification-level packages..."
          if [[ -d "$HEMS_ROOT/SPEC_HEMS" ]]; then
            while IFS= read -r dir; do
              module="$(basename "$dir")"
              zip -r "release-assets/module-packages/spec-${module}-$VERSION.zip" "$dir"
            done < <(find "$HEMS_ROOT/SPEC_HEMS" -mindepth 3 -maxdepth 3 -type d | sort)
          fi

          cp "$HEMS_ROOT/BASELINES/$VERSION/baseline-manifest.yaml" "release-assets/baseline/baseline-manifest-$VERSION.yaml"
          cp "$HEMS_ROOT/BASELINES/$VERSION/checksums.sha256" "release-assets/baseline/checksums-$VERSION.sha256"

          echo "Release assets created:"
          find release-assets -type f | sort

      - name: Create Git tag
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"

          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"
          DELIVERY_CYCLE="${{ inputs.delivery_cycle }}"

          {
            echo "# HEMS Baseline $VERSION"
            echo ""
            echo "## Delivery Cycle"
            echo "$DELIVERY_CYCLE"
            echo ""
            echo "## Included Content"
            echo "- CODE_HEMS content"
            echo "- MOD_HEMS content"
            echo "- SPEC_HEMS content"
            echo "- Code-level manifests"
            echo "- Module-level manifests"
            echo "- Specification-level manifests"
            echo "- Baseline manifest with released files and versions"
            echo "- Checksums"
            echo ""
            echo "## Baseline Manifest"
            echo "HEMS/BASELINES/$VERSION/baseline-manifest.yaml"
            echo ""
            echo "## Generated By"
            echo "GitHub Actions"
          } > release-notes.md

          cat release-notes.md

      - name: Create GitHub Release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"

          gh release create "$VERSION" \
            release-assets/*.zip \
            release-assets/module-packages/*.zip \
            release-assets/baseline/*.yaml \
            release-assets/baseline/*.sha256 \
            --title "HEMS Baseline $VERSION" \
            --notes-file release-notes.md